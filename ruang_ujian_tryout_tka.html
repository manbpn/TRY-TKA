<!DOCTYPE html>
<html lang="id">
<head>

<style>
  :root{
    --bg:#F1EFE7;
    --paper:#FFFFFF;
    --ink:#1E2430;
    --ink-soft:#5B6272;
    --line:#DCD7C9;
    --accent:#2B5D50;
    --accent-soft:#DCE8E4;
    --accent-ink:#153029;
    --warn:#B5482D;
    --warn-soft:#F3DED6;
    --gold:#B08D3E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:28px 20px 60px;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  .brandbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px; margin-bottom:28px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces', serif; font-weight:700; font-size:16px;
  }
  .brand-name{font-family:'Fraunces', serif; font-size:19px; font-weight:600; letter-spacing:0.2px;}
  .brand-sub{font-size:12px; color:var(--ink-soft);}

  /* ---------- HOME ---------- */
  .home-hero{margin-bottom:32px;}
  .home-hero h1{font-size:32px; line-height:1.25; margin-bottom:10px;}
  .home-hero p{color:var(--ink-soft); font-size:15px; max-width:560px; line-height:1.6;}
  .paket-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px;
  }
  .paket-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .paket-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(30,36,48,0.08);}
  .paket-tag{
    align-self:flex-start; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:999px;
    font-weight:600;
  }
  .paket-card h3{font-size:18px; line-height:1.35;}
  .paket-meta{font-size:13px; color:var(--ink-soft); display:flex; gap:14px; margin-top:auto;}
  .paket-meta span{display:flex; align-items:center; gap:5px;}

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px;
    padding:11px 20px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    transition:opacity .12s ease;
  }
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn-warn{background:var(--warn); color:#fff;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---------- MODAL / CONFIRM ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,24,32,0.45); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper); border-radius:12px; padding:26px; max-width:420px; width:100%;
    display:flex; flex-direction:column; gap:16px;
  }
  .modal h3{font-size:19px;}
  .modal p{font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .modal label{font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:6px;}
  .modal input[type=number]{
    font-family:'IBM Plex Mono', monospace; font-size:15px; padding:9px 12px;
    border:1px solid var(--line); border-radius:8px; width:100px;
  }

  /* ---------- EXAM SCREEN ---------- */
  .exam-header{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 20px; margin-bottom:16px;
  }
  .exam-header .subtes{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .exam-header h2{font-size:18px;}
  .timer{
    font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--accent-ink);
    display:flex; align-items:center; gap:8px;
  }
  .timer.low{color:var(--warn);}
  .exam-body{display:grid; grid-template-columns:1fr 220px; gap:16px;}
  @media (max-width:720px){ .exam-body{grid-template-columns:1fr;} }

  .question-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px;
  }
  .q-index{font-size:12px; color:var(--ink-soft); margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em;}
  .q-stem{font-size:15.5px; line-height:1.75; white-space:pre-wrap; margin-bottom:20px;}
  .q-stem table{border-collapse:collapse; margin:10px 0; font-size:14px;}
  .options{display:flex; flex-direction:column; gap:9px;}
  .option{
    display:flex; align-items:flex-start; gap:12px; border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; cursor:pointer; font-size:14.5px; line-height:1.55;
  }
  .option:hover{border-color:var(--accent);}
  .option.selected{border-color:var(--accent); background:var(--accent-soft);}
  .option .bubble{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace;
    font-size:13px; font-weight:600; color:var(--ink-soft); margin-top:1px;
  }
  .option.selected .bubble{background:var(--accent); border-color:var(--accent); color:#fff;}

  .nav-buttons{display:flex; justify-content:space-between; margin-top:22px;}

  .sidebar{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
    height:fit-content;
  }
  .sidebar-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:12px;}
  .bubble-grid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:7px; margin-bottom:16px;
  }
  .nav-bubble{
    aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace;
    font-size:12px; cursor:pointer; color:var(--ink-soft);
  }
  .nav-bubble.answered{background:var(--accent); border-color:var(--accent); color:#fff;}
  .nav-bubble.current{border-color:var(--warn); border-width:2px; color:var(--ink); font-weight:700;}
  .nav-bubble.answered.current{background:var(--accent); color:#fff;}
  .legend{font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .legend span{display:flex; align-items:center; gap:7px;}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block;}
  .dot.answered{background:var(--accent);}
  .dot.unanswered{border:1.5px solid var(--line);}
  .progress-text{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}

  /* ---------- RESULT ---------- */
  .result-hero{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:32px; text-align:center; margin-bottom:20px;
  }
  .score-num{font-family:'Fraunces', serif; font-size:56px; font-weight:700; color:var(--accent-ink);}
  .score-label{color:var(--ink-soft); font-size:14px; margin-top:4px;}
  .result-stats{display:flex; justify-content:center; gap:28px; margin-top:20px;}
  .stat{text-align:center;}
  .stat b{font-size:20px; display:block; font-family:'IBM Plex Mono', monospace;}
  .stat span{font-size:12px; color:var(--ink-soft);}
  .review-list{display:flex; flex-direction:column; gap:10px;}
  .review-item{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
    font-size:14px;
  }
  .review-item.wrong{border-left:4px solid var(--warn);}
  .review-item.correct{border-left:4px solid var(--accent);}
  .review-item .rq{white-space:pre-wrap; margin-bottom:8px; color:var(--ink);}
  .review-item .ra{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  .review-item .ra b{color:var(--ink);}
  .review-item .pemb{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; color:var(--ink-soft);}
  .result-actions{display:flex; gap:10px; justify-content:center; margin:24px 0;}
  .filter-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .filter-tab{
    font-size:13px; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); cursor:pointer; color:var(--ink-soft);
  }
  .filter-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .hidden{display:none !important;}
  footer.note{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:40px; line-height:1.7;}
</style>
</head>

<script id="exam-data" type="application/json">{"ekonomi1": {"nama": "Tryout TKA Ekonomi - Paket 1", "mapel": "Ekonomi", "durasi": 60, "soal": [{"no": 1, "stem": "Pada musim hujan, produksi cabai merah menurun karena tanaman cabai mudah busuk. Akibatnya stok cabai merah terus berkurang sehingga harganya naik karena persediannya semakin langka.\nDampak dari kelangkaan ini bagi masyarakat yang paling tepat adalah....", "options": {"A": "membeli cabai merah impor meskipun harganya lebih tinggi dari pasaran", "B": "berhenti mengonsumsi cabai merah sampai harganya menjadi normal kembali", "C": "membeli cabai langsung dari petani di pedesaan agar harganya tangan pertama", "D": "mengganti cabai merah dengan cabai hijau atau cabai rawit yang rasanya mirip", "E": "tetap mengonsumsi cabai merah karena selera nusantara rekat dengan rasa cabai"}, "answer": "D"}, {"no": 2, "stem": "Di bawah ini adalah masalah pokok ekonomi:\n1. darimana diperoleh semua benda (barang dan jasa) yang dibutuhkan oleh banyak orang.\n2. barang dan jasa apa saja yang akan diproduksi dan dalam jumlah berapa\n3. bagaimana benda-benda yang telah diproduksi bisa sampai ke tangan konsumen yang membutuhkan\n4. dengan cara bagaimana proses produksi akan dilakukan\n5. untuk siapa barang dan jasa diproduksi\nDari pernyataan di atas, yang merupakan masalah pokok ekonomi menurut aliran ekonomi modern adalah ... .", "options": {"A": "1, 2, dan 3", "B": "1, 2, dan 4", "C": "1, 3, dan 5", "D": "2, 3, dan 4", "E": "2, 4, dan 5"}, "answer": "E"}, {"no": 3, "stem": "Hak milik atas alat produksi di tangan perorangan atau swasta, Harga barang ditentukan oleh permintaan dan penawaran di pasar, Adanya persaingan bebas, Tidak ada campur tangan pemerintah dalam perekonomian, Modal memegang peranan penting, Terbuka kesempatan bagi individu untuk mengejar keuntungan. Masyarakat yang seperti itu biasanya menganut sistem ekonomi ….", "options": {"A": "Pasar bebas", "B": "Campuran", "C": "Tradisional", "D": "Terpusat", "E": "Etatisme"}, "answer": "A"}, {"no": 4, "stem": "Perhatikan Circular Flow diagram, dengan arus bernomor 1-12 yang menghubungkan RTK, Pasar Barang dan Jasa, Pemerintah, RTP, dan Pasar Faktor Produksi.\nDari circular flow diagram di atas, interpretasi nomor 5 adalah….", "options": {"A": "Barang dan jasa", "B": "Pajak", "C": "Subsidi", "D": "Gaji, sewa, bunga dan laba", "E": "Alam, Tk, Modal dan Kewirausahaan"}, "answer": "A"}, {"no": 5, "stem": "Perhatikan data di kantin SMA Sukses Mulia pada Maret 2017 berikut ini:\nHarga | Jumlah Permintaan (potong) | Jumlah Penawaran (potong)\nRp2.000,00 | 40 | 60\nRp3.000,00 | 30 | 70\nBerdasarkan data di atas, maka titik keseimbangan pasar (Q;P) adalah ....", "options": {"A": "(15; 500)", "B": "(15; 4.500)", "C": "(50; 1.000)", "D": "(2.500; 50)", "E": "(5.500; 35)"}, "answer": "C"}, {"no": 6, "stem": "Perhatikan tabel berikut:\nHarga per unit | Jumlah barang yang diminta\n50 | 50\n60 | 45\nBerdasarkan data tersebut maka koefisien elastisitas permintaannya adalah ....", "options": {"A": "0", "B": "0,5", "C": "0,8", "D": "1", "E": "Tak terhingga"}, "answer": "D"}, {"no": 7, "stem": "Beberapa kegiatan ekonomi masyarakat pada pasar output dan input sebagai berikut:\n(1) Adinda pergi ke taman kuliner membeli rujak es krim kegemarannya.\n(2) Bapak Ali sudah lama menjadi eksportir batik ke luar negeri\n(3) Bapak Agung berencana menginvestasikan uangnya dalam bentuk saham\n(4) Setelah lulus SMA, Budi mencari info lowongan kerja melalui Job Fair di JEC\n(5) Semua warga masyarakat yang memenuhi syarat boleh mendaftar sebagai PNS\n(6) Najib gemar membuat kue, sehingga ia bercita-cita menjadi pengusaha kue yang sukses\nKegiatan diatas yang merupakan kegiatan pasar Input ditunjukkan oleh ….", "options": {"A": "(1), (2), dan (3)", "B": "(1), (3) dan (4)", "C": "(2) (3) dan (5)", "D": "(3) (4) dan (5)", "E": "(4) (5) dan (6)"}, "answer": "D"}, {"no": 8, "stem": "Pemerintah mempunyai wewenang menetapkan harga dasar tarif listrik yang dijual oleh PLN. Dalam 1 tahun dapat mungkin terjadi kenaikan harga dasar listrik beberapa kali, bahkan terjadi juga penurunan harga. Masyarakat akan mengikuti berapapun harga tersebut karena sangat membutuhkan listrik. Dalam hal ini listrik yang dijual oleh PLN merupakan salah contoh kegiatan dalam pasar... .", "options": {"A": "Monopoli", "B": "Monopsoni", "C": "Monopolistik", "D": "Oligopoli", "E": "Oligopsoni"}, "answer": "B"}, {"no": 9, "stem": "Bank sentral melakukan penjualan surat berharga di pasar modal. Hal tersebut dilakukan untuk menstabilkan aliran uang dan barang dalam ekonomi sehingga inflasi dapat diatasi. Kebijakan yang dilakukan bank sentral ini sering disebut … .", "options": {"A": "Kebijakan kredit selektif", "B": "Politik pasar terbuka", "C": "Politik cadangan kas", "D": "Politik diskonto", "E": "Sanering"}, "answer": "B"}, {"no": 10, "stem": "Negara Berdikari memiliki data kecepatan peredaran uang sebesar 0,4 dan harga pasar kisaran Rp80.000,00. Jika jumlah transaksi yang terjadi pada periode tersebut adalah 500.000 unit, maka besar jumlah uang beredar adalah ....", "options": {"A": "Rp100.000.000.000,-", "B": "Rp20.000.000.000,-", "C": "Rp16.000.000.000,-", "D": "Rp10.000.000.000,-", "E": "Rp8.000.000.000,-"}, "answer": "A"}, {"no": 11, "stem": "Menurut Pasal 4 UU Nomor 21 Tahun 2011, Otoritas Jasa Keuangan dibentuk untuk menyelenggarakan sistem pengaturan dan pengawasan yang terpadu terhadap keseluruhan kegiatan dalam sektor jasa keuangan.\nBerdasarkan ilustrasi di atas, yang merupakan fungsi OJK adalah ....", "options": {"A": "menetapkan peraturan pengenaan sanksi sesuai ketentuan perundang-undangan", "B": "mengelola laporan keuangan jasa keuangan sesuai keinginan jasa keuangan", "C": "membuat sistem pengawasan otoriter di semua jasa keuangan", "D": "memberikan pengawasan yang longgar kepada jasa keuangan yang tidak tertib", "E": "melakukan pemeriksaan keuangan jasa perbankan secara subjektif"}, "answer": "D"}, {"no": 12, "stem": "Merupakan suatu kegiatan yang berusaha untuk mengendalikan agar pelaksanaan dapat berjalan sesuai dengan rencana dan memastikan apakah tujuan organisasi tercapai. Apabila terjadi penyimpangan di mana letak penyimpangan itu dan bagaimana pula tindakan yang diperlukan untuk mengatasinya. Kegiatan ini ada dalam fungsi manajemen …..", "options": {"A": "Planning", "B": "Organizing", "C": "Controlling", "D": "Staffing", "E": "Actuating"}, "answer": "C"}, {"no": 13, "stem": "Persekutuan dua orang atau lebih untuk mendirikan usaha dimana satu atau beberapa orang sebagai sekutu yang hanya menyerahkan modal dan sekutu lainnya yang menjalankan perusahaan. Jadi dalam persekutuan ini dikenal dua sekutu, yaitu sekutu aktif atau sekutu bekerja atau sekutu komplementer, yaitu sekutu yang berhak memimpin perusahaan dan sekutu pasif atau sekutu tidak bekerja, yaitu sekutu yang hanya menyerahkan modalnya saja. Bentuk badan usaha ini yang dimaksud adalah …..", "options": {"A": "Firma", "B": "CV", "C": "PT", "D": "Perusahaan Perseorangan", "E": "Yayasan"}, "answer": "B"}, {"no": 14, "stem": "Berikut ini data yang digunakan untuk perhitungan pendapatan nasional Negara Suryakencana.\nUpah Rp850 miliar; Bunga modal Rp200 miliar; Laba usaha Rp200 miliar; Sewa tanah Rp350 miliar; Pengeluaran rumah tangga Rp800 miliar; Belanja pemerintah Rp500 miliar; Investasi Rp600 miliar; Ekspor Rp100 miliar.\nJika pendapatan nasional dihitung menggunakan pendekatan pengeluaran menghasilkan Rp1.950 miliar, maka nilai impornya adalah ….", "options": {"A": "Rp50 miliar", "B": "Rp100 miliar", "C": "Rp500 miliar", "D": "Rp550 miliar", "E": "Rp600 miliar"}, "answer": "A"}, {"no": 15, "stem": "Perhatikan pernyataan-pernyataan berikut!\n(1). Masyarakat semakin merata pendapatannya\n(2). Pendidikan yang semakin maju meningkatkan kualitas sumber daya manusia\n(3). Kerja sama ekonomi internasional ditingkatkan untuk memperbesar devisa negara\n(4). Potensi sumber daya alam digunakan secara efisien efektif\n(5). Produk barang dan jasa yang dihasilkan penduduk suatu negara semakin banyak\nBerdasarkan pernyataan di atas, yang berkaitan dengan pembangunan ekonomi adalah nomor ...", "options": {"A": "(1), (2), (3)", "B": "(1), (2), (4)", "C": "(1), (3), (5)", "D": "(2), (3), (4)", "E": "(3), (4), (5)"}, "answer": "B"}, {"no": 16, "stem": "Berikut adalah beberapa permasalahan yang dihadapi oleh pemerintah dalam pembangunan ekonomi:\n(1) Rendahnya kesempatan kerja\n(2) Sulitnya menurunkan laju inflasi\n(3) Konflik dalam partai peserta pemilu\n(4) Menyebarnya berita kebohongan.\n(5) Defisit neraca perdagangan dalam kegiatan ekspor impor\nBerdasarkan permasalahan-permasalahan di atas, yang termasuk masalah yang dihadapi oleh pemerintah dalam bidang ekonomi adalah nomor….", "options": {"A": "(1), (2), dan (3)", "B": "(1), (2), dan (5)", "C": "(2), (3), dan (4)", "D": "(2), (4), dan (5)", "E": "(3), (4), dan (5)"}, "answer": "B"}, {"no": 17, "stem": "Komposisi penduduk di daerah suatu negara pada tahun 2018 sebagai berikut:\n(1) Jumlah penduduk yang berusia 15-64 tahun 5 juta jiwa\n(2) Jumlah penduduk di bawah 15 tahun dan di atas 64 tahun 1 juta jiwa\n(3) Jumlah ibu rumah tangga dan anak sekolah 2 juta jiwa\n(4) Jumlah penduduk berusia 15-64 tahun yang sedang mencari pekerjaan 15% dari jumlah penduduk usia kerja\n(5) Jumlah penduduk yang bekerja 20% dari penduduk usia kerja\nBerdasarkan data di atas yang dapat digolongkan angkatan kerja ditunjukkan pada nomor:", "options": {"A": "(1) dan (2)", "B": "(2) dan (3)", "C": "(2) dan (4)", "D": "(3) dan (4)", "E": "(4) dan (5)"}, "answer": "D"}, {"no": 18, "stem": "Perhatikan tabel daftar harga hasil pertanian pada 5 desa (Sukarasa, Sukamakmur, Sukaramai, Sukajati, Sukawarna) untuk komoditas Tomat, Cabai, Kedelai tahun 2015 dan 2016 (dalam rupiah).\nData Indeks Bayar (IB) petani pada tahun 2016: Sukarasa = 111%; Sukamakmur = 118%; Sukaramai = 119%; Sukajati = 108%; Sukawarna = 115%.\nBerdasarkan data di atas, maka kesimpulan yang tepat adalah …", "options": {"A": "Petan hatikan pernyataan berikut:\n1) Indonesia negara yang kaya akan sumber daya laut sehingga menjadi pengekspor ikan ke beberapa negara yang tidak memiliki sumber daya ikan.\n2) walaupun dengan biaya yang sangat mahal Indonesia tetap memproduksi handphone untuk bisa bersaing dengan china\n3) Mobil dari Jepang dan Amerika paling menguasai pasaran internasional karena teknologinya yang sangat canggih, sehingga sangat nyaman dan aman untuk dikendarai dibanding mobil dari negara lain.\n4) Masyarakat Indonesia sudah semakin makmur ditandai dengan semakin meningkatnya impor kendaraan dari jepang\n5) Indonesia masih sering mengimpor beras dari Thailand karena produksi dalam negeri belum mencukupi sedangkan beras bagi lidah masyarakat indonesia tidak bisa digantikan bahan makan lain\nYang mencerminkan pendorong perdagangan Internasional ditunjukkan nomor..", "options": {"A": "1, 2 dan 3", "B": "2, 3 dan 5", "C": "1, 3 dan 5", "D": "3, 4 dan 5", "E": "2, 4 dan 5"}, "answer": "C"}, {"no": 23, "stem": "Perhatikan beberapa transaksi yang dilakukan oleh negara Bhineka Selaras berikut ini!\n(1) mengimpor kebutuhan mesin elektronik yang tidak dimiliki.\n(2) mengirimkan tenaga kerja terlatih ke negara-negara tetangga.\n(3) membayar pokok dan bunga hutang yang jatuh tempo.\n(4) mengekspor hasil olahan perkebunan berkualitas tinggi.\n(5) menerima dana hibah penelitian ristek di bidang pertambangan.\nKegiatan yang merupakan sumber devisa bagi negara Bhineka Selaras ditunjukkan nomor ....", "options": {"A": "(1), (2), dan (3)", "B": "(1), (2), dan (5)", "C": "(2), (3), dan (4)", "D": "(2), (3), dan (5)", "E": "(2), (4), dan (5)"}, "answer": "E"}, {"no": 24, "stem": "Kurs Valuta Asing adalah perbandingan nilai mata uang asing yang dinyatakan dengan nilai mata uang dalam negeri. Macam-macam kurs: Kurs Jual, harga saat bank menjual valas (misal US$1 = Rp9.095,-). Kurs Beli, harga saat bank membeli valas (misal US$1 = Rp9.070,-).\nApabila kurs valuta asing tidak stabil dan selalu mengalami fluktuasi secara cepat maka kemungkinan situasi yang terjadi adalah ….", "options": {"A": "Ekspor akan meningkat", "B": "Produksi meningkat", "C": "Hutang meningkat", "D": "Spekulan meningkat", "E": "Pengangguran meningkat"}, "answer": "D"}, {"no": 25, "stem": "Bentuk Kerjasama ekonomi internasional dapat dilakukan dalam berbagai bentuk. Salah satunya adalah kerjasama ekonomi yang dilakukan oleh negara-negara yang berada dalam satu kawasan seperti ASEAN, Uni Eropa, LAFTA, ECOWAS. Bentuk kerjasama tersebut termasuk dalam kerjasama", "options": {"A": "Antar Regional", "B": "Bilateral", "C": "Global", "D": "Multilateral", "E": "Regional"}, "answer": "E"}, {"no": 26, "stem": "Perhatikan analisis transaksi:\n1. Diterima setoran modal dari Mbak Ara berupa uang tunai Rp50.000.000,- dan peralatan salon Rp20.000.000,-: Kas bertambah di Debet Rp50.000.000,-, Peralatan bertambah di debet Rp20.000.000,- dan Modal bertambah di kredit Rp50.000.000,-\n2. Menerima pinjaman dari bank sebesar Rp25.000.000,- dipotong biaya administrasi Rp1.000.000,-: kas (+) di Debet Rp25.000.000,- dan utang bank (+) di kredit Rp25.000.000,-\n3. Membeli perlengkapan salon Rp3.000.000,- dibayar tunai Rp2.000.000,- sisanya kredit: harta perlengkapan (+) di Debit Rp3.000.000,-, kas (-) di kredit Rp2.000.000,- dan utang (+) di kredit sebesar Rp1.000.000,-\n4. Diselesaikan pekerjaan merias pengantin sebesar Rp7.000.000,- diterima tunai Rp5.000.000,- kekurangannya minggu depan: kas (+) di Debet Rp5.000.000,- dan piutang (+) di Debit Rp2.000.000,- dan pendapatan (+) di kredit Rp7.000.000,-\n5. Dibayar gaji pekerja 3 orang masing-masing Rp1.000.000,-: beban gaji (+) di Debet Rp3.000.000,- dan Kas (-) di Kredit Rp3.000.000,-\nAnalisis transaksi di atas yang benar adalah ....", "options": {"A": "1, 2, dan 3", "B": "1, 3, dan 4", "C": "2, 3, dan 4", "D": "2, 4, dan 5", "E": "3, 4, dan 5"}, "answer": "E"}, {"no": 27, "stem": "Perhatikan bukti transaksi: Copy bukti kuitansi No 021, Sudah terima dari Dyah Ayu Tenan, g paling efisien dengan prosentase laba terbaik adalah PD Niak (laba dibanding modal)"}, "answer": "D"}]}, "ekonomi2": {"nama": "Tryout TKA Ekonomi - Paket 2", "mapel": "Ekonomi", "durasi": 60, "soal": [{"no": 1, "stem": "Fernanda memutuskan untuk membuka usaha produksi makanan dan jajanan anak-anak. Untuk mengeluti usaha tersebut Fernanda memutuskan untuk meninggalkan pekerjaannya di super market dimana saat ia bekerja memperoleh gaji sebesar Rp 1.300.000,- setiap bulan. Sebagai modal ia menggunakan uang tabungan sebesar Rp 5.000.000,-. Jika ia tabung di bank, uang tersebut menghasilkan bunga Rp 150.000,-. Dalam bulan pertama, rincian biaya dan pendapatan usaha Fernanda adalah sebagai berikut:\nBiaya:\n- Membayar gaji 2 karyawan: Rp 1.800.000,-\n- Membeli tambahan alat-alat produksi: Rp 1.000.000,-\n- Membeli bahan-bahan produksi: Rp 1.500.000,-\n- Biaya operasional harian: Rp 700.000,-\nTOTAL BIAYA (eksplisit): Rp 5.000.000,-\nPendapatan:\n- Hasil penjualan bulan pertama: Rp 6.200.000,-\n- Laba = Hasil penjualan - total biaya = Rp 1.200.000,-\nMaka biaya peluang yang timbul akibat pilihan Sdr Fernanda adalah ...", "options": {"A": "Rp 1.000.000,-", "B": "Rp 1.200.000,-", "C": "Rp 1.300.000,-", "D": "Rp 1.700.000,-", "E": "Rp 5.000.000,-"}, "answer": "C"}, {"no": 2, "stem": "Di bawah ini adalah masalah-masalah yang berhubungan dengan ekonomi:\n1. Bagaimana menggunakan sumber ekonomi yang terbatas untuk memenuhi kebutuhan yang sebaik-baiknya\n2. Berapa banyak barang yang akan diproduksi dan disalurkan kepada masyarakat\n3. Kurangnya distribusi pendapatan\n4. Tingginya laju inflasi negara berkembang atau pemerataan pendapatan negara\n5. Teknologi yang digunakan untuk memproduksi barang\nYang termasuk inti masalah pokok ekonomi adalah ...", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 4", "C": "3, 4 dan 5", "D": "2, 3 dan 4", "E": "1, 2 dan 5"}, "answer": "E"}, {"no": 3, "stem": "Berikut ini kelemahan suatu sistem ekonomi:\nNo | A | B | C\n1 | Hak milik individu sang  maka besarnya Pajak Bumi dan Bangunan (PBB) berdasarkan UU yang berlaku adalah ...", "options": {"A": "Rp 273.000,00", "B": "Rp 263.000,00", "C": "Rp 261.000,00", "D": "Rp 260.000,00", "E": "Rp 253.000,00"}, "answer": "C"}, {"no": 23, "stem": "Perhatikan tabel teori perdagangan internasional berikut ini:\nNegara | Produksi Batik Tulis/hari | Produksi Televisi/hari | Dasar Tukar Dalam Negeri\nIndonesia | 30 unit | 10 unit | 1 T : 3 B\nSingapura | 40 unit | 20 unit | 1 T : 2 B\nJika Indonesia menukarkan sebanyak 600 Batik Tulis dengan Televisi, maka analisis yang dapat diambil dari data tersebut:\n1. Konsep analisis keuntungan komparatif\n2. Konsep analisis keuntungan mutlak\n3. Indonesia berspesialisasi pada produksi Batik Tulis dan Singapura pada produksi Televisi\n4. Singapura berspesialisasi pada produksi Batik Tulis dan Televisi\n5. Besarnya keuntungan mutlak untuk Indonesia sebesar 100\n6. Besarnya keuntungan Komparatif untuk Indonesia sebesar 100\nBerdasarkan analisis tersebut, yang benar adalah ...", "options": {"A": "1, 3 dan 5", "B": "1, 3 dan 6", "C": "2, 4 dan 5", "D": "3, 4 dan 6", "E": "4, 5 dan 6"}, "answer": "B"}, {"no": 24, "stem": "Perhatikan bagian neraca pembayaran berikut ini:\n1. Pembelian saham orang luar negeri di Indonesia\n2. Ekspor dan impor barang-barang dagangan\n3. Transaksi jasa-jasa\n4. Penanaman modal orang Indonesia di Luar Negeri\n5. Investasi langsung penduduk luar negeri di Indonesia\n6. Adanya turis mancanegara yang berlibur di Indonesia\nYang dikategorikan dalam transaksi berjalan (Current Account) adalah ...", "options": {"A": "1, 2 dan 3", "B": "2, 3 dan 6", "C": "1, 3 dan 5", "D": "2, 4 dan 6", "E": "4, 5 dan 6"}, "answer": "B"}, {"no": 25, "stem": "Mak Ciek ingin pergi ke Bombay, India. Dia tukarkan rupiah miliknya senilai Rp 3.000.000,00 dengan Rupee. Pada saat itu kurs yang berlaku: Kurs beli 1 INR = Rp 227,00 dan Kurs jual 1 INR = Rp 240,00, kurs tengah 1 INR = Rp 233,50. Setelah 5 hari di Bombay ia pulang ke Indonesia, s
