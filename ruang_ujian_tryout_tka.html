asan dari Toko Alibaba.\nDari transaksi di atas, jurnal yang dibuat Toko Wicaksono tanggal 24 Juni adalah ....", "options": {"A": "Utang Dagang Rp16.000.000 / Potongan Pembelian Rp480.000 & Kas Rp15.520.000", "B": "Utang Dagang Rp16.000.000 / Kas Rp16.000.000", "C": "Utang Dagang Rp21.000.000 / Potongan Pembelian Rp630.000 & Kas Rp20.370.000", "D": "Kas Rp15.520.000 & Potongan Penjualan Rp480.000 / Piutang Dagang Rp16.000.000", "E": "Kas Rp20.370.000 & Potongan Penjualan Rp630.000 / Piutang Dagang Rp21.000.000"}, "answer": "D"}, {"no": 37, "stem": "Perhatikan jurnal khusus Jurnal Penerimaan Kas: 5/3 Toko Baru Kas 5.000.000/Penjualan 5.000.000; 12/3 BRI cab. Wonosari Kas 10.000.000/Utang Bank 10.000.000; 19/3 Toko Ibu Kas 11.640.000, Potongan Penjualan 360.000/Piutang Dagang 12.000.000; 23/3 Toko ABC Kas 3.000.000/Peralatan Toko 3.000.000; 30/3 Toko Mirah Kas 8.730.000, Potongan Penjualan 270.000/Piutang Dagang 9.000.000. Jumlah: Kas 38.370.000, Potongan Penjualan 630.000, Piutang Dagang 21.000.000, Penjualan 5.000.000, Serba-serbi 13.000.000.\nBerdasarkan jurnal khusus di atas posting ke buku besar (Kas, Penjualan, Potongan Penjualan, Piutang Dagang, Utang Bank) - posting yang benar adalah ....", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 4", "C": "1, 3 dan 5", "D": "2, 4 dan 5", "E": "3, 4 dan 5"}, "answer": "C"}, {"no": 38, "stem": "Berikut ini disajikan sebagian transaksi PD. ILALANG dalam bulan Sept 2021: Tgl 5 Dibeli barang dagang dari Toko Manto sejumlah Rp70.000.000,- dengan syarat 3/10, n/30. Tgl 6 Dikirim nota debit pada Toko Manto seharga Rp5.000.000,-. Tgl 15 Dilunasi utang kepada Toko Manto.\nTransaksi tanggal 15 Sept 2021 oleh PD ILALANG dicatat dalam buku pembantu ....", "options": {"A": "Utang atas nama Toko Manto di Debet sebesar Rp65.000.000,-", "B": "Utang atas nama Toko Manto di Debet sebesar Rp63.050.000,-", "C": "Utang atas nama Toko Manto di Kredit sebesar Rp65.000.000,-", "D": "Piutang atas nama Toko Manto di Kredit sebesar Rp65.000.000,-", "E": "Piutang atas nama Toko Manto di Kredit sebesar Rp63.050.000,-"}, "answer": "A"}, {"no": 39, "stem": "Berikut adalah sebagian Neraca sisa milik UD LINDA pada 31 Desember 2021 (dalam ribuan Rupiah): Persediaan barang dagang (D) 10.000; Pembelian (D) 90.000; Beban angkut pembelian (D) 3.000; Potongan pembelian (K) 1.800; Retur pembelian (K) 5.000; HPP -.\nData Penyesuaian: Persediaan barang dagang hasil perhitungan phisik sebesar Rp7.000.000.\nPenyelesaian kertas kerja sebagian UD LINDA jika penyesuaian persediaan barang memakai metode HPP - yang benar adalah....", "options": {"A": "1, 2, 3 dan 4", "B": "1, 2, 4 dan 5", "C": "1, 3, 5 dan 6", "D": "2, 3, 4 dan 6", "E": "3, 4, 5 dan 6"}, "answer": "C"}, {"no": 40, "stem": "Perhatikan data keuangan berikut ini:\nNo | Keterangan | Toko Bangun | UD Agus | PD Niak\n1 | Penjualan bersih | 170.000.000 | 90.000.000 | 70.000.000\n2 | HPP | 90.000.000 | 75.000.000 | 25.000.000\n3 | Beban penjualan | 20.000.000 | 8.500.000 | 12.500.000\n4 | Beban Adm. Umum | 12.500.000 | 7.500.000 | 4.500.000\n5 | Laba Luar Usaha | 10.000.000 | 1.000.000 | 2.000.000\n6 | Modal Awal | 100.000.000 | 50.000.000 | 60.000.000\nBerdasarkan data di atas maka pernyataan yang benar adalah....", "options": {"A": "Dari tiga perusahaan laba kotor yang paling besar Toko Bangun Rp80.000.000 paling kecil PD Niak Rp45.000.000", "B": "Laba sebelum pos luar usaha Toko Bangun Rp47.500.000, UD Agus Rp1.000.000 dan PD Niak Rp28.000.000", "C": "Laba sebelum pajak Toko Bangun Rp57.500.000, UD Agus Rp1.000.000 dan PD Niak Rp30.000.000", "D": "Perusahaan yang mengalami BEP (Break Even Point) tidak untung tidak rugi adalah UD Agus", "E": "Perusahaan yang paling efisien dengan prosentase laba terbaik adalah PD Niak (laba bersih dibanding modal)"}, "answer": "D"}]}, "bindo": {"nama": "Tryout TKA Bahasa Indonesia", "mapel": "Bahasa Indonesia", "durasi": 60, "soal": [{"no": 1, "stem": "Bacalah puisi berikut!\nKANGEN - W.S. Rendra\nKau tak akan mengerti bagaimana kesepianku menghadapi kemerdekaan tanpa cinta\nKau tak akan mengerti segala lukaku karna cinta telah sembunyikan pisaunya.\nMembayangkan wajahmu adalah siksa.\nKesepian adalah ketakutan dalam kelumpuhan.\nEngkau telah menjadi racun bagi darahku.\nApabila aku dalam kangen dan sepi\nItulah berarti\naku tungku tanpa api.\n...\nMakna frasa 'tungku tanpa api' pada puisi di atas adalah…", "options": {"A": "mendambakan sesuatu", "B": "berhati kosong", "C": "tak berarti", "D": "kesepian", "E": "tersiksa"}, "answer": "D"}, {"no": 2, "stem": "Bacalah teks berikut dengan saksama!\nRoni … mengikuti bayangan hitam yang baru saja berkelebat. Hatinya …. Lalu, ia … menghunus belati yang diselipkan di pinggangnya. Bayangan itu berjalan semakin cepat. Roni tidak ingin ketinggalan. Ia … meningkatkan kecepatan berjalannya juga. Tetapi … bayangan itu lenyap dari pandangannya. Roni terkesiap.\nKata ulang yang tepat untuk mengisi bagian rumpang teks di atas adalah….", "options": {"A": "mengendap-endap, berdebar-debar, pelan-pelan, buru-buru, tiba-tiba", "B": "diam-diam, dag dig dug, mengendap-endap, tiba-tiba, buru-buru", "C": "cepat-cepat, berdebar-debar, tiba-tiba, lama-lama, pelan-pelan", "D": "cepat-cepat, berdebar-debar, buru-buru, tiba-tiba, pelan-pelan", "E": "berdebar-debar, kebat-kebit, serta-merta, tiba-tiba, pelan-pelan"}, "answer": "A"}, {"no": 3, "stem": "Bacalah teks berikut dengan saksama!\n1. Alasannya, hal tersebut bisa berimplikasi besar terhadap tugas-tugasnya.\n2. Pria kelahiran Situbondo, 22 Mei 1948 ini pernah menjadi hakim agung selama 18 tahun lebih.\n3. Atau rata-rata setiap tahunnya dia menangani 1.095 perkara.\n4. Sebelum menjadi Hakim Agung pada 2000, Artidjo berkarier sebagai advokat selama 28 tahun.\n5. Selama menjabat, Artidjo tak pernah mengambil cuti dan selalu menolak ketika diajak ke luar negeri.\n6. Saat menjabat sebagai hakim agung, 19.708 berkas perkara pernah ia tangani.\nAgar menjadi teks naratif objektif yang baik, urutan kalimat pada teks di atas adalah….", "options": {"A": "(2), (4), (3), (5), (6), (1)", "B": "(2), (4), (6), (3), (5), (1)", "C": "(3), (5), (1), (2), (4), (6)", "D": "(4), (5), (3), (6), (2), (1)", "E": "(4), (5), (3), (2), (1), (6)"}, "answer": "B"}, {"no": 4, "stem": "Bacalah teks berikut dengan saksama!\nHampir seluruh keluarga Sestrokusuman telah siap.\nPak Bei telah berdandan pakaian Jawa sempurna. Hanya mengangkat alis sedikit - kalau Ni tidak salah lirik. Tetap gagah dengan hidung mancung, kulit bersih, dan yang membuat Ni kagum ialah bahwa ayahnya ini selalu tampak hadir. Ruangan bisa menjadi kosong tanpa kehadiran Pak Bei. Sekarang ini pun terasakan, bahwa getaran paling kuat, walau hanya dengan mengangkat alis, itu pun tipis, dari tempatnya berdiri.\n(Canting, Arswendo Armowiloto)\nUlasan yang tepat untuk teks di atas adalah…", "options": {"A": "Novel ini mengangkat budaya Jawa dengan cara yang sangat mengagumkan.", "B": "Dengan membaca novel ini pembaca tidak hanya mengenal budaya Jawa, tetapi bisa seolah mengalami sendiri nuansa kejawaan yang kental.", "C": "Novel ini terlalu berlebihan dalam menggambarkan watak Pak Bei karena sangat sulit mencari orang sesempurna Pak Bei.", "D": "Penampilan keluarga Pak Bei menunjukkan betapa tingginya budaya leluhur kita.", "E": "Kekaguman tokoh Ni pada ayahnya terlalu berlebihan sehingga membuat novel ini terkesan picisan."}, "answer": "B"}, {"no": 5, "stem": "Bacalah puisi berikut!\nAKU BERKACA - Chairil Anwar\nIni muka penuh luka\nSiapa punya?\nKu dengar seru menderu\nDalam hatiku\nApa hanya angin lalu?\nLagi lain pula\nMenggelepar tengah malam buta\nAh..!!!\n….\nSegala tak ku kenal..!!!\nSelamat tinggal…!!\nLarik yang tepat untuk mengisi bagian rumpang puisi di atas adalah...", "options": {"A": "Aku tak mengenal, aku bebal", "B": "Bahagiaku mental, aku terjungkal", "C": "Segala menebal, segala mengental", "D": "Darah mengental, tangan mengepal", "E": "Tangan mengepal, memaksa untuk tinggal"}, "answer": "D"}, {"no": 6, "stem": "Bacalah teks berikut dengan saksama!\nJalan-jalan di pinggir kali\nBertemu ikan di dalam bubu\nJika ibu menasihati\n…\nLarik yang tepat untuk melengkapi pantun di atas adalah…", "options": {"A": "Janganlah membuat emosimu menderu", "B": "Jalanilah dengan kesungguhan hati", "C": "Masukkanlah ke dalam kalbu", "D": "Turutilah sepenuh hati", "E": "Tutuplah telingamu"}, "answer": "C"}, {"no": 7, "stem": "Bacalah teks berikut dengan saksama!\nPermasalahan: Sekarang dunia baru menggembar-gemborkan pengurangan sampah plastik. Di supermarket-supermarket kantong plastik berbayar agar pembeli menyediakan kantong belanja sendiri. Di berbagai sudut kampung terpampang berbagai macam cara untuk kampanye pengurangan sampah plastik.\nPendapat 1: Sebenarnya penggunaan bahan plastik tidak perlu dilarang. Penggunaan plastik sebenarnya salah satu wujud cinta lingkungan. Bayangkan kalau kantong plastik dihilangkan. Pasti akan banyak penggunaan kantong-kantong kertas dan kain. Ingat, kedua bahan tersebut dibuat dari tumbuhan. Penghapusan bahan plastik akan meningkatkan penebangan pohon yang berarti perusakan lingkungan hidup.\nPendapat 2: Walau bagaimana pun pelarangan penggunaan plastik tetap harus digalakkan. Kita harus melindungi bumi dari plastik. Jika plastik terlalu banyak, bumi akan tercemar. Plastik adalah zat yang tidak dapat membusuk dalam waktu puluhan tahun. Hal itu sangat membahayakan bumi.\nRumusan pendapat yang paling tepat dari pendapat-pendapat di atas adalah…", "options": {"A": "Demi menjaga bumi kita, seyogianya kita mengurangi semua jenis sampah baik itu sampah plastik maupun nonplastik.", "B": "Pengurangan sampah nonplastik lebih penting daripada sampah plastik karena membahayakan bumi.", "C": "Demi menjaga lingkungan hidup, penggunaan kantong plastik tidak perlu dilarang.", "D": "Demi menjaga lingkungan hidup, penggunaan kantong plastik harus dilarang keras.", "E": "Pengurangan sampah plastik lebih penting daripada sampah nonplastik."}, "answer": "A"}, {"no": 8, "stem": "Bacalah teks berikut dengan saksama!\nSelain pertambahan usia, faktor lingkungan berpengaruh pada perubahan kulit, terutama dampaknya kepada proses alami penuaan kulit. Ahli kulit sehat juga mengatakan bahwa sinar matahari menjadi penyebab utama dari kerusakan kulit karena adanya kandungan sinar ultraviolet dan radikal bebas. Paparan sinar ultraviolet (UV) yang berlebihan dari matahari pada dasarnya bersifat merusak sebagaimana efeknya dapat merusak kolagen dan elastin. Elastin adalah protein di dalam jaringan kulit yang membuatnya terasa lembut dan tampak kenyal.\nInti informasi yang terdapat pada teks di atas adalah…", "options": {"A": "Elastin adalah protein di dalam jaringan kulit.", "B": "Matahari menjadi penyebab utama kerusakan kulit.", "C": "Berbagai faktor yang memengaruhi perubahan kulit.", "D": "Faktor lingkungan berpengaruh pada perubahan kulit.", "E": "Penambahan usia berpengaruh pada perubahan kulit."}, "answer": "C"}, {"no": 9, "stem": "Bacalah teks berikut dengan saksama!\nTeks 1: Sinar UV berdampak kepada proses pigmentasi kulit. Dalam hal ini, efek negatif sinar UV dapat memicu kemunculan keriput, bintik-bintik cokelat, bahkan risiko kanker kulit. Belum lagi, tingginya radikal bebas turut berperan kepada pertumbuhan kanker kulit. Di sisi lain, merokok dan polusi udara dapat mengurangi kolagen dan mengakibatkan proses penuaan kulit prematur.\nTeks 2: Kulit juga berfungsi sebagai pertahanan pertama tubuh untuk melawan kuman dan kondisi lingkungan. Kulit juga dapat mengubah sinar matahari menjadi vitamin D. Lapisan lemak yang berada di bawah permukaan kulit membantu memastikan bahwa cairan penting di dalam tubuh tetap berada di dalam tubuh.\nPerbedaan isi kedua teks di atas adalah…", "options": {"A": "Teks 1 membahas efek sinar UV terhadap kulit; teks 2 membahas manfaat sinar UV bagi kulit.", "B": "Teks 1 membahas faktor-faktor yang merusak kulit; teks 2 membahas fungsi kulit.", "C": "Teks 1 membahas efek sinar UV terhadap kulit; teks 2 membahas fungsi kulit.", "D": "Teks 1 membahas keriput di kulit; teks 2 membahas lapisan lemak kulit.", "E": "Teks 1 membahas penyakit kulit; teks 2 membahas fungsi kulit."}, "answer": "C"}, {"no": 10, "stem": "Bacalah teks berikut dengan saksama!\nJADWAL KRL RELASI JOGJA-SOLO\nNo | Nomor Kereta | Relasi | Pergi | Tiba\n1 | 646 | Tugu-Balapan | 05.15 | 06.23\n2 | 648 | Tugu-Balapan | 06.28 | 07.48\n3 | 7102 | Tugu-Balapan | 06.59 | 08.10\n4 | 7104 | Tugu-Balapan | 08.13 | 09.31\n5 | 652 | Tugu-Balapan | 10.01 | 11.11\n6 | 7106 | Tugu-Balapan | 11.55 | 13.03\n7 | 7108 | Tugu-Balapan | 14.49 | 15.57\nPernyataan yang sesuai dengan informasi pada tabel di atas adalah…", "options": {"A": "Kereta bernomor 646 pergi setelah kereta bernomor 7104.", "B": "Kereta bernomor 7102 tiba lebih pagi daripada kereta bernomor 648.", "C": "Kereta yang berangkat terakhir adalah kereta yang bernomor 7108.", "D": "Kereta yang tiba menjelang tengah hari adalah kereta bernomor 7104.", "E": "Kereta bernomor 7108 tiba lebih awal dibandingkan kereta bernomor 7106."}, "answer": "C"}, {"no": 11, "stem": "Bacalah teks berikut dengan saksama!\nPenyakit paru-paru mengacu pada gangguan yang … paru-paru, organ yang memungkinkan kita untuk bernapas. Penyakit paru-paru merupakan masalah utama bagi wanita. Jumlah wanita Amerika Serikat, yang … dengan penyakit paru-paru terus meningkat. Lebih banyak wanita juga … karena penyakit paru-paru.\nTanda-tanda awal penyakit paru-paru mudah… . Sering kali tanda awal penyakit paru-paru adalah tidak memiliki tingkat energi seperti biasa. Tanda dan gejalanya dapat berbeda … jenis penyakit paru-paru.\nKata berimbuhan yang tepat untuk mengisi bagian rumpang pada teks di atas adalah….", "options": {"A": "dipengaruhi, terdiagnosis, menderita, dideteksi, tergantung", "B": "dipengaruhi, didiagnosis, meninggal, diketahui, berdasarkan", "C": "memengaruhi, terdiagnosis, menderita, diketahui, tergantung", "D": "memengaruhi, terdiagnosis, meninggal, diabaikan, tergantung", "E": "memengaruhi, didiagnosis, meninggal, diabaikan, berdasarkan"}, "answer": "D"}, {"no": 12, "stem": "Bacalah teks berikut dengan saksama!\nSehubungan dengan itu pendidik harus menyediakan lingkungan bermain yang menarik, menyenangkan dan mendukung proses belajar anak. Anak akan mudah memahami materi ajar jika ia berada dalam lingkungan belajar yang menyenangkan karena hal itu mendukung, merangsang … dan inovasi anak. Kreativitas dan inovasi tercermin melalui kegiatan yang membuat tertarik, …, …, dan terkonsentrasi. Suasana yang menyenangkan mempermudah anak untuk … dan … dengan benda-benda yang ada di sekitarnya dan akhirnya menemukan pengetahuan dari benda-benda yang dimainkannya.\nKata serapan yang tepat untuk mengisi bagian rumpang teks di atas adalah….", "options": {"A": "kreatif, fokus, serius, bernegosiasi, bereksperimen", "B": "kreatif, fokus, serius, bersosialisasi, bereksperimen", "C": "kreativitas, fokus, serius, bereksplorasi, bereksperimen", "D": "kreativitas, terinsipirasi, elaborasi, berkreasi, bereksperimen", "E": "kreativitas, terinspirasi, elaborasi, bereksplorasi, bereksperimen"}, "answer": "E"}, {"no": 13, "stem": "Bacalah teks berikut dengan saksama!\nSebagai material nonorganik, sampah plastik sangat potensial mencemari lingkungan karena merupakan bahan yang sulit terdegradasi. Sehingga perlu adanya tindakan preventif yang dilakukan oleh masyarakat serta pemerintah, dalam mencegah penumpukan jumlah sampah yang semakin besar setiap tahunnya. Sebagaimana Peraturan Menteri Nomor 18 Tahun 2008 yang mengamanatkan upaya menumbuhkembangkan dan meningkatkan kesadaran masyarakat dalam pengelolaan sampah.\nIsi penggalan karya ilmiah di atas adalah….", "options": {"A": "Penumpukan jumlah sampah semakin besar setiap tahun.", "B": "Perlu upaya menumbuhkembangkan kesadaran masyarakat dalam pengelolaan sampah.", "C": "Perlu tindakan preventif yang dilakukan masyarakat.", "D": "Perlu adanya peraturan menteri yang baru terkait dengan pengelolaan sampah.", "E": "Sampah plastik sangat potensial mencemari lingkungan karena sulit terdegradasi."}, "answer": "E"}, {"no": 14, "stem": "Bacalah puisi berikut!\nIBU - Chairil Anwar\nPernah aku ditegur\nKatanya untuk kebaikan\nPernah aku dimarah\nKatanya membaiki kelemahan\nPernah aku diminta membantu\nKatanya supaya aku pandai\nIbu…..\nPernah aku merajuk\nKatanya aku manja\nPernah aku melawan\nKatanya aku degil\nPernah aku menangis\nKatanya aku lemah\n…\nAmanat yang terkandung pada puisi di atas adalah…", "options": {"A": "Jadilah anak yang penurut agar tidak dimarahi oleh ibu.", "B": "Jadilah ibu yang sabar dan tidak sering memarahi anak.", "C": "Jika ibu marah kita harus melawan agar ibu mengetahui kemauan kita.", "D": "Jangan marah jika ditegur ibu karena semua demi kebaikan kita.", "E": "Jadilah anak yang kuat agar tidak selalu dimarahi oleh orang tua."}, "answer": "D"}, {"no": 15, "stem": "Bacalah teks berikut dengan saksama!\nSAJAK PUTIH - Sapardi Djoko Damono\nBeribu saat dalam kenangan\nSurut perlahan\n…\nSewaktu detik pun jatuh\nKita dengar bumi yang tua dalam setia\nKasih tanpa suara\nSewaktu bayang-bayang kita memanjang\nMengabur batas ruang\nKita pun bisu tersekat dalam pesona\nSewaktu ia pun memanggil-manggil\nSewaktu Kata membuat kita begitu terpencil\nDi luar cuaca\nLarik bermajas personifikasi yang tepat untuk mengisi bagian rumpang pada puisi di atas adalah…", "options": {"A": "Sampai tiba saatnya", "B": "Pelan-pelan tanpa suara", "C": "Kia dengarkan suara membahana", "D": "Akhirnya terjadilah semuanya di depan mata", "E": "Kita dengarkan bumi menerima tanpa mengaduh"}, "answer": "E"}, {"no": 16, "stem": "Bacalah teks berikut dengan saksama!\nTersebutlah perkataan seorang raja yang bernama Indera Bungsu dari Negeri Kobat Syahrial. Setelah berapa lama di atas kerajaan, tiada juga beroleh putra. Maka pada suatu hari, ia pun menyuruh orang membaca doa kunut dan sedekah kepada fakir dan miskin. Hatta beberapa lamanya, Tuan Puteri Sitti Kendi pun hamillah dan bersalin dua orang putra laki-laki. Adapun yang tua keluarnya dengan panah dan yang muda dengan pedang. Maka baginda pun terlalu amat suka cita dan menamai anaknya yang tua Syah Peri dan anaknya yang muda Indera Bangsawan.\n(Hikayat Indera Bangsawan)\nPenggalan teks hikayat tersebut jika dinarasikan kembali dengan menggunakan bahasa Indonesia secara tepat akan menjadi …", "options": {"A": "Raja Negeri Kobat yang bernama Indera Bungsu sudah lama tidak berputra. Lalu ia menyuruh orang untuk membaca doa kunut dan bersedekah kepada fakir miskin. Tak lama kemudian Putri Sitti Kendi hamil dan melahirkan putra kembar. Yang tua lahir dengan pedang dan yang kedua dengan panah. Anak yang tua diberi nama Syah Peri dan yang muda Indera Bangsawan.", "B": "Raja Indera Bungsu dari Negeri Kobat sudah lama tidak berputra. Setelah dibacakan doa kunut dan bersedekah pada fakir miskin, istrinya yang bernama Sitti Kendi pun hamil dan melahirkan dua bayi laki-laki. Yang tua lahir disertai panah diberi nama Syah Peri, yang muda lahir disertai pedang diberi nama Indera Bangsawan.", "C": "Raja Indera Bungsu dari Kerajaan Kobat sudah lama tidak berputra. Setelah membaca doa kunut dan bersedekah pada fakir miskin, istrinya pun hamillah. Dia melahirkan anak kembar. Yang tua dinamakan Indera Bangsawan karena lahir dengan panah, yang kedua dinamakan Syah Peri karena lahir dengan pedang.", "D": "Raja Negeri Kobat, Indera Bungsu membacakan doa kunut dan bersedekah kepada fakir miskin karena lama tidak berputra. Tak lama kemudian, ia berputra kembar yang dinamakan Indera Bangsawan dan Syah Peri. Keduanya lahir dengan tombak dan pedang.", "E": "Raja Indera Bungsu dari Negeri Kobat lama tidak berputra. Kemudian ia membaca doa kunut dan bersedekah pada fakir miskin. Setelah itu istrinya pun hamillah dan melahirkan dua bayi laki-laki. Mereka diberi nama Syah Peri dan Indera Bangsawan karena lahir dengan panah dan tombak."}, "answer": "B"}, {"no": 17, "stem": "Bacalah teks berikut dengan saksama!\nMusim hujan telah tiba. Banyak daerah yang mengalami banjir. Bencana ini timbul karena banyak sampah yang mengganggu aliran sungai dan berkurangnya pohon yang bisa menahan air.\nBerdasarkan kalimat latar belakang masalah teks tersebut, rumusan masalah yang tepat dalam karya tulis ilmiah adalah…", "options": {"A": "Di daerah manakah banjir terjadi?", "B": "Mengapa terjadi banjir di berbagai daerah?", "C": "Mengapa banyak sampah yang dibuang ke sungai?", "D": "Bagaimana cara mengatasi banjir yang terjadi di berbagai daerah?", "E": "Siapakah yang harus bertanggung jawab terhadap bencana banjir ini?"}, "answer": "D"}, {"no": 18, "stem": "Bacalah teks berikut dengan saksama!\nAku berhenti sekolah. Jangankan sekolah, untuk makan saja susah. Ibu bekerja serabutan, apa saja yang bisa dikerjakan, dikerjakan. Sayang Ibu lebih banyak sakitnya. Semakin lama semakin parah. Yang pasti dan benar akhirnya aku dan Dede terpaksa bekerja menjadi pengamen. Membawa kencrengan dari tutup botol. Menyanyikan lagu-lagu dewasa. Berangkat pagi-pagi. Pulang malam-malam. Ditempa kehidupan jalanan.\nBagiku tak masalah. Demi Ibu, menyenangkan saja melakukan semuanya. Hanya sekali-dua aku pernah menelan ludah sedih saat melihat serombongan anak sekolah yang naik ke metromini.\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nKalimat resensi yang tepat untuk penggalan novel di atas adalah…", "options": {"A": "Penggambaran tokoh Aku yang tidak bisa sekolah karena kemiskinannya, sangat bagus untuk menginspirasi pembaca di kalangan remaja agar semangat sekolah.", "B": "Sisi kemiskinan yang diangkat penulis novel ini terlalu berlebihan.", "C": "Menghadirkan tokoh anak-anak mengamen bukan hal yang bijak karena bisa ditiru anak-anak.", "D": "Kehadiran tokoh Aku sebagai anak yang baik dan sayang pada orang tua terlalu dipaksakan.", "E": "Sebaiknya penulis tidak membuat cerita tentang berhenti sekolah karena akan membuat anak-anak yang malas sekolah mengikuti jejaknya."}, "answer": "A"}, {"no": 19, "stem": "Bacalah teks berikut dengan saksama!\nKegiatan persami yang dilakukan di SMA Pelita Harapan berjalan dengan baik dan lancar meskipun dengan anggaran dan kondisi yang terbatas. Siswa baru yang menjadi peserta persami bisa mendapatkan berbagai manfaat, terutama kedisiplinan, kerja sama, kekompakan, dan juga sifat berani.\nAcara persami ini diharapkan bisa menjadi ajang memupuk calon generasi penerus bangsa yang berkualitas, baik dalam segi akademik maupun nonakademik. Demikianlah laporan ini dibuat sebagai bentuk pertanggungjawaban panitia dan semoga bermanfaat bagi evaluasi penyelenggaraan kegiatan Persami berikutnya.\nInformasi penting yang dibahas pada penggalan laporan kegiatan di atas adalah…", "options": {"A": "Kegiatan persami yang dilaksanakan SMA Pelita Harapan berjalan lancar.", "B": "Persami menjadi ajang memupuk calon generasi penerus bangsa.", "C": "Kegiatan persami dilaksanakan dengan anggaran yang terbatas.", "D": "Siswa baru mendapatkan berbagai manfaat persami.", "E": "Persami bagi siswa baru dilaksanakan dalam kondisi terbatas."}, "answer": "A"}, {"no": 20, "stem": "Bacalah teks berikut dengan saksama!\nTeks 1: Dede menoleh padaku. Menyeringai. Terganggu. Aku menunjuk Bianglala yang terang benderang oleh cahaya lampu. Adikku tak terlalu tertarik. Masih sibuk memukuli berang-berang di depannya.\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nTeks 2: 'Kan zaman sudah edan, Mas. Pilihan kita hanya dua. Ikut edan atau jadi korban keedanan.' 'Memang sih, Pak, sekarang ini di mana tidak ada orang edan? Jajaran birokrasi pemerintah, gudangnya.'\n(Orang-Orang Proyek, Ahmad Tohari)\nUlasan kebahasaan yang tepat untuk kedua kutipan cerita tersebut adalah …", "options": {"A": "Teks 1 menggunakan bahasa Indonesia sehari-hari; teks 2 menggunakan bahasa yang terpengaruh bahasa Jawa.", "B": "Teks 1 membahas keceriaan anak di taman hiburan; teks 2 membahas keburukan orang di zaman edan.", "C": "Teks 1 menggunakan bahasa yang bertele-tele; teks 2 menggunakan bahasa yang padat dan singkat.", "D": "Teks 1 menggunakan banyak majas; teks 2 tidak menggunakan majas.", "E": "Teks 1 tidak menggunakan majas; teks 2 menggunakan banyak majas."}, "answer": "A"}, {"no": 21, "stem": "Bacalah teks berikut dengan saksama!\nKulit merupakan organ terbesar pada tubuh manusia dengan lapisan terluarnya yang dinamakan epidermis. Epidermis adalah bagian yang berperan penting dalam melindungi kulit dari faktor-faktor perusak di luar tubuh. Di balik epidermis terdapat lapisan dermis yang disebut juga sebagai lapisan tengah kulit.\nJenis frasa yang bercetak tebal ('organ terbesar', 'berperan penting', 'di luar tubuh') pada teks di atas adalah….", "options": {"A": "frasa nominal, frasa verbal, frasa adverbial", "B": "frasa verbal, frasa nominal, frasa adverbial", "C": "frasa adjektival, frasa verbal, frasa adverbial", "D": "frasa adjektival, frasa verbal, frasa adverbial", "E": "frasa nominal, frasa verbal, frasa preposisional"}, "answer": "E"}, {"no": 22, "stem": "Bacalah teks berikut dengan saksama!\nKondisi telinga yang sering basah atau terlalu lembap memungkinkan bakteri dan jamur berkembang biak di dalam telinga. Hal ini akan memicu iritasi dan infeksi pada telinga.\nBila Anda hobi berenang, sebaiknya gunakan penyumbat telinga untuk mencegah air masuk ke dalam telinga.\nKalimat berikut yang sepola dengan kalimat yang bercetak tebal ('Hal ini akan memicu iritasi dan infeksi pada telinga') pada teks di atas adalah…", "options": {"A": "Rina menulis puisi dan pantun di kamar.", "B": "Jika kamu tertarik, kamu boleh memilikinya.", "C": "Tommy akan menuruti semua permintaanmu.", "D": "Jika kamu memohon, pasti akan dituruti oleh ayahmu.", "E": "Walaupun hujan, Andre tetap datang ke pertemuan di kantor."}, "answer": "A"}, {"no": 23, "stem": "Bacalah teks berikut dengan saksama!\nHipertensi dan diabetes merupakan penyakit yang sering menyebabkan komplikasi berupa …. Jika Anda memiliki penyakit-penyakit tersebut, Anda dianjurkan untuk melakukan pemeriksaan rutin …, guna memantau perkembangan kedua penyakit ini dan mencegah penyakit ginjal.\nSelain itu, saat mengalami hipertensi dan diabetes, pembatasan jumlah konsumsi makanan yang mengandung gula dan garam ….\nFrasa yang tepat untuk mengisi bagian rumpang pada teks di atas adalah….", "options": {"A": "penyakit jantung, secara berkala, adalah wajib", "B": "penyakit jantung, cek darah, sangat disarankan", "C": "penyakit ginjal, ke dokter, sangat disarankan", "D": "penyakit ginjal, sebulan sekali, adalah perlu", "E": "penyakit ginjal, cek darah, sangat perlu"}, "answer": "C"}, {"no": 24, "stem": "Bacalah teks berikut dengan saksama!\n…, penerapan pola asuh dengan model sentra bisa diterapkan. Orang tua bisa mengambil sebagian atau sedikit pola yang diterapkan misalnya bagaimana mendidik anak untuk menyelesaikan tugas dengan sempurna. Membiasakan anak dari hal kecil untuk menyelesaikan tugas dengan sempurna, misalnya ketika sedang makan bersama.\nKlausa yang tepat untuk melengkapi kalimat rumpang pada teks di atas adalah…", "options": {"A": "Jika anak sedang dalam kondisi bahagia", "B": "Apabila bepergian bersama teman sekelas", "C": "Ketika berada di kelas bersama teman-temannya", "D": "Karena sangat penting untuk perkembangan dirinya", "E": "Meskipun tidak secara formal dalam ruang-ruang kelas"}, "answer": "E"}, {"no": 25, "stem": "Bacalah teks berikut dengan saksama!\nTrombosis vena dalam atau deep vein thrombosis (DVT) adalah kondisi ketika pembuluh darah vena tersumbat oleh bekuan darah. ….\nPenyakit ini dapat menimbulkan gejala berupa tungkai bengkak dan nyeri, serta kulit di tungkai yang bermasalah menjadi merah dan terasa hangat. Jika tidak diobati, DVT dapat menyebabkan komplikasi berupa emboli paru.\nKalimat intransitif yang tepat untuk melengkapi bagian rumpang pada teks di atas adalah…", "options": {"A": "Kita sering tidak menyadari keadaan ini.", "B": "Kondisi ini sering kali terjadi pada area tungkai.", "C": "Seringkali kita tidak memerhatikan keadaan ini.", "D": "Kondisi ini menimbulkan rasa sakit pada tungkai.", "E": "Jika ini terjadi, kita akan merasakan nyeri di daerah tungkai."}, "answer": "B"}, {"no": 26, "stem": "Bacalah teks berikut dengan saksama!\nSistem peredaran darah terdiri dari jantung dan pembuluh darah, meliputi pembuluh darah arteri, vena, dan kapiler. Jantung merupakan organ utama sistem peredaran darah, dengan fungsi memompa darah ke seluruh tubuh.\n…. Hal inilah yang tidak banyak diketahui oleh sebagian besar orang.\nKalimat transitif yang tepat untuk mengisi bagian rumpang teks di atas adalah…", "options": {"A": "Apabila peredaran darah terganggu, kita pasti akan sakit.", "B": "Kelancaran peredaran darah berpengaruh pada kesehatan kita.", "C": "Aliran darah sangat berpengaruh pada ketahanan tubuh seseorang.", "D": "Apabila peredaran darah terganggu, organ tubuh akan mengalami kerusakan.", "E": "Sudah saatnya orang belajar tentang peredaran darah karena sangat penting."}, "answer": "D"}, {"no": 27, "stem": "Bacalah teks berikut dengan saksama!\n(1) Sebuah video yang menampilkan gerombolan mitra ojek berseragam merah putih sedang berhenti di pinggir jalan beredar di media sosial. (2) Pada seragam dan helm yang mereka kenakan tertulis brand 'Bonceng'. (3) Saat ditelusuri, brand tersebut merupakan salah satu nama perusahaan jasa transportasi online, seperti Grab dan GoJek. (4) Marketing and Public Relation Bonceng, Sheha Rahmawati, mengungkapkan bahwa Bonceng masih tergolong startup baru, mulai didirikan sejak 2018.\nKalimat verbal dalam teks di atas adalah kalimat nomor....", "options": {"A": "(1), (2)", "B": "(1), (3)", "C": "(1), (4)", "D": "(2), (3)", "E": "(3), (4)"}, "answer": "B"}, {"no": 28, "stem": "Bacalah teks berikut dengan saksama!\nAndin berpikir keras untuk menundukkan Aldebran. Ia ingin Al akan bersikap mesra padanya sepulang kerja. Ia membeli bunga untuk dipajang di kamarnya. Dibelinya aster, gladiol, dan daun philodendron. Ditatanya bunga itu dengan hati-hati dan penuh cinta.\nRelasi makna yang terdapat pada paragraf di atas adalah….", "options": {"A": "sinonim", "B": "antonim", "C": "hiponim", "D": "homofon", "E": "homograf"}, "answer": "C"}, {"no": 29, "stem": "Bacalah teks berikut dengan saksama!\nMaka kata mufti, 'Baiklah! Hai tuan-tuan sekalian, ketahuilah, bahwasanya kepada hukum Allah yang harus akan raja itu, berakal, tiada harus raja itu bebal, kedua balig, tiada harus kanak-kanak, ketiga berbudi, tiada harus raja itu khilaf akalnya, keempat raja itu sehat, tiada harus raja penyakit aib seperti sopak dan kusta, kelima, raja itu adil, tiada harus raja itu lalim...'\nWatak Mufti pada teks di atas adalah....", "options": {"A": "bijaksana", "B": "emosional", "C": "cerdik", "D": "pemarah", "E": "sok tahu"}, "answer": "A"}, {"no": 30, "stem": "Bacalah teks berikut dengan saksama!\nTersebut pula perkataan Buraksa itu. Apabila dilihatnya ada air di dalam mulut bejana itu, maka ia pun minumlah serta dimasukannya kepalanya ke dalam mulut bejana tempat jerat tertahan itu. Maka kuda hijau si Kembar pun menarik tali jerat itu dan Buraksa pun terjeratlah. Si Kembar segera datang memarangnya hingga mati serta mengiris hidungnya yang tujuh dan matanya yang tujuh itu.\n(Hikayat Indera Bangsawan)\nKarakteristik hikayat yang terdapat pada teks di atas adalah….", "options": {"A": "istanasentris, kemustahilan, bahasa klise", "B": "istanasentris, terpengaruh agama Islam, bahasa klise", "C": "istanasentris, terpengaruh agama Islam, kemustahilan", "D": "kemustahilan, terpengaruh agama Islam, bahasa klise", "E": "kemustahilan, anonim, terpengaruh agama Islam"}, "answer": "A"}, {"no": 31, "stem": "Bacalah teks berikut dengan saksama!\nTernyata kesuksesan mengatasi persoalan Edo yang hanya mendesis dan Ongky yang cuma mengembik, tidak bisa digunakan untuk membereskan persoalan Almira. Almira tak hanya tampak sebagai hewan bertulang belakang langka. Kau bisa saja segera mencekik Almira dan mengancam bocah serigala itu agar tidak mengulangi perbuatan yang membahayakan siapa pun. Akan tetapi kau tidak ingin meniru Gesti yang pernah mengikat tubuh Almira di tiang bendera hanya karena dia menggigit tangan si penguasa sekolah yang lalim itu.\n(Srigala di Kelas Almira, Triyanto Triwikromo)\nNilai kehidupan yang terkandung pada penggalan cerpen di atas adalah….", "options": {"A": "nilai moral", "B": "nilai sosial", "C": "nilai religius", "D": "nilai budaya", "E": "nilai estetika"}, "answer": "A"}, {"no": 32, "stem": "Bacalah teks berikut dengan saksama!\nLalu tak ada cara lain, Ahmad pun mengeruk lumpur dari masjid berhari-hari, berminggu-minggu. Sendiri. Tak mungkin meminta pertolongan dari para nelayan yang merasa bisa shalat di perahu. Pada akhirnya, lumpur-lumpur itu bisa dihilangkan. Akan tetapi tetap saja rob tak bisa dihalau. Agar bisa shalat, ia membangun semacam panggung di mihrab ketika lantai sujud sudah dilahap oleh air laut yang rakus itu.\n(Sepasang Pengendus Kematian, Triyanto Triwikromo)\nWatak tokoh Ahmad dalam penggalan cerpen di atas disajikan melalui….", "options": {"A": "pikiran tokoh", "B": "perilaku tokoh", "C": "dialog antartokoh", "D": "uraian pengarang", "E": "lingkungan hidup tokoh"}, "answer": "B"}, {"no": 33, "stem": "Bacalah teks berikut dengan saksama!\n'Aku yakin kau akan setuju,' kata Herney, kini dengan suara yang semakin serius, 'Bahwa di dunia yang sempurna, dampak temuan ini akan bersifat ilmiah.' Dia terdiam, mencondongkan tubuhnya ke depan, wajahnya memenuhi layar.\n'Sayangnya kita tidak hidup di dunia yang sempurna, dan begitu aku mengumumkannya, kemenangan NASA ini akan menjadi sepak bola politik.'\n(Deception Point, Dan Brown)\nSudut pandang yang digunakan pada penggalan novel di atas adalah….", "options": {"A": "orang ketiga terbatas", "B": "orang ketiga serbatahu", "C": "orang kedua serbatahu", "D": "orang pertama sebagai pelaku utama", "E": "orang pertama sebagai pelaku sampingan"}, "answer": "B"}, {"no": 34, "stem": "Bacalah teks berikut dengan saksama!\n'Wajahmu menyenangkan, Tania. Dan itu membuat banyak orang nyaman untuk bertanya dan bersamamu....' Itu yang dia jelaskan saat kami pernah membahasnya dalam chatting singkat soal kenapa teman-teman sekelasku lebih banyak bertanya kepadaku dibandingkan dengan anak lain.\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nAmanat yang terkandung pada penggalan novel di atas adalah…", "options": {"A": "Memasang wajah menyenangkan akan membuat kita bisa makan gratis.", "B": "Memasang wajah menyenangkan akan menguntungkan diri sendiri.", "C": "Pasanglah wajah menyenangkan agar orang di sekitarmu merasa nyaman.", "D": "Sebaiknya kita memberi apresiasi pada orang-orang yang berwajah nyaman.", "E": "Jangan memasang wajah menyenangkan karena kita akan direpotkan oleh orang lain."}, "answer": "C"}, {"no": 35, "stem": "Bacalah teks berikut dengan saksama!\nKini Kabul tersenyum. Terasa betul Biyung tetap memandangnya sebagai anak yang masih kanak-kanak. Tapi Kabul justru menikmati kedekatan dan rasa aman seperti dia masih bocah.\nWaras-slamet atau sehat-selamat adalah pertanyaan yang selalu terlontar dari mulut Biyung bila berjumpa dengan anak-anaknya.\n(Orang-Orang Proyek, Ahmad Tohari)\nNilai budaya pada penggalan novel di atas diungkapkan dengan…", "options": {"A": "menggunakan nama, panggilan, dan istilah daerah tertentu.", "B": "menampilkan kebiasaan dan adat daerah tertentu", "C": "menganalisis perasaan tokoh Kabul pada biyung", "D": "pertanyaan tentang kesehatan dan keselamatan", "E": "menggunakan pertanyaan yang gamblang"}, "answer": "A"}, {"no": 36, "stem": "Bacalah teks berikut dengan saksama!\nTim Pro: Kami setuju dengan rencana pemerintah untuk menghentikan program beasiswa bagi siswa yang kurang mampu. Sudah saatnya pemerintah berhenti memberikan beasiswa kepada anak kurang mampu. Program ini hanya pemborosan uang negara. Sudah saatnya pemerintah memberikan beasiswa pada siswa yang pandai saja, baik itu dari golongan mampu maupun tidak mampu.\nKalimat sanggahan yang tepat untuk menyanggah pendapat di atas adalah…", "options": {"A": "Saya tidak setuju dengan Tim Pro karena keputusan itu terkesan sangat kejam.", "B": "Saya kurang setuju dengan pendapat Tim Pro karena pemerintah terkesan tidak mempunyai etika yang baik.", "C": "Saya tidak sependapat dengan Tim Pro karena belum tentu anak pandai mau membangun negaranya.", "D": "Saya tidak setuju dengan pendapat Tim Pro karena itu bertentangan dengan Undang-Undang Dasar 45 pasal 34.", "E": "Saya tidak setuju dengan pendapat Tim Pro karena jika anggaran untuk beasiswa dihapus, akan menyejahterakan para pejabat."}, "answer": "D"}, {"no": 37, "stem": "Bacalah teks berikut dengan saksama!\n(1) Dede langsung undur surut.\n(2) 'Nggak... nggak. Kakak janji nggak ketawa,' (3) Aku menahan tawaku. (4) Dede menelan ludah. (5) Maju lagi di sampingku, (6) Lama menimbang-nimbang. (7) Berpikir-pikir. (8) Aku jadi sebal.\n(9) 'Apaan sih?'\n(10) Adikku terdiam lagi.\n(11) 'Cewek itu sukanya apaan?'\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nKalimat minor pada penggalan novel di atas adalah nomor…", "options": {"A": "(3), (4)", "B": "(7), (9)", "C": "(8), (9)", "D": "(9), (10)", "E": "(10), (11)"}, "answer": "B"}, {"no": 38, "stem": "Bacalah teks berikut dengan saksama!\nAhli kulit sehat … bahwa masih ada faktor lingkungan lain yang bisa menyebabkan kerusakan kulit, seperti paparan bahan kimia yang menimbulkan iritasi dan alergi pada kulit. Terdapat lebih dari 3.000 alergen dan bahan iritatif yang tersebar di sekitar kita. Hal ini terutama … orang-orang dengan kulit sensitif. Sebagai akibatnya, kulit menjadi merah. Cara termudah dalam melindungi kulit adalah … kontak dengan bahan-bahan alergen tersebut.\nVerba yang tepat untuk mengisi bagian rumpang pada teks di atas adalah….", "options": {"A": "menyatakan, bagi, melalui", "B": "menyatakan, dialami, melakukan", "C": "menyatakan, menimpa, menghindari", "D": "membuktikan, dilakukan, melakukan", "E": "membuktikan, dilakukan, menghindari"}, "answer": "C"}, {"no": 39, "stem": "Bacalah teks berikut dengan saksama!\nSinar UV juga berdampak kepada proses pigmentasi kulit. Dalam hal ini, efek negatif sinar UV dapat memicu kemunculan keriput, bintik-bintik cokelat, bahkan risiko kanker kulit. Belum lagi, tingginya radikal bebas turut berperan kepada pertumbuhan kanker kulit. Di sisi lain, merokok dan polusi udara dapat mengurangi kolagen dan mengakibatkan proses penuaan kulit prematur, seperti halnya efek sinar UV matahari.\nMakna kata 'prematur' pada teks di atas adalah….", "options": {"A": "belum cukup umur", "B": "sebelum waktunya", "C": "belum dewasa", "D": "kurang bobot", "E": "sangat kecil"}, "answer": "B"}, {"no": 40, "stem": "Bacalah teks berikut dengan saksama!\nLamanya waktu memotong rambut setiap orang berbeda-beda. Ini tergantung pada jenis rambut yang dimilikinya. Bagi wanita yang memiliki rambut keriting, disarankan untuk memotong rambut 1-2 kali dalam setahun. Bagi wanita berambut lurus atau ikal, disarankan untuk memotong rambut 3-4 bulan sekali. Hal ini agar setiap cabang helaian rambut tidak kering dan rusak. Saat memotong rambut, kamu tidak perlu memotong rambut terlalu panjang. Cukup potong 1-2 sentimeter agar rambut terlihat lebih rapi dari biasanya.\nKlausa yang bercetak tebal ('Saat memotong rambut') pada teks di atas termasuk jenis klausa….", "options": {"A": "bebas", "B": "positif", "C": "verbal", "D": "terikat", "E": "negatif"}, "answer": "D"}]}, "fisika": {"nama": "Tryout TKA Fisika", "mapel": "Fisika", "durasi": 60, "soal": [{"no": 1, "stem": "Dua buah pelat besi diukur dengan menggunakan jangka sorong. Pengukuran 1: SU 2,4 cm, SN 0,01 cm (hasil 2,41 cm). Pengukuran 2: SU 2,2 cm, SN 0,04 cm (hasil 2,24 cm). Selisih tebal kedua pelat besi tersebut adalah …", "options": {"A": "0,3 mm", "B": "0,6 mm", "C": "0,7 mm", "D": "0,8 mm", "E": "1,7 mm"}, "answer": "E", "pembahasan": "Hasil pengukuran 1 = 2,41 cm; hasil pengukuran 2 = 2,24 cm. Selisih = 2,41-2,24 = 0,17 cm = 1,7 mm."}, {"no": 2, "stem": "Sebuah benda mula-mula di titik A(0,0) kemudian bergerak selama 2 sekon ke titik B(4,2). Selanjutnya bergerak lagi selama 3 sekon ke titik C(8,6). Kecepatan rata-rata gerak benda adalah ….", "options": {"A": "1 ms-1", "B": "1,5 ms-1", "C": "2 ms-1", "D": "2√2 ms-1", "E": "4,75 ms-1"}, "answer": "C", "pembahasan": "Perpindahan total dari A(0,0) ke C(8,6) = akar(8²+6²)=10 m, waktu total = 5 s. v rata-rata = 10/5 = 2 m/s."}, {"no": 3, "stem": "Sebuah mobil mula-mula bergerak lurus dengan kecepatan konstan 72 km/jam selama 20 sekon kemudian dipercepat dengan percepatan 3 m/s2 selama 10 sekon dan diperlambat dengan perlambatan 5 m/s2 hingga mobil berhenti. Bentuk grafik kecepatan (v) terhadap waktu (t) perjalanan mobil yang sesuai adalah grafik dengan kecepatan konstan 20 m/s selama 20 s, naik ke 50 m/s selama 10 s berikutnya (t=20-30 s), lalu turun ke 0 dalam 10 s (t=30-40 s). Pilihan grafik yang sesuai adalah …", "options": {"A": "Grafik A (naik ke 50 pada t=20-30, turun ke 0 pada t=30-50)", "B": "Grafik B (konstan 20 s.d t=20, naik ke 50 pada t=20-30, turun ke 0 pada t=30-40)", "C": "Grafik C (konstan 20 s.d t=20, naik ke 40 pada t=20-30)", "D": "Grafik D (konstan dengan jeda turun ke 20 sebelum naik ke 50 pada t=50-60)", "E": "Grafik E (konstan 20 s.d t=20, naik ke 35 pada t=20-25, turun pada t=25-30)"}, "answer": "B", "pembahasan": "72 km/jam = 20 m/s selama 20 s (GLB). Vt = 20+3(10) = 50 m/s (grafik naik, GLBB, 10 s). Perlambatan 5 m/s2 dari 50 ke 0: t=50/5=10 s (grafik turun). Jadi grafik B: konstan 20 s.d t=20, naik ke 50 di t=30, turun ke 0 di t=40."}, {"no": 4, "stem": "Perhatikan tabel data kecepatan dari tiga benda yang bergerak lurus: pada t=2s, 4s, 6s kecepatan Benda A = 3, 14, 25 m/s; Benda B = 5, 9, 13 m/s; Benda C = 6, 10, 14 m/s. Berdasarkan tabel dapat disimpulkan bahwa benda yang mengalami percepatan terbesar dalam selang waktu tertentu adalah …", "options": {"A": "Benda A untuk t=2s sampai t=4s", "B": "Benda B untuk t=2s sampai t=4s", "C": "Benda B untuk t=4s sampai t=6s", "D": "Benda C untuk t=2s sampai t=4s", "E": "Benda C untuk t=4s sampai t=6s"}, "answer": "A", "pembahasan": "Percepatan A (t=2-4s) = (14-3)/2 = 5,5 m/s². Ini paling besar dibanding percepatan B, C yang masing-masing 2 m/s²."}, {"no": 5, "stem": "Jari-jari roda A=30 cm, roda B=40 cm (seporos dengan A), roda C=25 cm (dihubungkan tali dengan A), roda D=50 cm (bersinggungan dengan C). Roda B berputar dengan kecepatan anguler 50 rad/s. Kecepatan anguler roda D adalah …", "options": {"A": "80 rad/s", "B": "60 rad/s", "C": "50 rad/s", "D": "40 rad/s", "E": "30 rad/s"}, "answer": "E", "pembahasan": "ωA=ωB=50 rad/s (seporos). A-C dihubungkan tali: ωA.rA=ωC.rC → 50.30=ωC.25 → ωC=60 rad/s. C-D bersinggungan: ωD.rD=ωC.rC → ωD.50=60.25 → ωD=30 rad/s."}, {"no": 6, "stem": "Seorang pembalap mobil sedang melintasi tikungan miring dengan kemiringan θ dan jari-jari 12 m. Kecepatan maksimum mobil 6 m/s, maka nilai tan θ adalah …", "options": {"A": "2/3", "B": "5/10", "C": "3/10", "D": "2/11", "E": "1/12"}, "answer": "C", "pembahasan": "v=√(g.R.tanθ) → 36=10.12.tanθ → tanθ=36/120=3/10."}, {"no": 7, "stem": "Sebuah bola dilempar dengan sudut elevasi 30° dan kecepatan awal 60 m/s menempuh lintasan parabola. Percepatan gravitasi 10 m/s². Perbandingan kecepatan di titik A (t=1s), B (t=2s), dan C (t=3s) adalah …", "options": {"A": "√25 : √28 : √31", "B": "√25 : √40 : √45", "C": "√27 : √28 : √31", "D": "√28 : √27 : √31", "E": "√31 : √28 : √27"}, "answer": "E", "pembahasan": "Vx=30√3 m/s konstan. Di A(t=1): Vy=30-10=20, v=√3100. Di B(t=2): Vy=30-20=10, v=√2800. Di C(t=3): Vy=0, v=√2700. Jadi A:B:C = √31:√28:√27."}, {"no": 8, "stem": "Sebuah partikel yang bergerak ke atas memenuhi persamaan y=8t-t² dengan y dan t masing-masing dalam meter dan sekon. Kecepatan benda saat t=2 sekon adalah ….", "options": {"A": "2 m/s", "B": "4 m/s", "C": "8 m/s", "D": "12 m/s", "E": "16 m/s"}, "answer": "B", "pembahasan": "v=dy/dt=8-2t. Untuk t=2s: v=8-4=4 m/s."}, {"no": 9, "stem": "Sebuah balok bermassa 1 kg meluncur pada bidang miring kasar dari keadaan diam. Setelah menempuh jarak 3,75 m, kecepatan balok=7,5 m/s. Diketahui g=10 m/s², koefisien gesekan kinetis 3/16 dan tanθ=3/4, maka besar gaya tahan F agar balok berhenti tepat di kaki bidang miring adalah …", "options": {"A": "3,75 N", "B": "5,75 N", "C": "7,50 N", "D": "9,50 N", "E": "12,00 N"}, "answer": "E", "pembahasan": "½.m.v² = (F+μ.m.g.cosθ-m.g.sinθ).s → 28,125 = (F+1,5-6).3,75 → 7,5=(F-4,5) → F=12 N."}, {"no": 10, "stem": "Balok A (8 kg) dan B (5 kg) dihubungkan tali melalui katrol. Koefisien gesekan statis dan kinetis antara balok dengan lantai adalah 0,5 dan 0,3 (g=10 m/s²). Balok C (4 kg) kemudian diletakkan di atas balok A, maka …", "options": {"A": "tegangan tali sistem menjadi lebih kecil dari semula", "B": "tegangan tali sistem menjadi dua kali semula", "C": "sistem balok menjadi diam", "D": "sistem balok bergerak dengan percepatan setengah kali semula", "E": "sistem balok bergerak dengan percepatan dua kali semula"}, "answer": "C", "pembahasan": "Berat A+C = 120 N, gaya gesek statis maksimum = 0,5.120=60 N. Berat B = 50 N. Karena gaya gesek statis (60N) > berat B (50N), sistem tetap diam."}, {"no": 11, "stem": "Sebuah benda berbentuk balok dicelupkan dalam cairan A (massa jenis 900 kg/m³), ternyata 2/3 bagiannya muncul di atas permukaan (1/3 tercelup). Berapa bagian dari balok tersebut yang tercelup jika cairan diganti dengan cairan B (massa jenis 1.200 kg/m³)?", "options": {"A": "1/3 bagian", "B": "4/9 bagian", "C": "1/2 bagian", "D": "5/9 bagian", "E": "3/4 bagian"}, "answer": "C", "pembahasan": "m=900.(1/3)V=300V (dari kondisi awal, dengan V tercelup 1/3). Untuk cairan B: m.g=1200.g.V2 → V2 = 300V/1200 = V/4... (mengikuti pembahasan asli: V2 = 1/2 V, jawaban C)."}, {"no": 12, "stem": "Perhatikan alat penyemprot nyamuk. Ketika batang penghisap M ditekan, udara dipaksa keluar dari tabung pompa dengan kecepatan v melalui lubang pada ujungnya. P menyatakan tekanan dan v menyatakan kecepatan alir cairan obat nyamuk. Pernyataan yang benar dari prinsip kerja penyemprot nyamuk tersebut adalah…", "options": {"A": "P1 < P2, maka v1 < v2", "B": "P1 > P2, maka v1 < v2", "C": "P1 < P2, maka v1 > v2", "D": "P1 > P2, maka v1 > v2", "E": "P1 = P2, maka v1 = v2"}, "answer": "B", "pembahasan": "Sesuai prinsip tabung pitot: agar fluida dapat disemprotkan, P1>P2 dan v1<v2."}, {"no": 13, "stem": "Sebuah pesawat ruang angkasa (P) mengorbit bumi (B) pada jarak tertentu dengan kecepatan konstan membentuk lintasan elips. Apabila pesawat kehilangan tenaga secara berangsur-angsur, maka bentuk lintasan yang mungkin terjadi ditunjukkan oleh gambar…", "options": {"A": "Lintasan tetap elips namun menabrak bumi langsung", "B": "Lintasan spiral mengecil mendekati bumi secara bertahap", "C": "Lintasan berubah menjadi garis lurus menjauhi bumi", "D": "Lintasan tetap elips membesar menjauhi bumi", "E": "Lintasan pesawat langsung meledak menuju bumi"}, "answer": "B", "pembahasan": "Kehilangan energi secara berangsur menyebabkan orbit mengecil secara spiral menuju bumi (gambar B pada soal asli)."}, {"no": 14, "stem": "Seorang penari berdiri di atas lantai es licin dan berputar di tempatnya. Mula-mula penari berputar dengan menyilangkan kedua tangan di dada (posisi A). Kemudian penari berputar sambil merentangkan kedua tangannya (posisi B). Pernyataan yang benar mengenai Momen Inersia (I) dan Momentum Sudut (L) kedua keadaan tersebut adalah…", "options": {"A": "IA=IB dan LA<LB", "B": "IA>IB dan LA=LB", "C": "IA>IB dan LA>LB", "D": "IA<IB dan LA<LB", "E": "IA<IB dan LA=LB"}, "answer": "E", "pembahasan": "I=m.r². Posisi A (tangan menyilang, r kecil) → IA<IB (posisi B, tangan terentang, r besar). Momentum sudut kekal, sehingga LA=LB."}, {"no": 15, "stem": "Tabel data posisi benda: A massa 500 gram koordinat (4,0); B massa 200 gram koordinat (0,4); C massa 250 gram koordinat (0,2). Benda A, B, dan C dihubungkan dengan batang ringan tak bermassa pada bidang x-y. Besar momen inersia sistem jika diputar pada poros sejajar sumbu y melalui benda A adalah ….", "options": {"A": "11 m²", "B": "13 m²", "C": "12,5 m²", "D": "7,2 m²", "E": "2,5 m²"}, "answer": "D", "pembahasan": "Itot=Ib+Ic (poros melalui A, jarak horizontal B dan C ke A = 4m) = 0,2.4² + 0,25.4² = 3,2+4=7,2 kg.m²."}, {"no": 16, "stem": "Dua buah benda menuruni lintasan dari titik A (tinggi 40 m) ke titik B (tinggi 30 m). Massa benda pertama m1=5 kg dan benda kedua m2=15 kg. Jika percepatan gravitasi g=10 m/s², maka perbandingan energi kinetik Ek1:Ek2 di titik B adalah…", "options": {"A": "1:2", "B": "1:3", "C": "1:9", "D": "2:1", "E": "3:1"}, "answer": "B", "pembahasan": "Ek=m.g.(h1-h2) untuk masing-masing benda, jadi Ek1/Ek2 = m1/m2 = 5/15 = 1/3."}, {"no": 17, "stem": "Sebuah peluru dari senapan A ditembakkan ke balok dan bersarang di dalam balok, mengakibatkan balok naik setinggi h1=40 cm. Balok lain yang identik ditembak peluru dari senapan B yang sama massanya, mengakibatkan balok naik setinggi h2=30 cm. Perbandingan kecepatan peluru dari senapan A dan B sesaat menumbuk balok adalah …", "options": {"A": "2 : √3", "B": "√2 : √3", "C": "√3 : √2", "D": "√3 : 2", "E": "√3 : 3"}, "answer": "A", "pembahasan": "v1=√(2.10.40)=20√2 m/s, v2=√(2.10.30)=10√6 m/s. vp sebanding v'. vp1/vp2 = 20√2/10√6 = 2/√3."}, {"no": 18, "stem": "Sebuah peluru ditembakkan dengan sudut elevasi α (cos α=3/5) dan kecepatan awal 100 m/s. Massa peluru 40 gram dan g=10 m/s². Energi potensial peluru setelah bergerak selama 5 sekon adalah …", "options": {"A": "100 joule", "B": "110 joule", "C": "120 joule", "D": "130 joule", "E": "140 joule"}, "answer": "B", "pembahasan": "sin α=4/5, Voy=80 m/s. h=80(5)-½(10)(25)=400-125=275 m. Ep=m.g.h=0,04.10.275=110 joule."}, {"no": 19, "stem": "Perhatikan 3 peristiwa tumbukan: Gambar A benda P (massa 8m) menumbuk benda Q (massa m, diam) dengan kecepatan v. Gambar B benda R (massa m) bergerak kecepatan v menumbuk benda S (massa 8m, diam). Gambar C benda K (massa 8m) bergerak kecepatan v menumbuk benda R (massa sama, diam). Ketiga tumbukan bersifat lenting sempurna, maka dapat disimpulkan bahwa …", "options": {"A": "Kecepatan terbesar dimiliki benda Q pada gambar A", "B": "Kecepatan terbesar dimiliki benda S pada gambar B", "C": "Kecepatan terbesar dimiliki benda R pada gambar C", "D": "Kecepatan sulit diprediksi karena massa pada ketiga peristiwa tidak sama", "E": "Kecepatan benda yang ditumbuk pada ketiga peristiwa sama"}, "answer": "A", "pembahasan": "Dari perhitungan tumbukan lenting sempurna: v2' gambar A =16/9 v, gambar B=2/9 v, gambar C=v. Jadi kecepatan terbesar pada benda Q gambar A."}, {"no": 20, "stem": "Balok bermassa 10 kg meluncur sepanjang bidang miring A-B (licin, tinggi 3m) dan berhenti di titik C. Koefisien gesek antara balok dengan permukaan bidang B-C=0,3. Panjang BC adalah …", "options": {"A": "10 m", "B": "35 m", "C": "37 m", "D": "40 m", "E": "50 m"}, "answer": "A", "pembahasan": "v di kaki bidang miring=√(2.10.3)=√60. Perlambatan a=μ.g=0,3.10=3 m/s². Jarak s=v²/(2a)=60/6=10 m."}, {"no": 21, "stem": "Grafik data pemanasan bubuk sampel zat bermassa 0,10 kg menunjukkan Q(joule) terhadap ΔT(K): pada ΔT=10K, Q=420 joule (dan seterusnya linear). Kalor jenis sampel zat adalah …", "options": {"A": "240 J/kg.K", "B": "420 J/kg.K", "C": "840 J/kg.K", "D": "2.400 J/kg.K", "E": "4.200 J/kg.K"}, "answer": "B", "pembahasan": "c=Q/(m.ΔT)=420/(0,1x10)=420 J/kg.K."}, {"no": 22, "stem": "Dua benda dari logam sejenis A dan B yang massanya sama tetapi ukurannya berbeda, masing-masing bersuhu TA dan TB (TA>TB), diletakkan di dalam ruang tertutup yang bersuhu T dimana TB<T<TA. Hubungan antara kenaikan suhu logam A dan B terhadap waktu dapat dinyatakan dengan grafik …", "options": {"A": "A naik tajam, B naik lebih tajam dari titik nol yang sama", "B": "A naik terus dari nol, B konstan mendatar dari awal", "C": "A konstan mendatar, B naik terus dari nol", "D": "A dan B naik dengan garis yang sama (A=B)", "E": "A turun (menuju T) dan B naik (menuju T), membentuk silang"}, "answer": "E", "pembahasan": "Karena TA > T > TB, maka suhu benda A akan turun menuju T dan suhu benda B akan naik menuju T (grafik silang)."}, {"no": 23, "stem": "Sebanyak 75 gram air yang suhunya 20°C dicampurkan dengan 50 gram air yang suhunya tak diketahui. Jika suhu akhir campuran 40°C, maka suhu air 50 gram mula-mula adalah …", "options": {"A": "70°C", "B": "50°C", "C": "40°C", "D": "30°C", "E": "20°C"}, "answer": "A", "pembahasan": "Q lepas=Q serap: 50(Tt-40)=75(40-20) → 50(Tt-40)=1500 → Tt-40=30 → Tt=70°C."}, {"no": 24, "stem": "Tiga batang konduktor P, Q, dan R dari jenis berbeda memiliki panjang dan luas penampang sama disambungkan seri. Suhu T1=20°C dan T4=90°C, koefisien konduksi kP=2kQ=4kR, maka suhu T2 dan T3 adalah …", "options": {"A": "T2=40°C, T3=75°C", "B": "T2=40°C, T3=60°C", "C": "T2=35°C, T3=65°C", "D": "T2=30°C, T3=50°C", "E": "T2=30°C, T3=40°C"}, "answer": "D", "pembahasan": "Dari persamaan kesetimbangan kalor antar konduktor (kP=2kQ=4kR), diperoleh T2=30°C dan T3=50°C."}, {"no": 25, "stem": "Volume gas ideal di dalam ruang tertutup diperkecil setengah kali semula dalam proses isothermis, maka tekanannya menjadi……", "options": {"A": "1/4 kali semula", "B": "1/2 kali semula", "C": "1 kali semula", "D": "2 kali semula", "E": "4 kali semula"}, "answer": "D", "pembahasan": "Isotermal: P1V1=P2V2. V2=1/2V1 maka P2=2P1."}, {"no": 26, "stem": "Pada percobaan pegas, data massa beban (100,200,300,400,500 gram) menghasilkan pertambahan panjang (2,4,6,8,10 cm) secara berurutan dan proporsional. Dari data tersebut dapat disimpulkan bahwa……", "options": {"A": "Semakin besar beban, semakin kecil pertambahan panjang", "B": "Semakin besar gaya, semakin besar pertambahan panjang", "C": "Semakin besar gaya, semakin kecil pertambahan panjang", "D": "Konstanta pegas berbanding lurus dengan pertambahan panjang", "E": "Konstanta pegas berbanding terbalik dengan gaya"}, "answer": "B", "pembahasan": "Menurut Hukum Hooke F=k.Δx, sehingga Δx sebanding dengan gaya F."}, {"no": 27, "stem": "Mikroskop dengan fokus lensa objektif 1 cm dan okuler 10 cm digunakan mengamati benda kecil. Saat mata tanpa akomodasi, jarak lensa objektif-okuler 21 cm. Pengamatan diubah dengan mata berakomodasi maksimum (Sn=30cm), maka jarak lensa objektif dan okuler sekarang adalah……", "options": {"A": "23,5 cm", "B": "21,0 cm", "C": "18,5 cm", "D": "15,0 cm", "E": "13,5 cm"}, "answer": "C", "pembahasan": "S'ob=21-10=11cm (dari kondisi tanpa akomodasi). Sok=Fok.S'ok/(Fok-S'ok)=10(-30)/(10-(-30))=-7,5cm. Panjang mikroskop d=S'ob+Sok=11+7,5=18,5 cm."}, {"no": 28, "stem": "Balok dihubungkan dengan pegas dan ditarik sejauh 4 cm lalu dilepaskan sehingga sistem bergetar harmonik. Dalam waktu 10 sekon terjadi 5 getaran, maka grafik hubungan simpangan dengan waktu getar yang benar adalah…. (Amplitudo=4cm, Periode T=10/5=2 sekon)", "options": {"A": "Amplitudo 2cm, periode 10 sekon", "B": "Amplitudo 2cm, periode 2 sekon", "C": "Amplitudo 4cm, periode 2 sekon", "D": "Amplitudo 4cm, periode 10 sekon", "E": "Amplitudo 10cm, periode 4 sekon"}, "answer": "C", "pembahasan": "Amplitudo=4cm (dari simpangan awal). T=t/n=10/5=2 sekon. Jadi grafik dengan amplitudo 4cm dan periode 2 sekon."}, {"no": 29, "stem": "Dua gabus berjarak 3 m terapung di puncak gelombang air laut. Terdapat dua lembah antara keduanya dan energi gelombang membutuhkan waktu 6 sekon untuk berpindah dari gabus satu ke yang kedua. Kecepatan rambat dan panjang gelombangnya berturut-turut adalah…..", "options": {"A": "1 m/s dan 6 m", "B": "1 m/s dan 3 m", "C": "0,5 m/s dan 6 m", "D": "0,5 m/s dan 3m", "E": "0,5 m/s dan 1,5 m"}, "answer": "E", "pembahasan": "Antara dua gabus terbentuk 2 gelombang. Panjang gelombang=3/2=1,5m. Periode T=6/2=3 sekon. v=1,5/3=0,5 m/s."}, {"no": 30, "stem": "Persamaan gelombang stasioner pada dawai gitar y=40 sin(20πx) cos(60πt), dengan x dan y dalam meter dan t dalam sekon. Dari persamaan tersebut letak perut kesatu, kedua, dan ketiga dari titik pantul berjarak……", "options": {"A": "2cm, 6 cm, dan 10 cm", "B": "2,5 cm, 7,5 cm, dan 12,5 cm", "C": "3 cm, 9 cm, dan 15 cm", "D": "7 cm, 21 cm, dan 35 cm", "E": "10 cm, 30 cm, dan 50 cm"}, "answer": "B", "pembahasan": "k=20π=2π/λ, maka λ=10cm=0,1m. Letak perut ke-n: Xp=(2n+1).¼.λ. Perut 1(n=0)=2,5cm, perut 2(n=1)=7,5cm, perut 3(n=2)=12,5cm."}, {"no": 31, "stem": "Daya yang dihasilkan dari bunyi mesin diesel pada jarak R sebesar 10π watt dan taraf intensitas bunyi yang terdengar sebesar 70 dB. Intensitas ambang bunyi 10^-12 watt/m², maka jarak R tersebut dari mesin diesel adalah……", "options": {"A": "0,5 km", "B": "1,0 km", "C": "1,5 km", "D": "2,5 km", "E": "3,0 km"}, "answer": "A", "pembahasan": "TI=10log(I/Io): 70=10log(I/10^-12) → I=10^-5 W/m². I=P/(4πR²): R²=10π/(4π.10^-5)=0,25.10^6 → R=500m=0,5km."}, {"no": 32, "stem": "Seberkas cahaya dilewatkan pada kisi difraksi dengan 200 celah/cm, akan dihasilkan garis pita terang kedua pada layar berjarak 6mm dari terang pusat. Kisi difraksi kemudian diganti dengan 500 celah/cm, maka jarak pita terang ke-6 pada layar mempunyai jarak dari terang pusat adalah…..", "options": {"A": "6 mm", "B": "12 mm", "C": "16 mm", "D": "24 mm", "E": "45 mm"}, "answer": "E", "pembahasan": "p sebanding dengan n dan N (jumlah celah). P1/P2=n1.N1/(n2.N2) → 6/P2=(2.200)/(6.500) → P2=45 mm."}, {"no": 33, "stem": "Perhatikan rangkaian listrik dengan dua sumber tegangan 4V masing-masing dan hambatan 4Ω, 2Ω, 4Ω tersusun paralel-seri. Besar daya pada hambatan 2Ω adalah…", "options": {"A": "2 watt", "B": "4 watt", "C": "5 watt", "D": "6 watt", "E": "9 watt"}, "answer": "A", "pembahasan": "Dari eliminasi persamaan loop diperoleh I1=I2=0,5A, I3(melalui 2Ω)=I1+I2=1A. P3=I3².R3=1².2=2 watt."}, {"no": 34, "stem": "Perhatikan rangkaian 5 lampu identik (A,B,C paralel disusul D dan E seri) dengan sumber tegangan E. Lampu identik F dipasang pada kawat antara P dan Q (menambah cabang paralel). Bagaimana keadaan nyala lima lampu pada rangkaian listrik tersebut?", "options": {"A": "Lampu D dan E menyala lebih terang dari semula.", "B": "Lampu A, B, dan C menyala lebih terang dari semula.", "C": "Lampu D dan E lebih terang daripada A, B, dan C.", "D": "Lampu D dan E lebih redup dari semula.", "E": "Lampu D dan E sama terangnya dengan keadaan awalnya."}, "answer": "D", "pembahasan": "Ketika rangkaian ditambah hambatan (lampu F paralel), hambatan total cabang tersebut mengecil sehingga arus total dari sumber membesar, namun arus yang melalui D dan E (seri dengan sumber) berkurang porsinya, sehingga D dan E menjadi lebih redup."}, {"no": 35, "stem": "Dua benda bermuatan listrik Q1 dan Q2 berjarak r cm menimbulkan gaya tolak menolak sebesar 10 newton. Kemudian muatan Q1 digeser sehingga gaya yang timbul menjadi 40 newton. Konstanta k=9x10^9 N.m²/C², maka muatan Q1 harus dipindahkan sebesar….", "options": {"A": "1/2 r menjauhi Q2", "B": "1/2 r mendekati Q2", "C": "1 r menjauhi Q2", "D": "2 r mendekati Q2", "E": "3 r menjauhi Q2"}, "answer": "B", "pembahasan": "F sebanding 1/r². F1/F2=r2²/r1² → 10/40=r2²/r1² → r2=1/2 r1, artinya jaraknya diperkecil menjadi 1/2 r (mendekati Q2)."}, {"no": 36, "stem": "Sebuah elektron bermuatan q=-1,6x10^-19 C dan bermassa m=9x10^-31 kg dilepaskan dari katoda menuju anoda di antara dua keping logam berjarak 80 cm dengan beda potensial antar keping 5.000 volt. Gaya yang digunakan untuk menggerakkan elektron sampai di anoda adalah…..", "options": {"A": "1x10^-15 newton", "B": "2x10^-15 newton", "C": "5x10^-15 newton", "D": "8x10^-15 newton", "E": "4x10^-14 newton"}, "answer": "A", "pembahasan": "F=q.E=q.V/r=1,6x10^-19 . 5000/0,8=1x10^-15 N."}, {"no": 37, "stem": "Dua kawat lurus sejajar berarus listrik i1=2A dan i2=3A (berlawanan arah) terpisah pada jarak a. Sebuah kawat penghantar lurus lain (3) berarus listrik akan diletakkan di sekitar kedua kawat sehingga kawat tidak mengalami gaya magnetik. Kawat (3) tersebut harus diletakkan pada jarak…..", "options": {"A": "0,5a di kiri kawat (1)", "B": "a di kiri kawat (1)", "C": "2a di kiri kawat (1)", "D": "a di kanan kawat (2)", "E": "2a di kanan kawat (2)"}, "answer": "C", "pembahasan": "F13=F23: I1/x=I2/(a+x) → 2/x=3/(a+x) → 2a+2x=3x → x=2a. Kawat ketiga diletakkan 2a di kiri kawat 1 (dekat kawat dengan arus lebih kecil)."}, {"no": 38, "stem": "Sebuah trafo step down memiliki tegangan primer 220 volt dan tegangan sekunder 110 volt. Pada kumparan primer mengalir arus 3 ampere dan trafo memiliki efisiensi 60%, daya yang hilang akibat panas atau penyebab lainnya adalah…..", "options": {"A": "264 watt", "B": "396 watt", "C": "464 watt", "D": "482 watt", "E": "660 watt"}, "answer": "A", "pembahasan": "P_hilang=(1-eff).Vp.Ip=(1-0,6).220.3=264 watt."}, {"no": 39, "stem": "Pada reaksi inti: 9(4)Be + x → 12(6)C + 1(0)n, maka x adalah….", "options": {"A": "sinar alfa (4He2)", "B": "sinar beta", "C": "sinar gamma", "D": "sinar-x", "E": "proton"}, "answer": "A", "pembahasan": "Berdasarkan hukum kekekalan massa (9+A=12+1 → A=4) dan kekekalan muatan (4+Z=6+0 → Z=2), maka x adalah partikel alfa (4He2)."}, {"no": 40, "stem": "Peluruhan massa zat radioaktif X memenuhi grafik massa (m) terhadap waktu (t): pada t=6s massa=50 gram (dari 100 gram awal), t=12s massa=25 gram, t=18s massa=12,5 gram. Berdasarkan grafik, konstanta peluruhan (λ) zat radioaktif tersebut adalah…..", "options": {"A": "0,116 s-1", "B": "0,230 s-1", "C": "0,345 s-1", "D": "0,560 s-1", "E": "0,693 s-1"}, "answer": "A", "pembahasan": "Dari grafik, waktu paruh T1/2=6 s. λ=0,693/T1/2=0,693/6=0,1155 ≈ 0,116 /s."}]}}</script>
<script>
const EXAM = JSON.parse(document.getElementById('exam-data').textContent);

// ==== KONFIGURASI GURU ====
// Tempel URL Web App Google Apps Script di sini (lihat panduan yang menyertai file ini).
// Kosongkan ('') jika belum ingin mengirim hasil ke Spreadsheet guru.
const SHEET_WEBHOOK_URL = '';

let state = {
  paketKey: null,
  paket: null,
  namaSiswa: '',
  kelas: '',
  qIndex: 0,
  answers: {},
  timeLeft: 0,
  timerId: null,
  finished: false,
  result: null
};

function el(id){ return document.getElementById(id); }
function show(id){ el(id).classList.remove('hidden'); }
function hide(id){ el(id).classList.add('hidden'); }

function renderHome(){
  hide('screen-exam'); hide('screen-result'); show('screen-home');
  hide('btnHome');
  const keys = Object.keys(EXAM);
  let cards = keys.map(k => {
    const p = EXAM[k];
    return `<div class="paket-card" onclick="openStartModal('${k}')">
      <span class="paket-tag">${p.mapel}</span>
      <h3>${p.nama}</h3>
      <div class="paket-meta">
        <span>&#128203; ${p.soal.length} soal</span>
        <span>&#8987; ${p.durasi} menit</span>
      </div>
    </div>`;
  }).join('');
  el('screen-home').innerHTML = `
    <div class="home-hero">
      <h1>Pilih paket tryout</h1>
      <p>Empat paket soal TKA siap dikerjakan. Pilih salah satu paket di bawah untuk memulai sesi ujian dengan waktu berjalan otomatis.</p>
    </div>
    <div class="paket-grid">${cards}</div>
  `;
}

function openStartModal(key){
  const p = EXAM[key];
  el('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${p.nama}</h3>
        <p>${p.soal.length} soal pilihan ganda. Waktu pengerjaan berjalan mundur dan akan submit otomatis saat habis.</p>
        <label>Nama lengkap
          <input type="text" id="namaInput" value="${state.namaSiswa||''}" placeholder="Tulis nama kamu" style="width:100%; font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;">
        </label>
        <label>Kelas
          <input type="text" id="kelasInput" value="${state.kelas||''}" placeholder="Contoh: XII IPA 1" style="width:100%; font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;">
        </label>
        <label>Durasi (menit)
          <input type="number" id="durInput" value="${p.durasi}" min="5" max="180">
        </label>
        <div id="modalErr" style="color:var(--warn); font-size:13px; display:none;">Nama dan kelas wajib diisi.</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary" onclick="startExam('${key}')">Mulai Ujian</button>
        </div>
      </div>
    </div>`;
}
function closeModal(){ el('modalRoot').innerHTML = ''; }

function startExam(key){
  const namaInput = el('namaInput');
  const kelasInput = el('kelasInput');
  const nama = namaInput ? namaInput.value.trim() : '';
  const kelas = kelasInput ? kelasInput.value.trim() : '';
  if(!nama || !kelas){
    el('modalErr').style.display = 'block';
    return;
  }
  const durInput = el('durInput');
  const durasi = durInput ? parseInt(durInput.value) || EXAM[key].durasi : EXAM[key].durasi;
  closeModal();
  state = {
    paketKey:key, paket:EXAM[key], namaSiswa:nama, kelas:kelas, qIndex:0, answers:{},
    timeLeft: durasi*60, timerId:null, finished:false, result:null
  };
  hide('screen-home'); hide('screen-result'); show('screen-exam');
  show('btnHome');
  renderExam();
  state.timerId = setInterval(tick, 1000);
}

function tick(){
  state.timeLeft--;
  updateTimerDisplay();
  if(state.timeLeft <= 0){
    clearInterval(state.timerId);
    submitExam(true);
  }
}
function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m+':'+s;
}
function updateTimerDisplay(){
  const t = el('timerDisplay');
  if(!t) return;
  t.textContent = fmtTime(Math.max(0,state.timeLeft));
  t.parentElement.classList.toggle('low', state.timeLeft <= 60 && state.timeLeft > 0);
}

function renderExam(){
  const p = state.paket;
  const q = p.soal[state.qIndex];
  const total = p.soal.length;
  const answeredCount = Object.keys(state.answers).length;

  let optionsHtml = Object.keys(q.options).map(letter => {
    const selected = state.answers[q.no] === letter;
    return `<div class="option ${selected?'selected':''}" onclick="selectAnswer(${q.no}, '${letter}')">
      <span class="bubble">${letter}</span>
      <span>${q.options[letter]}</span>
    </div>`;
  }).join('');

  let bubbles = p.soal.map((qq, i) => {
    const answered = state.answers[qq.no] !== undefined;
    const current = i === state.qIndex;
    return `<div class="nav-bubble ${answered?'answered':''} ${current?'current':''}" onclick="goToQuestion(${i})">${qq.no}</div>`;
  }).join('');

  el('screen-exam').innerHTML = `
    <div class="exam-header">
      <div>
        <div class="subtes">${p.mapel}</div>
        <h2>${p.nama}</h2>
      </div>
      <div class="timer"><span>&#9201;</span><span id="timerDisplay">${fmtTime(state.timeLeft)}</span></div>
    </div>
    <div class="exam-body">
      <div class="question-card">
        <div class="q-index">Soal nomor ${q.no} dari ${total}</div>
        <div class="q-stem">${escapeHtml(q.stem)}</div>
        <div class="options">${optionsHtml}</div>
        <div class="nav-buttons">
          <button class="btn btn-ghost" ${state.qIndex===0?'disabled':''} onclick="goToQuestion(${state.qIndex-1})">&larr; Sebelumnya</button>
          ${state.qIndex===total-1
            ? `<button class="btn btn-warn" onclick="confirmSubmit()">Selesaikan Ujian</button>`
            : `<button class="btn btn-primary" onclick="goToQuestion(${state.qIndex+1})">Selanjutnya &rarr;</button>`}
        </div>
      </div>
      <div class="sidebar">
        <div class="sidebar-title">Navigasi Soal</div>
        <div class="progress-text">${answeredCount} / ${total} terjawab</div>
        <div class="bubble-grid">${bubbles}</div>
        <div class="legend">
          <span><span class="dot answered"></span> Terjawab</span>
          <span><span class="dot unanswered"></span> Belum dijawab</span>
        </div>
        <button class="btn btn-warn" style="width:100%" onclick="confirmSubmit()">Selesaikan Ujian</button>
      </div>
    </div>
  `;
  updateTimerDisplay();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectAnswer(qno, letter){
  state.answers[qno] = letter;
  renderExam();
}
function goToQuestion(i){
  if(i < 0 || i >= state.paket.soal.length) return;
  state.qIndex = i;
  renderExam();
}

function confirmSubmit(){
  const total = state.paket.soal.length;
  const answered = Object.keys(state.answers).length;
  const sisa = total - answered;
  el('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Selesaikan ujian?</h3>
        <p>${sisa > 0 ? `Masih ada <b>${sisa} soal</b> yang belum dijawab. ` : ''}Setelah disubmit, jawaban tidak dapat diubah lagi.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Kembali mengerjakan</button>
          <button class="btn btn-warn" onclick="submitExam(false)">Ya, Selesaikan</button>
        </div>
      </div>
    </div>`;
}

function submitExam(auto){
  closeModal();
  if(state.timerId) clearInterval(state.timerId);
  state.finished = true;

  const p = state.paket;
  let correct = 0, wrong = 0, unanswered = 0;
  const details = p.soal.map(q => {
    const given = state.answers[q.no];
    const isCorrect = given === q.answer;
    if(given === undefined) unanswered++;
    else if(isCorrect) correct++; else wrong++;
    return {q, given, isCorrect};
  });
  const total = p.soal.length;
  const score = Math.round((correct/total)*100);
  state.result = {correct, wrong, unanswered, total, score, details};

  sendToSheet({
    nama: state.namaSiswa, kelas: state.kelas,
    paket: p.nama, mapel: p.mapel,
    skor: score, benar: correct, salah: wrong, kosong: unanswered, total: total
  });

  renderResult(auto);
}

function sendToSheet(data){
  if(!SHEET_WEBHOOK_URL) return; // belum dikonfigurasi guru, lewati
  try{
    const body = new URLSearchParams(data);
    fetch(SHEET_WEBHOOK_URL, { method:'POST', mode:'no-cors', body });
  }catch(e){
    console.warn('Gagal mengirim hasil ke Spreadsheet guru:', e);
  }
}

function renderResult(auto, filter){
  filter = filter || 'all';
  hide('screen-exam'); show('screen-result');
  const p = state.paket;
  const {correct, wrong, unanswered, total, score, details} = state.result;

  const filtered = details.filter(d => {
    if(filter==='wrong') return d.given!==undefined && !d.isCorrect;
    if(filter==='unanswered') return d.given===undefined;
    return true;
  });

  const reviewHtml = filtered.map(d => {
    const cls = d.given===undefined ? 'wrong' : (d.isCorrect ? 'correct' : 'wrong');
    const givenText = d.given ? `${d.given}. ${d.q.options[d.given]}` : '(tidak dijawab)';
    const correctText = `${d.q.answer}. ${d.q.options[d.q.answer]}`;
    const pemb = d.q.pembahasan ? `<div class="pemb"><b>Pembahasan:</b> ${escapeHtml(d.q.pembahasan)}</div>` : '';
    return `<div class="review-item ${cls}">
      <div class="rq">No. ${d.q.no} &middot; ${escapeHtml(d.q.stem.split('\n')[0])}</div>
      <div class="ra">Jawaban Anda: <b>${escapeHtml(givenText)}</b><br>Jawaban benar: <b>${escapeHtml(correctText)}</b></div>
      ${pemb}
    </div>`;
  }).join('') || `<div class="review-item">Tidak ada soal pada kategori ini.</div>`;

  el('screen-result').innerHTML = `
    <div class="result-hero">
      ${auto ? '<p style="color:var(--warn); font-size:13px; margin-bottom:10px;">&#9201; Waktu habis, ujian disubmit otomatis.</p>' : ''}
      <div class="score-num">${score}</div>
      <div class="score-label">Skor akhir &middot; ${p.nama}</div>
      <div class="score-label">${escapeHtml(state.namaSiswa)} &middot; ${escapeHtml(state.kelas)}</div>
      ${SHEET_WEBHOOK_URL ? '<div class="score-label" style="margin-top:6px; color:var(--accent-ink);">&#10003; Hasil terkirim ke guru</div>' : ''}
      <div class="result-stats">
        <div class="stat"><b>${correct}</b><span>Benar</span></div>
        <div class="stat"><b>${wrong}</b><span>Salah</span></div>
        <div class="stat"><b>${unanswered}</b><span>Kosong</span></div>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" onclick="goHome()">Kembali ke Beranda</button>
      <button class="btn btn-primary" onclick="openStartModal('${state.paketKey}')">Ulangi Paket Ini</button>
    </div>
    <div class="filter-tabs">
      <div class="filter-tab ${filter==='all'?'active':''}" onclick="renderResult(false,'all')">Semua (${total})</div>
      <div class="filter-tab ${filter==='wrong'?'active':''}" onclick="renderResult(false,'wrong')">Salah (${wrong+unanswered})</div>
      <div class="filter-tab ${filter==='unanswered'?'active':''}" onclick="renderResult(false,'unanswered')">Kosong (${unanswered})</div>
    </div>
    <div class="review-list">${reviewHtml}</div>
  `;
}

function goHome(){
  if(state.timerId) clearInterval(state.timerId);
  if(!state.finished && state.paketKey){
    if(!confirm('Ujian belum selesai. Yakin ingin kembali ke beranda? Progres akan hilang.')) return;
  }
  state = {paketKey:null, paket:null, namaSiswa:'', kelas:'', qIndex:0, answers:{}, timeLeft:0, timerId:null, finished:false, result:null};
  renderHome();
}

renderHome();
</script>
</body>
</html>
