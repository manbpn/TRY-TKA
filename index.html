<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Ujian - Tryout TKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EFE7;
    --paper:#FFFFFF;
    --ink:#1E2430;
    --ink-soft:#5B6272;
    --line:#DCD7C9;
    --accent:#2B5D50;
    --accent-soft:#DCE8E4;
    --accent-ink:#153029;
    --warn:#B5482D;
    --warn-soft:#F3DED6;
    --gold:#B08D3E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:28px 20px 60px;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  .brandbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px; margin-bottom:28px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces', serif; font-weight:700; font-size:16px;
  }
  .brand-name{font-family:'Fraunces', serif; font-size:19px; font-weight:600; letter-spacing:0.2px;}
  .brand-sub{font-size:12px; color:var(--ink-soft);}

  /* ---------- HOME ---------- */
  .home-hero{margin-bottom:32px;}
  .home-hero h1{font-size:32px; line-height:1.25; margin-bottom:10px;}
  .home-hero p{color:var(--ink-soft); font-size:15px; max-width:560px; line-height:1.6;}
  .paket-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px;
  }
  .paket-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .paket-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(30,36,48,0.08);}
  .paket-tag{
    align-self:flex-start; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:999px;
    font-weight:600;
  }
  .paket-card h3{font-size:18px; line-height:1.35;}
  .paket-meta{font-size:13px; color:var(--ink-soft); display:flex; gap:14px; margin-top:auto;}
  .paket-meta span{display:flex; align-items:center; gap:5px;}

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px;
    padding:11px 20px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    transition:opacity .12s ease;
  }
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn-warn{background:var(--warn); color:#fff;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---------- MODAL / CONFIRM ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,24,32,0.45); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper); border-radius:12px; padding:26px; max-width:420px; width:100%;
    display:flex; flex-direction:column; gap:16px;
  }
  .modal h3{font-size:19px;}
  .modal p{font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .modal label{font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:6px;}
  .modal input[type=number]{
    font-family:'IBM Plex Mono', monospace; font-size:15px; padding:9px 12px;
    border:1px solid var(--line); border-radius:8px; width:100px;
  }

  /* ---------- EXAM SCREEN ---------- */
  .exam-header{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 20px; margin-bottom:16px;
  }
  .exam-header .subtes{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .exam-header h2{font-size:18px;}
  .timer{
    font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--accent-ink);
    display:flex; align-items:center; gap:8px;
  }
  .timer.low{color:var(--warn);}
  .exam-body{display:grid; grid-template-columns:1fr 220px; gap:16px;}
  @media (max-width:720px){ .exam-body{grid-template-columns:1fr;} }

  .question-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px;
  }
  .q-index{font-size:12px; color:var(--ink-soft); margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em;}
  .q-stem{font-size:15.5px; line-height:1.75; white-space:pre-wrap; margin-bottom:20px;}
  .q-stem table{border-collapse:collapse; margin:10px 0; font-size:14px;}
  .options{display:flex; flex-direction:column; gap:9px;}
  .option{
    display:flex; align-items:flex-start; gap:12px; border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; cursor:pointer; font-size:14.5px; line-height:1.55;
  }
  .option:hover{border-color:var(--accent);}
  .option.selected{border-color:var(--accent); background:var(--accent-soft);}
  .option .bubble{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace;
    font-size:13px; font-weight:600; color:var(--ink-soft); margin-top:1px;
  }
  .option.selected .bubble{background:var(--accent); border-color:var(--accent); color:#fff;}

  .nav-buttons{display:flex; justify-content:space-between; margin-top:22px;}

  .sidebar{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
    height:fit-content;
  }
  .sidebar-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:12px;}
  .bubble-grid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:7px; margin-bottom:16px;
  }
  .nav-bubble{
    aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace;
    font-size:12px; cursor:pointer; color:var(--ink-soft);
  }
  .nav-bubble.answered{background:var(--accent); border-color:var(--accent); color:#fff;}
  .nav-bubble.current{border-color:var(--warn); border-width:2px; color:var(--ink); font-weight:700;}
  .nav-bubble.answered.current{background:var(--accent); color:#fff;}
  .legend{font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .legend span{display:flex; align-items:center; gap:7px;}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block;}
  .dot.answered{background:var(--accent);}
  .dot.unanswered{border:1.5px solid var(--line);}
  .progress-text{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}

  /* ---------- RESULT ---------- */
  .result-hero{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:32px; text-align:center; margin-bottom:20px;
  }
  .score-num{font-family:'Fraunces', serif; font-size:56px; font-weight:700; color:var(--accent-ink);}
  .score-label{color:var(--ink-soft); font-size:14px; margin-top:4px;}
  .result-stats{display:flex; justify-content:center; gap:28px; margin-top:20px;}
  .stat{text-align:center;}
  .stat b{font-size:20px; display:block; font-family:'IBM Plex Mono', monospace;}
  .stat span{font-size:12px; color:var(--ink-soft);}
  .review-list{display:flex; flex-direction:column; gap:10px;}
  .review-item{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
    font-size:14px;
  }
  .review-item.wrong{border-left:4px solid var(--warn);}
  .review-item.correct{border-left:4px solid var(--accent);}
  .review-item .rq{white-space:pre-wrap; margin-bottom:8px; color:var(--ink);}
  .review-item .ra{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  .review-item .ra b{color:var(--ink);}
  .review-item .pemb{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; color:var(--ink-soft);}
  .result-actions{display:flex; gap:10px; justify-content:center; margin:24px 0;}
  .filter-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .filter-tab{
    font-size:13px; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); cursor:pointer; color:var(--ink-soft);
  }
  .filter-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .hidden{display:none !important;}
  footer.note{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:40px; line-height:1.7;}

  body.gate-mode{ background:var(--gate-bg); }
  body.gate-mode .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  body.gate-mode .brandbar{ display:none; }
  body.gate-mode footer.note{ display:none; }

  :root{ --gate-bg:#0E3B2C; --gate-card:#0A2E22; --gate-line:rgba(255,255,255,0.16); --gate-text:#E9F0EC; --gate-text-soft:#9FB8AC; }

  .gate-box{
    background:var(--gate-card); border:1px solid var(--gate-line); border-radius:14px;
    padding:38px 34px 28px; max-width:380px; width:100%; margin:0 auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .gate-icon{ display:flex; justify-content:center; margin-bottom:18px; }
  .gate-icon svg{ width:26px; height:26px; }
  .gate-box h2{ font-size:19px; color:var(--gate-text); text-align:center; margin-bottom:6px; }
  .gate-box p{ color:var(--gate-text-soft); font-size:13px; line-height:1.6; margin-bottom:20px; text-align:center; }
  .gate-box label{ font-size:12px; color:var(--gate-text-soft); display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .gate-box input{
    font-family:inherit; font-size:14.5px; padding:11px 4px;
    border:none; border-bottom:1px solid var(--gate-line); border-radius:0; width:100%;
    background:transparent; color:var(--gate-text);
  }
  .gate-box input::placeholder{ color:#5F7A6E; }
  .gate-box input:focus{ outline:none; border-bottom-color:#4FBF95; }
  .gate-actions{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .gate-actions .btn{ width:100%; text-align:center; }
  .btn-gate-primary{
    background:#123626; color:var(--gate-text); border:1px solid var(--gate-line);
    padding:12px 20px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn-gate-primary:hover{ background:#164531; }
  .gate-msg{font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px;}
  .gate-msg.error{background:rgba(181,72,45,0.18); color:#F0A98F;}
  .gate-msg.info{background:rgba(79,191,149,0.15); color:#7EDCB6;}
  .gate-footer{ text-align:center; font-size:11px; color:var(--gate-text-soft); margin-top:22px; }
  .gate-link{ text-align:center; font-size:12.5px; color:var(--gate-text-soft); margin-top:16px; }
  .gate-link a{ color:#7EDCB6; text-decoration:none; }

  /* ---------- ADMIN ---------- */
  .admin-toolbar{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .admin-toolbar h2{font-size:24px; margin-bottom:6px;}
  .admin-stats{font-size:13px; color:var(--ink-soft);}
  .admin-toolbar-actions{display:flex; gap:8px;}
  .admin-actions-top{margin-bottom:14px;}
  .admin-table-wrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto;}
  table.admin-table{border-collapse:collapse; width:100%; font-size:13.5px; white-space:nowrap;}
  table.admin-table th, table.admin-table td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line);}
  table.admin-table th{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--bg);}
  table.admin-table tr:last-child td{border-bottom:none;}
  table.admin-table code{font-family:'IBM Plex Mono', monospace; background:var(--accent-soft); padding:2px 6px; border-radius:5px; font-size:12.5px;}
  .admin-actions-cell{display:flex; gap:6px; flex-wrap:wrap;}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .status-badge{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.wait{background:var(--warn-soft); color:var(--warn);}
  .status-badge.ok{background:var(--accent-soft); color:var(--accent-ink);}
  .status-badge.no{background:#EAEAEA; color:#6B6B6B;}</style>
</head>

<script id="exam-data" type="application/json">{"ekonomi1": {"nama": "Tryout TKA Ekonomi - Paket 1", "mapel": "Ekonomi", "durasi": 60, "soal": [{"no": 1, "stem": "Pada musim hujan, produksi cabai merah menurun karena tanaman cabai mudah busuk. Akibatnya stok cabai merah terus berkurang sehingga harganya naik karena persediannya semakin langka.\nDampak dari kelangkaan ini bagi masyarakat yang paling tepat adalah....", "options": {"A": "membeli cabai merah impor meskipun harganya lebih tinggi dari pasaran", "B": "berhenti mengonsumsi cabai merah sampai harganya menjadi normal kembali", "C": "membeli cabai langsung dari petani di pedesaan agar harganya tangan pertama", "D": "mengganti cabai merah dengan cabai hijau atau cabai rawit yang rasanya mirip", "E": "tetap mengonsumsi cabai merah karena selera nusantara rekat dengan rasa cabai"}, "answer": "D"}, {"no": 2, "stem": "Di bawah ini adalah masalah pokok ekonomi:\n1. darimana diperoleh semua benda (barang dan jasa) yang dibutuhkan oleh banyak orang.\n2. barang dan jasa apa saja yang akan diproduksi dan dalam jumlah berapa\n3. bagaimana benda-benda yang telah diproduksi bisa sampai ke tangan konsumen yang membutuhkan\n4. dengan cara bagaimana proses produksi akan dilakukan\n5. untuk siapa barang dan jasa diproduksi\nDari pernyataan di atas, yang merupakan masalah pokok ekonomi menurut aliran ekonomi modern adalah ... .", "options": {"A": "1, 2, dan 3", "B": "1, 2, dan 4", "C": "1, 3, dan 5", "D": "2, 3, dan 4", "E": "2, 4, dan 5"}, "answer": "E"}, {"no": 3, "stem": "Hak milik atas alat produksi di tangan perorangan atau swasta, Harga barang ditentukan oleh permintaan dan penawaran di pasar, Adanya persaingan bebas, Tidak ada campur tangan pemerintah dalam perekonomian, Modal memegang peranan penting, Terbuka kesempatan bagi individu untuk mengejar keuntungan. Masyarakat yang seperti itu biasanya menganut sistem ekonomi ….", "options": {"A": "Pasar bebas", "B": "Campuran", "C": "Tradisional", "D": "Terpusat", "E": "Etatisme"}, "answer": "A"}, {"no": 4, "stem": "Perhatikan Circular Flow diagram, dengan arus bernomor 1-12 yang menghubungkan RTK, Pasar Barang dan Jasa, Pemerintah, RTP, dan Pasar Faktor Produksi.\nDari circular flow diagram di atas, interpretasi nomor 5 adalah….", "options": {"A": "Barang dan jasa", "B": "Pajak", "C": "Subsidi", "D": "Gaji, sewa, bunga dan laba", "E": "Alam, Tk, Modal dan Kewirausahaan"}, "answer": "A"}, {"no": 5, "stem": "Perhatikan data di kantin SMA Sukses Mulia pada Maret 2017 berikut ini:\nHarga | Jumlah Permintaan (potong) | Jumlah Penawaran (potong)\nRp2.000,00 | 40 | 60\nRp3.000,00 | 30 | 70\nBerdasarkan data di atas, maka titik keseimbangan pasar (Q;P) adalah ....", "options": {"A": "(15; 500)", "B": "(15; 4.500)", "C": "(50; 1.000)", "D": "(2.500; 50)", "E": "(5.500; 35)"}, "answer": "C"}, {"no": 6, "stem": "Perhatikan tabel berikut:\nHarga per unit | Jumlah barang yang diminta\n50 | 50\n60 | 45\nBerdasarkan data tersebut maka koefisien elastisitas permintaannya adalah ....", "options": {"A": "0", "B": "0,5", "C": "0,8", "D": "1", "E": "Tak terhingga"}, "answer": "D"}, {"no": 7, "stem": "Beberapa kegiatan ekonomi masyarakat pada pasar output dan input sebagai berikut:\n(1) Adinda pergi ke taman kuliner membeli rujak es krim kegemarannya.\n(2) Bapak Ali sudah lama menjadi eksportir batik ke luar negeri\n(3) Bapak Agung berencana menginvestasikan uangnya dalam bentuk saham\n(4) Setelah lulus SMA, Budi mencari info lowongan kerja melalui Job Fair di JEC\n(5) Semua warga masyarakat yang memenuhi syarat boleh mendaftar sebagai PNS\n(6) Najib gemar membuat kue, sehingga ia bercita-cita menjadi pengusaha kue yang sukses\nKegiatan diatas yang merupakan kegiatan pasar Input ditunjukkan oleh ….", "options": {"A": "(1), (2), dan (3)", "B": "(1), (3) dan (4)", "C": "(2) (3) dan (5)", "D": "(3) (4) dan (5)", "E": "(4) (5) dan (6)"}, "answer": "D"}, {"no": 8, "stem": "Pemerintah mempunyai wewenang menetapkan harga dasar tarif listrik yang dijual oleh PLN. Dalam 1 tahun dapat mungkin terjadi kenaikan harga dasar listrik beberapa kali, bahkan terjadi juga penurunan harga. Masyarakat akan mengikuti berapapun harga tersebut karena sangat membutuhkan listrik. Dalam hal ini listrik yang dijual oleh PLN merupakan salah contoh kegiatan dalam pasar... .", "options": {"A": "Monopoli", "B": "Monopsoni", "C": "Monopolistik", "D": "Oligopoli", "E": "Oligopsoni"}, "answer": "B"}, {"no": 9, "stem": "Bank sentral melakukan penjualan surat berharga di pasar modal. Hal tersebut dilakukan untuk menstabilkan aliran uang dan barang dalam ekonomi sehingga inflasi dapat diatasi. Kebijakan yang dilakukan bank sentral ini sering disebut … .", "options": {"A": "Kebijakan kredit selektif", "B": "Politik pasar terbuka", "C": "Politik cadangan kas", "D": "Politik diskonto", "E": "Sanering"}, "answer": "B"}, {"no": 10, "stem": "Negara Berdikari memiliki data kecepatan peredaran uang sebesar 0,4 dan harga pasar kisaran Rp80.000,00. Jika jumlah transaksi yang terjadi pada periode tersebut adalah 500.000 unit, maka besar jumlah uang beredar adalah ....", "options": {"A": "Rp100.000.000.000,-", "B": "Rp20.000.000.000,-", "C": "Rp16.000.000.000,-", "D": "Rp10.000.000.000,-", "E": "Rp8.000.000.000,-"}, "answer": "A"}, {"no": 11, "stem": "Menurut Pasal 4 UU Nomor 21 Tahun 2011, Otoritas Jasa Keuangan dibentuk untuk menyelenggarakan sistem pengaturan dan pengawasan yang terpadu terhadap keseluruhan kegiatan dalam sektor jasa keuangan.\nBerdasarkan ilustrasi di atas, yang merupakan fungsi OJK adalah ....", "options": {"A": "menetapkan peraturan pengenaan sanksi sesuai ketentuan perundang-undangan", "B": "mengelola laporan keuangan jasa keuangan sesuai keinginan jasa keuangan", "C": "membuat sistem pengawasan otoriter di semua jasa keuangan", "D": "memberikan pengawasan yang longgar kepada jasa keuangan yang tidak tertib", "E": "melakukan pemeriksaan keuangan jasa perbankan secara subjektif"}, "answer": "D"}, {"no": 12, "stem": "Merupakan suatu kegiatan yang berusaha untuk mengendalikan agar pelaksanaan dapat berjalan sesuai dengan rencana dan memastikan apakah tujuan organisasi tercapai. Apabila terjadi penyimpangan di mana letak penyimpangan itu dan bagaimana pula tindakan yang diperlukan untuk mengatasinya. Kegiatan ini ada dalam fungsi manajemen …..", "options": {"A": "Planning", "B": "Organizing", "C": "Controlling", "D": "Staffing", "E": "Actuating"}, "answer": "C"}, {"no": 13, "stem": "Persekutuan dua orang atau lebih untuk mendirikan usaha dimana satu atau beberapa orang sebagai sekutu yang hanya menyerahkan modal dan sekutu lainnya yang menjalankan perusahaan. Jadi dalam persekutuan ini dikenal dua sekutu, yaitu sekutu aktif atau sekutu bekerja atau sekutu komplementer, yaitu sekutu yang berhak memimpin perusahaan dan sekutu pasif atau sekutu tidak bekerja, yaitu sekutu yang hanya menyerahkan modalnya saja. Bentuk badan usaha ini yang dimaksud adalah …..", "options": {"A": "Firma", "B": "CV", "C": "PT", "D": "Perusahaan Perseorangan", "E": "Yayasan"}, "answer": "B"}, {"no": 14, "stem": "Berikut ini data yang digunakan untuk perhitungan pendapatan nasional Negara Suryakencana.\nUpah Rp850 miliar; Bunga modal Rp200 miliar; Laba usaha Rp200 miliar; Sewa tanah Rp350 miliar; Pengeluaran rumah tangga Rp800 miliar; Belanja pemerintah Rp500 miliar; Investasi Rp600 miliar; Ekspor Rp100 miliar.\nJika pendapatan nasional dihitung menggunakan pendekatan pengeluaran menghasilkan Rp1.950 miliar, maka nilai impornya adalah ….", "options": {"A": "Rp50 miliar", "B": "Rp100 miliar", "C": "Rp500 miliar", "D": "Rp550 miliar", "E": "Rp600 miliar"}, "answer": "A"}, {"no": 15, "stem": "Perhatikan pernyataan-pernyataan berikut!\n(1). Masyarakat semakin merata pendapatannya\n(2). Pendidikan yang semakin maju meningkatkan kualitas sumber daya manusia\n(3). Kerja sama ekonomi internasional ditingkatkan untuk memperbesar devisa negara\n(4). Potensi sumber daya alam digunakan secara efisien efektif\n(5). Produk barang dan jasa yang dihasilkan penduduk suatu negara semakin banyak\nBerdasarkan pernyataan di atas, yang berkaitan dengan pembangunan ekonomi adalah nomor ...", "options": {"A": "(1), (2), (3)", "B": "(1), (2), (4)", "C": "(1), (3), (5)", "D": "(2), (3), (4)", "E": "(3), (4), (5)"}, "answer": "B"}, {"no": 16, "stem": "Berikut adalah beberapa permasalahan yang dihadapi oleh pemerintah dalam pembangunan ekonomi:\n(1) Rendahnya kesempatan kerja\n(2) Sulitnya menurunkan laju inflasi\n(3) Konflik dalam partai peserta pemilu\n(4) Menyebarnya berita kebohongan.\n(5) Defisit neraca perdagangan dalam kegiatan ekspor impor\nBerdasarkan permasalahan-permasalahan di atas, yang termasuk masalah yang dihadapi oleh pemerintah dalam bidang ekonomi adalah nomor….", "options": {"A": "(1), (2), dan (3)", "B": "(1), (2), dan (5)", "C": "(2), (3), dan (4)", "D": "(2), (4), dan (5)", "E": "(3), (4), dan (5)"}, "answer": "B"}, {"no": 17, "stem": "Komposisi penduduk di daerah suatu negara pada tahun 2018 sebagai berikut:\n(1) Jumlah penduduk yang berusia 15-64 tahun 5 juta jiwa\n(2) Jumlah penduduk di bawah 15 tahun dan di atas 64 tahun 1 juta jiwa\n(3) Jumlah ibu rumah tangga dan anak sekolah 2 juta jiwa\n(4) Jumlah penduduk berusia 15-64 tahun yang sedang mencari pekerjaan 15% dari jumlah penduduk usia kerja\n(5) Jumlah penduduk yang bekerja 20% dari penduduk usia kerja\nBerdasarkan data di atas yang dapat digolongkan angkatan kerja ditunjukkan pada nomor:", "options": {"A": "(1) dan (2)", "B": "(2) dan (3)", "C": "(2) dan (4)", "D": "(3) dan (4)", "E": "(4) dan (5)"}, "answer": "D"}, {"no": 18, "stem": "Perhatikan tabel daftar harga hasil pertanian pada 5 desa (Sukarasa, Sukamakmur, Sukaramai, Sukajati, Sukawarna) untuk komoditas Tomat, Cabai, Kedelai tahun 2015 dan 2016 (dalam rupiah).\nData Indeks Bayar (IB) petani pada tahun 2016: Sukarasa = 111%; Sukamakmur = 118%; Sukaramai = 119%; Sukajati = 108%; Sukawarna = 115%.\nBerdasarkan data di atas, maka kesimpulan yang tepat adalah …", "options": {"A": "Petani Desa Sukarasa lebih sejahtera dibandingkan petani Desa Sukawarna.", "B": "Petani Desa Sukamakmur sama sejahteranya dengan petani Desa Sukaramai.", "C": "Petani Desa Sukaramai lebih sejahtera dibandingkan petani Desa Sukajati.", "D": "Kesejahteraan petani Desa Sukajati paling tinggi daripada desa lainnya.", "E": "Kesejahteraan petani Desa Sukawarna paling tinggi daripada desa lainnya."}, "answer": "C"}, {"no": 19, "stem": "Perhatikan matrik kebijakan pemerintah berikut ini:\nNo | A | B | C\n1 | Menaikkan diskonto | Menambah jumlah barang di pasar | Menaikkan cadangan minimum\n2 | Mengurangi pengeluaran negara | Menjual surat berharga | Menaikkan upah riil masyarakat\n3 | Kebijakan harga maksimum | Menaikkan atau mengefektifkan pajak | Penghematan pengeluaran rutin\nBerdasarkan matriks di atas, maka cara mengatasi inflasi dengan kebijakan non moneter dan non fiskal adalah …..", "options": {"A": "A1, B2 dan C1", "B": "A1, B2 dan C3", "C": "A2, B1 dan C2", "D": "A2, B3 dan C1", "E": "A3, B1 dan C2"}, "answer": "E"}, {"no": 20, "stem": "Sumber Penerimaan APBD adalah sebagai berikut kecuali....", "options": {"A": "Pajak: PPN, PPh, PBB, PPnBM dll", "B": "Transfer Daerah dan Dana Desa", "C": "Retribusi: wisata, Parkir, sampah, penjualan di pasar dll", "D": "Hasil pengelolaan Perusahaan Daerah: PDAM, RSUD, BPD dll", "E": "Hasil pengelolaan kekayaan Daerah: Hasil Hutan, Tambang dll"}, "answer": "A"}, {"no": 21, "stem": "Seseorang memiliki obyek pajak sebagai berikut:\n1. Tanah seluas 500 m2 dengan nilai jual Rp300.000,- per m2\n2. Bangunan seluas 300 m2 dengan nilai jual Rp400.000,- per m2\n3. Pagar sepanjang 50 m, tinggi 1,5 m dengan nilai jual Rp40.000,- per m2\nJika nilai jual yang tidak kena pajak ditetapkan sebesar Rp12.000.000,-, maka besarnya Pajak Bumi dan Bangunan (PBB) berdasarkan UU yang berlaku adalah …..", "options": {"A": "Rp 273.000,-", "B": "Rp 263.000,-", "C": "Rp 261.000,-", "D": "Rp 260.000,-", "E": "Rp 253.000,-"}, "answer": "C"}, {"no": 22, "stem": "Perhatikan pernyataan berikut:\n1) Indonesia negara yang kaya akan sumber daya laut sehingga menjadi pengekspor ikan ke beberapa negara yang tidak memiliki sumber daya ikan.\n2) walaupun dengan biaya yang sangat mahal Indonesia tetap memproduksi handphone untuk bisa bersaing dengan china\n3) Mobil dari Jepang dan Amerika paling menguasai pasaran internasional karena teknologinya yang sangat canggih, sehingga sangat nyaman dan aman untuk dikendarai dibanding mobil dari negara lain.\n4) Masyarakat Indonesia sudah semakin makmur ditandai dengan semakin meningkatnya impor kendaraan dari jepang\n5) Indonesia masih sering mengimpor beras dari Thailand karena produksi dalam negeri belum mencukupi sedangkan beras bagi lidah masyarakat indonesia tidak bisa digantikan bahan makan lain\nYang mencerminkan pendorong perdagangan Internasional ditunjukkan nomor..", "options": {"A": "1, 2 dan 3", "B": "2, 3 dan 5", "C": "1, 3 dan 5", "D": "3, 4 dan 5", "E": "2, 4 dan 5"}, "answer": "C"}, {"no": 23, "stem": "Perhatikan beberapa transaksi yang dilakukan oleh negara Bhineka Selaras berikut ini!\n(1) mengimpor kebutuhan mesin elektronik yang tidak dimiliki.\n(2) mengirimkan tenaga kerja terlatih ke negara-negara tetangga.\n(3) membayar pokok dan bunga hutang yang jatuh tempo.\n(4) mengekspor hasil olahan perkebunan berkualitas tinggi.\n(5) menerima dana hibah penelitian ristek di bidang pertambangan.\nKegiatan yang merupakan sumber devisa bagi negara Bhineka Selaras ditunjukkan nomor ....", "options": {"A": "(1), (2), dan (3)", "B": "(1), (2), dan (5)", "C": "(2), (3), dan (4)", "D": "(2), (3), dan (5)", "E": "(2), (4), dan (5)"}, "answer": "E"}, {"no": 24, "stem": "Kurs Valuta Asing adalah perbandingan nilai mata uang asing yang dinyatakan dengan nilai mata uang dalam negeri. Macam-macam kurs: Kurs Jual, harga saat bank menjual valas (misal US$1 = Rp9.095,-). Kurs Beli, harga saat bank membeli valas (misal US$1 = Rp9.070,-).\nApabila kurs valuta asing tidak stabil dan selalu mengalami fluktuasi secara cepat maka kemungkinan situasi yang terjadi adalah ….", "options": {"A": "Ekspor akan meningkat", "B": "Produksi meningkat", "C": "Hutang meningkat", "D": "Spekulan meningkat", "E": "Pengangguran meningkat"}, "answer": "D"}, {"no": 25, "stem": "Bentuk Kerjasama ekonomi internasional dapat dilakukan dalam berbagai bentuk. Salah satunya adalah kerjasama ekonomi yang dilakukan oleh negara-negara yang berada dalam satu kawasan seperti ASEAN, Uni Eropa, LAFTA, ECOWAS. Bentuk kerjasama tersebut termasuk dalam kerjasama", "options": {"A": "Antar Regional", "B": "Bilateral", "C": "Global", "D": "Multilateral", "E": "Regional"}, "answer": "E"}, {"no": 26, "stem": "Perhatikan analisis transaksi:\n1. Diterima setoran modal dari Mbak Ara berupa uang tunai Rp50.000.000,- dan peralatan salon Rp20.000.000,-: Kas bertambah di Debet Rp50.000.000,-, Peralatan bertambah di debet Rp20.000.000,- dan Modal bertambah di kredit Rp50.000.000,-\n2. Menerima pinjaman dari bank sebesar Rp25.000.000,- dipotong biaya administrasi Rp1.000.000,-: kas (+) di Debet Rp25.000.000,- dan utang bank (+) di kredit Rp25.000.000,-\n3. Membeli perlengkapan salon Rp3.000.000,- dibayar tunai Rp2.000.000,- sisanya kredit: harta perlengkapan (+) di Debit Rp3.000.000,-, kas (-) di kredit Rp2.000.000,- dan utang (+) di kredit sebesar Rp1.000.000,-\n4. Diselesaikan pekerjaan merias pengantin sebesar Rp7.000.000,- diterima tunai Rp5.000.000,- kekurangannya minggu depan: kas (+) di Debet Rp5.000.000,- dan piutang (+) di Debit Rp2.000.000,- dan pendapatan (+) di kredit Rp7.000.000,-\n5. Dibayar gaji pekerja 3 orang masing-masing Rp1.000.000,-: beban gaji (+) di Debet Rp3.000.000,- dan Kas (-) di Kredit Rp3.000.000,-\nAnalisis transaksi di atas yang benar adalah ....", "options": {"A": "1, 2, dan 3", "B": "1, 3, dan 4", "C": "2, 3, dan 4", "D": "2, 4, dan 5", "E": "3, 4, dan 5"}, "answer": "E"}, {"no": 27, "stem": "Perhatikan bukti transaksi: Copy bukti kuitansi No 021, Sudah terima dari Dyah Ayu Tenan, g paling efisien dengan prosentase laba terbaik adalah PD Niak (laba dibanding modal)"}, "answer": "D"}]}, "ekonomi2": {"nama": "Tryout TKA Ekonomi - Paket 2", "mapel": "Ekonomi", "durasi": 60, "soal": [{"no": 1, "stem": "Fernanda memutuskan untuk membuka usaha produksi makanan dan jajanan anak-anak. Untuk mengeluti usaha tersebut Fernanda memutuskan untuk meninggalkan pekerjaannya di super market dimana saat ia bekerja memperoleh gaji sebesar Rp 1.300.000,- setiap bulan. Sebagai modal ia menggunakan uang tabungan sebesar Rp 5.000.000,-. Jika ia tabung di bank, uang tersebut menghasilkan bunga Rp 150.000,-. Dalam bulan pertama, rincian biaya dan pendapatan usaha Fernanda adalah sebagai berikut:\nBiaya:\n- Membayar gaji 2 karyawan: Rp 1.800.000,-\n- Membeli tambahan alat-alat produksi: Rp 1.000.000,-\n- Membeli bahan-bahan produksi: Rp 1.500.000,-\n- Biaya operasional harian: Rp 700.000,-\nTOTAL BIAYA (eksplisit): Rp 5.000.000,-\nPendapatan:\n- Hasil penjualan bulan pertama: Rp 6.200.000,-\n- Laba = Hasil penjualan - total biaya = Rp 1.200.000,-\nMaka biaya peluang yang timbul akibat pilihan Sdr Fernanda adalah ...", "options": {"A": "Rp 1.000.000,-", "B": "Rp 1.200.000,-", "C": "Rp 1.300.000,-", "D": "Rp 1.700.000,-", "E": "Rp 5.000.000,-"}, "answer": "C"}, {"no": 2, "stem": "Di bawah ini adalah masalah-masalah yang berhubungan dengan ekonomi:\n1. Bagaimana menggunakan sumber ekonomi yang terbatas untuk memenuhi kebutuhan yang sebaik-baiknya\n2. Berapa banyak barang yang akan diproduksi dan disalurkan kepada masyarakat\n3. Kurangnya distribusi pendapatan\n4. Tingginya laju inflasi negara berkembang atau pemerataan pendapatan negara\n5. Teknologi yang digunakan untuk memproduksi barang\nYang termasuk inti masalah pokok ekonomi adalah ...", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 4", "C": "3, 4 dan 5", "D": "2, 3 dan 4", "E": "1, 2 dan 5"}, "answer": "E"}, {"no": 3, "stem": "Berikut ini kelemahan suatu sistem ekonomi:\nNo | A | B | C\n1 | Hak milik individu sangat dibatasi dan rakyat kurang memiliki pilihan | Tidak ada kerjasama antar individu atau masyarakat | Jika peran pemerintah mendominasi akan timbul etatisme\n2 | Menimbulkan persaingan yang tidak sehat | Potensi dan daya kreasi tidak berkembang | Tidak ada kebebasan individu dan masyarakat\n3 | Masyarakatnya statis | Terdapat kesenjangan antara yang kaya dan miskin | Terdapat eksploitasi sumber daya manusia\nYang merupakan kelemahan dari sistem ekonomi pasar adalah ...", "options": {"A": "A1, B1 dan C1", "B": "A2, B3 dan C3", "C": "A3, B2 dan C1", "D": "A1, B2 dan C3", "E": "A3, B2 dan C2"}, "answer": "B"}, {"no": 4, "stem": "Di bawah ini adalah beberapa unit analisis ekonomi:\n1. Biaya produksi pembuatan suatu barang\n2. Banyaknya pengangguran\n3. Pertumbuhan ekonomi yang tinggi\n4. Jumlah output yang dihasilkan untuk memaksimalkan laba\n5. Kebijakan moneter dan kebijakan fiskal untuk meningkatkan kesejahteraan rakyat\n6. Permintaan dan penawaran yang ada di pasar barang\nYang termasuk dalam unit analisis ekonomi mikro adalah ...", "options": {"A": "1, 2 dan 3", "B": "3, 4 dan 6", "C": "1, 3 dan 5", "D": "1, 4 dan 6", "E": "4, 5 dan 6"}, "answer": "D"}, {"no": 5, "stem": "Perhatikan bagan arus lingkaran kegiatan ekonomi (Rumah Tangga Produksi - Pasar Output - Rumah Tangga Konsumsi - Pasar Input, dengan arus bernomor 1-5). Berdasarkan bagan tersebut, arus uang yang merupakan hasil penjualan produksi (output) yang dihasilkan oleh RTP adalah ...", "options": {"A": "Nomor 5", "B": "Nomor 4", "C": "Nomor 3", "D": "Nomor 2", "E": "Nomor 1"}, "answer": "D"}, {"no": 6, "stem": "Diketahui tabel harga dan jumlah barang sebagai berikut:\nHarga barang (P) | Jumlah permintaan (Qd) | Jumlah penawaran (Qs)\nRp 800,00 | 200 unit | 1.400 unit\nRp 700,00 | 400 unit | 1.200 unit\nMaka fungsi permintaan dan fungsi penawarannya adalah ...", "options": {"A": "P = 900 - 1/2 Q dan P = 100 + 1/2 Q", "B": "P = 100 + 1/2 Q dan P = 900 - 1/2 Q", "C": "P = -900 - 1/2 Q dan P = -100 + 1/2 Q", "D": "P = 900 + 1/2 Q dan P = 100 - 1/2 Q", "E": "P = 900 - 1/2 Q dan P = -100 - 1/2 Q"}, "answer": "A"}, {"no": 7, "stem": "Diketahui fungsi permintaan P = 800 - 2Q dan fungsi penawaran P = -200 + 2Q, maka keseimbangan pasar dan besarnya elastisitas permintaan pada keseimbangan pasar adalah ...", "options": {"A": "(250,300) dan Ed = -0,6", "B": "(250,300) dan Ed = 0,6", "C": "(300,250) dan Ed = 0,6", "D": "(300,250) dan Ed = -0,6", "E": "(300,300) dan Ed = -0,6"}, "answer": "A"}, {"no": 8, "stem": "Perhatikan grafik keseimbangan pasar dengan kurva permintaan (D) dan penawaran (S) mula-mula, kemudian bergeser menjadi S1 dan D1, dengan titik harga P, P1, P2, P3 dan jumlah Q1, Q2, Q, Q3. Jika kurva permintaan dan penawaran mengalami perubahan, maka harga pasar dan jumlah barang pada keseimbangan yang baru adalah sebesar ...", "options": {"A": "OP1 dan OQ3", "B": "OP dan OQ", "C": "OP2 dan OQ1", "D": "OP3 dan OQ2", "E": "OP3 dan OQ3"}, "answer": "D"}, {"no": 9, "stem": "Perhatikan faktor yang mempengaruhi tentang permintaan dan penawaran uang di bawah ini:\n1. Adanya tingkat ekspektasi di masa yang akan datang\n2. Adanya motif kekuasaan dalam bidang ekonomi\n3. Tingkat suku bunga\n4. Tingkat pendapatan masyarakat\n5. Sistem pembayaran dan kebijakan moneter\n6. Adanya impor dan ekspor barang atau perdagangan internasional\nYang termasuk faktor yang mempengaruhi penawaran uang adalah ...", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 5", "C": "3, 4 dan 5", "D": "2, 4 dan 6", "E": "3, 4 dan 6"}, "answer": "C"}, {"no": 10, "stem": "Perhatikan ciri-ciri pasar persaingan tidak sempurna berikut ini:\n1) Perusahaan menggunakan iklan\n2) Tidak ada barang pengganti di pasar\n3) Produk yang diperdagangkan bermacam-macam\n4) Hanya ada satu penjual\n5) Barang yang dijual sejenis tetapi memiliki corak yang berbeda\nPernyataan yang merupakan ciri-ciri pasar persaingan monopolistik adalah ...", "options": {"A": "1 dan 2", "B": "1 dan 3", "C": "2 dan 4", "D": "2 dan 5", "E": "4 dan 5"} "Terselubung", "E": "Teknologi"}, "answer": "C"}, {"no": 19, "stem": "Perhatikan tabel berikut:\nNo | Jenis | Th 2020 Po(Rp) | Th 2020 W/Qo | Th 2021 Pn | Th 2021 W/Qn\n1 | Jeruk | 8.000 | 2 | 10.000 | 1\n2 | Jambu | 5.000 | 3 | 6.000 | 2\n3 | Srikaya | 2.000 | 1 | 4.000 | 4\nJumlah Po x Qo = 15.000, Jumlah Pn x Qo = 20.000\nBerdasarkan data di atas, maka indeks harga tertimbang menurut Laspeyres adalah ...", "options": {"A": "127,27 %", "B": "137,37 %", "C": "146,15 %", "D": "145,46 %", "E": "150,50 %"}, "answer": "D"}, {"no": 20, "stem": "Perhatikan matrik kebijakan pemerintah berikut ini:\nNo | A | B | C\n1 | Menaikkan diskonto | Menambah jumlah barang di pasar | Menaikkan cadangan minimum\n2 | Mengurangi pengeluaran negara | Menjual surat berharga | Menaikkan upah riil masyarakat\n3 | Kebijakan harga maksimum | Menaikkan atau mengefektifkan pajak | Penghematan pengeluaran rutin\nBerdasarkan matriks di atas, maka cara mengatasi inflasi dengan kebijakan non moneter dan non fiskal adalah ...", "options": {"A": "A1, B2 dan C1", "B": "A1, B2 dan C3", "C": "A2, B1 dan C2", "D": "A2, B3 dan C1", "E": "A3, B1 dan C2"}, "answer": "E"}, {"no": 21, "stem": "Di bawah ini adalah sumber penerimaan negara dan belanja negara:\n1. Pajak penghasilan dan pajak pertambahan nilai\n2. Pembayaran bunga dan cicilan utang\n3. Pajak perdagangan internasional\n4. Pembiayaan pembangunan\n5. Bagian laba Badan Usaha Milik Negara\n6. Dana Alokasi Umum dan Dana Alokasi Khusus\nYang termasuk belanja Negara dalam APBN adalah ...", "options": {"A": "1, 2 dan 3", "B": "2, 4 dan 6", "C": "1, 3 dan 5", "D": "3, 4 dan 6", "E": "4, 5 dan 6"}, "answer": "B"}, {"no": 22, "stem": "Seseorang memiliki obyek pajak sebagai berikut:\n1. Tanah seluas 500 m2 dengan nilai jual Rp 300.000,00 per m2\n2. Bangunan seluas 300 m2 dengan nilai jual Rp 400.000,00 per m2\n3. Pagar sepanjang 50 m, tinggi 1,5 m dengan nilai jual Rp 40.000,00 per m2\nJika nilai jual yang tidak kena pajak ditetapkan sebesar Rp 12.000.000,00, maka besarnya Pajak Bumi dan Bangunan (PBB) berdasarkan UU yang berlaku adalah ...", "options": {"A": "Rp 273.000,00", "B": "Rp 263.000,00", "C": "Rp 261.000,00", "D": "Rp 260.000,00", "E": "Rp 253.000,00"}, "answer": "C"}, {"no": 23, "stem": "Perhatikan tabel teori perdagangan internasional berikut ini:\nNegara | Produksi Batik Tulis/hari | Produksi Televisi/hari | Dasar Tukar Dalam Negeri\nIndonesia | 30 unit | 10 unit | 1 T : 3 B\nSingapura | 40 unit | 20 unit | 1 T : 2 B\nJika Indonesia menukarkan sebanyak 600 Batik Tulis dengan Televisi, maka analisis yang dapat diambil dari data tersebut:\n1. Konsep analisis keuntungan komparatif\n2. Konsep analisis keuntungan mutlak\n3. Indonesia berspesialisasi pada produksi Batik Tulis dan Singapura pada produksi Televisi\n4. Singapura berspesialisasi pada produksi Batik Tulis dan Televisi\n5. Besarnya keuntungan mutlak untuk Indonesia sebesar 100\n6. Besarnya keuntungan Komparatif untuk Indonesia sebesar 100\nBerdasarkan analisis tersebut, yang benar adalah ...", "options": {"A": "1, 3 dan 5", "B": "1, 3 dan 6", "C": "2, 4 dan 5", "D": "3, 4 dan 6", "E": "4, 5 dan 6"}, "answer": "B"}, {"no": 24, "stem": "Perhatikan bagian neraca pembayaran berikut ini:\n1. Pembelian saham orang luar negeri di Indonesia\n2. Ekspor dan impor barang-barang dagangan\n3. Transaksi jasa-jasa\n4. Penanaman modal orang Indonesia di Luar Negeri\n5. Investasi langsung penduduk luar negeri di Indonesia\n6. Adanya turis mancanegara yang berlibur di Indonesia\nYang dikategorikan dalam transaksi berjalan (Current Account) adalah ...", "options": {"A": "1, 2 dan 3", "B": "2, 3 dan 6", "C": "1, 3 dan 5", "D": "2, 4 dan 6", "E": "4, 5 dan 6"}, "answer": "B"}, {"no": 25, "stem": "Mak Ciek ingin pergi ke Bombay, India. Dia tukarkan rupiah miliknya senilai Rp 3.000.000,00 dengan Rupee. Pada saat itu kurs yang berlaku: Kurs beli 1 INR = Rp 227,00 dan Kurs jual 1 INR = Rp 240,00, kurs tengah 1 INR = Rp 233,50. Setelah 5 hari di Bombay ia pulang ke Indonesia, saat itu uangnya tinggal 500 Rupee.\nBerapa Rupee yang dihabiskan Mak Ciek ...", "options": {"A": "12.000 Rupee", "B": "12.500 Rupee", "C": "12.515 Rupee", "D": "12.715 Rupee", "E": "13.000 Rupee"}, "answer": "A"}, {"no": 26, "stem": "Perhatikan analisis transaksi:\n1. Diterima setoran modal dari Mbak Ara berupa uang tunai Rp 50.000.000,- dan peralatan salon Rp 20.000.000,-: Kas bertambah di Debet Rp 50.000.000,-, Peralatan bertambah di debet Rp 20.000.000,- dan Modal bertambah di kredit Rp 50.000.000,-\n2. Menerima pinjaman dari bank sebesar Rp25.000.000,- dipotong biaya administrasi Rp 1.000.000,-: kas (+) di Debet Rp24.000.000,-, utang bank (+) di kredit Rp 25.000.000,- dan beban adm (+) di Debet Rp 1.000.000,-\n3. Membeli perlengkapan salon Rp3.000.000,- dibayar tunai Rp 2.000.000,- sisanya kredit: harta perlengkapan (+) di Debit Rp3.000.000,- kas (-) di kredit Rp 2.000.000,- dan utang (+) di kredit sebesar Rp1.000.000,-\n4. Diselesaikan pekerjaan merias pengantin sebesar Rp7.000.000,- diterima tunai Rp 5.000.000,- kekurangannya minggu depan: kas (+) di Debet Rp5.000.000,- dan piutang (+) di Debit Rp2.000.000,- dan pendapatan (+) di kredit Rp 7.000.000,-\n5. Dibayar gaji pekerja 3 orang masing-masing Rp 1.000.000,-: beban gaji (-) di Debet Rp3.000.000,- dan Kas (-) di Kredit Rp3.000.000,-\nAnalisis transaksi di atas yang benar adalah ....", "options": {"A": "1, 2, dan 3", "B": "1, 3, dan 4", "C": "2, 3 dan 4", "D": "2,4 dan 5", "E": "3, 4 dan 5"}, "answer": "C"}, {"no": 27, "stem": "Perhatikan bukti kuitansi: Kuitansi No: 021, Sudah terima dari: Dyah Ayu Tenan, Uang sejumlah: Lima ratus ribu rupiah, Untuk keperluan: Biaya servis mesin cuci, Jakarta 27 September 2021, Rp500.000,- (CV Leoni).\nTransaksi di atas dijurnal ....", "options": {"A": "Biaya Servis / Kas masing-masing Rp 500.000,-", "B": "Utang Usaha / Kas masing-masing Rp 500.000,-", "C": "Kas / CV Leony masing-masing Rp 500.000,-", "D": "Pendapatan jasa / Modal masing-masing Rp 500.000,-", "E": "Kas / Pendapatan Servis masing-masing Rp 500.000,-"}, "answer": "A"}, {"no": 28, "stem": "Di bawah ini Jurnal Umum dari 3 transaksi (7 Sept: Perlengkapan Rp900.000 di debet, Kas Rp500.000 & Utang Usaha Rp400.000 di kredit; 14 Sept: Kas Rp300.000 & Piutang Usaha Rp600.000 di debet, Pendapatan Usaha Rp900.000 di kredit; 21 Sept: Utang Usaha Rp1.000.000 & Peralatan Rp2.000.000 di debet, Kas Rp3.000.000 di kredit) dan 5 buah akun Buku Besar dengan saldo awal September: Kas Rp3.700.000, Piutang Usaha Rp800.000, Perlengkapan Rp900.000, Peralatan Rp1.000.000, Utang usaha Rp1.500.000, Pendapatan usaha Rp2.100.000.\nDari akun buku besar di atas pencatatan yang benar adalah ....", "options": {"A": "1, 2 dan 3", "B": "1, 2 dan 5", "C": "2, 3 dan 5", "D": "3, 5 dan 6", "E": "4, 5 dan 6"}, "answer": "A"}, {"no": 29, "stem": "Sebagian data neraca saldo Jasa angkutan 'KILAT' per 31 Desember 2021: Peralatan Rp2.000.000,-, Persekot sewa Rp2.400.000,-, Beban asuransi Rp9.000.000,-, Utang bank Rp20.000.000,-.\nData penyesuaian: 1) Peralatan disusut 10% per tahun; 2) Sewa dibayar 1 April 2021 untuk 1 tahun; 3) Tanggal 1 September 2021 dibayar asuransi 2 tahun; 4) Bunga bank 18% per tahun dibayar dibelakang setiap 1/3 dan 1/9; 5) Bunga deposito belum diterima Rp700.000.\nJurnal penyesuaian yang dibuat: 1) Beban Penyusutan Peralatan Rp200.000 / Peralatan Rp200.000; 2) Beban Sewa Rp1.800.000 / Persekot sewa Rp1.800.000; 3) Asuransi dibayar dimuka Rp7.500.000 / Beban Asuransi Rp7.500.000; 4) Beban bunga Rp1.200.000 / Utang bunga Rp1.200.000; 5) Utang bunga Rp700.000 / Pendapatan bunga Rp700.000.\nDari data di atas, jurnal penyesuaian yang benar adalah ....", "options": {"A": "1),2), dan 3)", "B": "2),3), dan 4)", "C": "3),4), dan 5)", "D": "1),4), dan 5)", "E": "2),4), dan 5)"}, "answer": "D"}, {"no": 30, "stem": "Neraca Saldo (sebagian) 'Salon Ara' per 31 Desember 2021: Perlengkapan (D) Rp3.000.000, Iklan dibayar dimuka (D) Rp15.000.000, Pendapatan Sewa (K) Rp9.000.000.\nCatatan penyesuaian akhir asan dari Toko Alibaba.\nDari transaksi di atas, jurnal yang dibuat Toko Wicaksono tanggal 24 Juni adalah ....", "options": {"A": "Utang Dagang Rp16.000.000 / Potongan Pembelian Rp480.000 & Kas Rp15.520.000", "B": "Utang Dagang Rp16.000.000 / Kas Rp16.000.000", "C": "Utang Dagang Rp21.000.000 / Potongan Pembelian Rp630.000 & Kas Rp20.370.000", "D": "Kas Rp15.520.000 & Potongan Penjualan Rp480.000 / Piutang Dagang Rp16.000.000", "E": "Kas Rp20.370.000 & Potongan Penjualan Rp630.000 / Piutang Dagang Rp21.000.000"}, "answer": "D"}, {"no": 37, "stem": "Perhatikan jurnal khusus Jurnal Penerimaan Kas: 5/3 Toko Baru Kas 5.000.000/Penjualan 5.000.000; 12/3 BRI cab. Wonosari Kas 10.000.000/Utang Bank 10.000.000; 19/3 Toko Ibu Kas 11.640.000, Potongan Penjualan 360.000/Piutang Dagang 12.000.000; 23/3 Toko ABC Kas 3.000.000/Peralatan Toko 3.000.000; 30/3 Toko Mirah Kas 8.730.000, Potongan Penjualan 270.000/Piutang Dagang 9.000.000. Jumlah: Kas 38.370.000, Potongan Penjualan 630.000, Piutang Dagang 21.000.000, Penjualan 5.000.000, Serba-serbi 13.000.000.\nBerdasarkan jurnal khusus di atas posting ke buku besar (Kas, Penjualan, Potongan Penjualan, Piutang Dagang, Utang Bank) - posting yang benar adalah ....", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 4", "C": "1, 3 dan 5", "D": "2, 4 dan 5", "E": "3, 4 dan 5"}, "answer": "C"}, {"no": 38, "stem": "Berikut ini disajikan sebagian transaksi PD. ILALANG dalam bulan Sept 2021: Tgl 5 Dibeli barang dagang dari Toko Manto sejumlah Rp70.000.000,- dengan syarat 3/10, n/30. Tgl 6 Dikirim nota debit pada Toko Manto seharga Rp5.000.000,-. Tgl 15 Dilunasi utang kepada Toko Manto.\nTransaksi tanggal 15 Sept 2021 oleh PD ILALANG dicatat dalam buku pembantu ....", "options": {"A": "Utang atas nama Toko Manto di Debet sebesar Rp65.000.000,-", "B": "Utang atas nama Toko Manto di Debet sebesar Rp63.050.000,-", "C": "Utang atas nama Toko Manto di Kredit sebesar Rp65.000.000,-", "D": "Piutang atas nama Toko Manto di Kredit sebesar Rp65.000.000,-", "E": "Piutang atas nama Toko Manto di Kredit sebesar Rp63.050.000,-"}, "answer": "A"}, {"no": 39, "stem": "Berikut adalah sebagian Neraca sisa milik UD LINDA pada 31 Desember 2021 (dalam ribuan Rupiah): Persediaan barang dagang (D) 10.000; Pembelian (D) 90.000; Beban angkut pembelian (D) 3.000; Potongan pembelian (K) 1.800; Retur pembelian (K) 5.000; HPP -.\nData Penyesuaian: Persediaan barang dagang hasil perhitungan phisik sebesar Rp7.000.000.\nPenyelesaian kertas kerja sebagian UD LINDA jika penyesuaian persediaan barang memakai metode HPP - yang benar adalah....", "options": {"A": "1, 2, 3 dan 4", "B": "1, 2, 4 dan 5", "C": "1, 3, 5 dan 6", "D": "2, 3, 4 dan 6", "E": "3, 4, 5 dan 6"}, "answer": "C"}, {"no": 40, "stem": "Perhatikan data keuangan berikut ini:\nNo | Keterangan | Toko Bangun | UD Agus | PD Niak\n1 | Penjualan bersih | 170.000.000 | 90.000.000 | 70.000.000\n2 | HPP | 90.000.000 | 75.000.000 | 25.000.000\n3 | Beban penjualan | 20.000.000 | 8.500.000 | 12.500.000\n4 | Beban Adm. Umum | 12.500.000 | 7.500.000 | 4.500.000\n5 | Laba Luar Usaha | 10.000.000 | 1.000.000 | 2.000.000\n6 | Modal Awal | 100.000.000 | 50.000.000 | 60.000.000\nBerdasarkan data di atas maka pernyataan yang benar adalah....", "options": {"A": "Dari tiga perusahaan laba kotor yang paling besar Toko Bangun Rp80.000.000 paling kecil PD Niak Rp45.000.000", "B": "Laba sebelum pos luar usaha Toko Bangun Rp47.500.000, UD Agus Rp1.000.000 dan PD Niak Rp28.000.000", "C": "Laba sebelum pajak Toko Bangun Rp57.500.000, UD Agus Rp1.000.000 dan PD Niak Rp30.000.000", "D": "Perusahaan yang mengalami BEP (Break Even Point) tidak untung tidak rugi adalah UD Agus", "E": "Perusahaan yang paling efisien dengan prosentase laba terbaik adalah PD Niak (laba bersih dibanding modal)"}, "answer": "D"}]}, "bindo": {"nama": "Tryout TKA Bahasa Indonesia", "mapel": "Bahasa Indonesia", "durasi": 60, "soal": [{"no": 1, "stem": "Bacalah puisi berikut!\nKANGEN - W.S. Rendra\nKau tak akan mengerti bagaimana kesepianku menghadapi kemerdekaan tanpa cinta\nKau tak akan mengerti segala lukaku karna cinta telah sembunyikan pisaunya.\nMembayangkan wajahmu adalah siksa.\nKesepian adalah ketakutan dalam kelumpuhan.\nEngkau telah menjadi racun bagi darahku.\nApabila aku dalam kangen dan sepi\nItulah berarti\naku tungku tanpa api.\n...\nMakna frasa 'tungku tanpa api' pada puisi di atas adalah…", "options": {"A": "mendambakan sesuatu", "B": "berhati kosong", "C": "tak berarti", "D": "kesepian", "E": "tersiksa"}, "answer": "D"}, {"no": 2, "stem": "Bacalah teks berikut dengan saksama!\nRoni … mengikuti bayangan hitam yang baru saja berkelebat. Hatinya …. Lalu, ia … menghunus belati yang diselipkan di pinggangnya. Bayangan itu berjalan semakin cepat. Roni tidak ingin ketinggalan. Ia … meningkatkan kecepatan berjalannya juga. Tetapi … bayangan itu lenyap dari pandangannya. Roni terkesiap.\nKata ulang yang tepat untuk mengisi bagian rumpang teks di atas adalah….", "options": {"A": "mengendap-endap, berdebar-debar, pelan-pelan, buru-buru, tiba-tiba", "B": "diam-diam, dag dig dug, mengendap-endap, tiba-tiba, buru-buru", "C": "cepat-cepat, berdebar-debar, tiba-tiba, lama-lama, pelan-pelan", "D": "cepat-cepat, berdebar-debar, buru-buru, tiba-tiba, pelan-pelan", "E": "berdebar-debar, kebat-kebit, serta-merta, tiba-tiba, pelan-pelan"}, "answer": "A"}, {"no": 3, "stem": "Bacalah teks berikut dengan saksama!\n1. Alasannya, hal tersebut bisa berimplikasi besar terhadap tugas-tugasnya.\n2. Pria kelahiran Situbondo, 22 Mei 1948 ini pernah menjadi hakim agung selama 18 tahun lebih.\n3. Atau rata-rata setiap tahunnya dia menangani 1.095 perkara.\n4. Sebelum menjadi Hakim Agung pada 2000, Artidjo berkarier sebagai advokat selama 28 tahun.\n5. Selama menjabat, Artidjo tak pernah mengambil cuti dan selalu menolak ketika diajak ke luar negeri.\n6. Saat menjabat sebagai hakim agung, 19.708 berkas perkara pernah ia tangani.\nAgar menjadi teks naratif objektif yang baik, urutan kalimat pada teks di atas adalah….", "options": {"A": "(2), (4), (3), (5), (6), (1)", "B": "(2), (4), (6), (3), (5), (1)", "C": "(3), (5), (1), (2), (4), (6)", "D": "(4), (5), (3), (6), (2), (1)", "E": "(4), (5), (3), (2), (1), (6)"}, "answer": "B"}, {"no": 4, "stem": "Bacalah teks berikut dengan saksama!\nHampir seluruh keluarga Sestrokusuman telah siap.\nPak Bei telah berdandan pakaian Jawa sempurna. Hanya mengangkat alis sedikit - kalau Ni tidak salah lirik. Tetap gagah dengan hidung mancung, kulit bersih, dan yang membuat Ni kagum ialah bahwa ayahnya ini selalu tampak hadir. Ruangan bisa menjadi kosong tanpa kehadiran Pak Bei. Sekarang ini pun terasakan, bahwa getaran paling kuat, walau hanya dengan mengangkat alis, itu pun tipis, dari tempatnya berdiri.\n(Canting, Arswendo Armowiloto)\nUlasan yang tepat untuk teks di atas adalah…", "options": {"A": "Novel ini mengangkat budaya Jawa dengan cara yang sangat mengagumkan.", "B": "Dengan membaca novel ini pembaca tidak hanya mengenal budaya Jawa, tetapi bisa seolah mengalami sendiri nuansa kejawaan yang kental.", "C": "Novel ini terlalu berlebihan dalam menggambarkan watak Pak Bei karena sangat sulit mencari orang sesempurna Pak Bei.", "D": "Penampilan keluarga Pak Bei menunjukkan betapa tingginya budaya leluhur kita.", "E": "Kekaguman tokoh Ni pada ayahnya terlalu berlebihan sehingga membuat novel ini terkesan picisan."}, "answer": "B"}, {"no": 5, "stem": "Bacalah puisi berikut!\nAKU BERKACA - Chairil Anwar\nIni muka penuh luka\nSiapa punya?\nKu dengar seru menderu\nDalam hatiku\nApa hanya angin lalu?\nLagi lain pula\nMenggelepar tengah malam buta\nAh..!!!\n….\nSegala tak ku kenal..!!!\nSelamat tinggal…!!\nLarik yang tepat untuk mengisi bagian rumpang puisi di atas adalah...", "options": {"A": "Aku tak mengenal, aku bebal", "B": "Bahagiaku mental, aku terjungkal", "C": "Segala menebal, segala mengental", "D": "Darah mengental, tangan mengepal", "E": "Tangan mengepal, memaksa untuk tinggal"}, "answer": "D"}, {"no": 6, "stem": "Bacalah teks berikut dengan saksama!\nJalan-jalan di pinggir kali\nBertemu ikan di dalam bubu\nJika ibu menasihati\n…\nLarik yang tepat untuk melengkapi pantun di atas adalah…", "options": {"A": "Janganlah membuat emosimu menderu", "B": "Jalanilah dengan kesungguhan hati", "C": "Masukkanlah ke dalam kalbu", "D": "Turutilah sepenuh hati", "E": "Tutuplah telingamu"}, "answer": "C"}, {"no": 7, "stem": "Bacalah teks berikut dengan saksama!\nPermasalahan: Sekarang dunia baru menggembar-gemborkan pengurangan sampah plastik. Di supermarket-supermarket kantong plastik berbayar agar pembeli menyediakan kantong belanja sendiri. Di berbagai sudut kampung terpampang berbagai macam cara untuk kampanye pengurangan sampah plastik.\nPendapat 1: Sebenarnya penggunaan bahan plastik tidak perlu dilarang. Penggunaan plastik sebenarnya salah satu wujud cinta lingkungan. Bayangkan kalau kantong plastik dihilangkan. Pasti akan banyak penggunaan kantong-kantong kertas dan kain. Ingat, kedua bahan tersebut dibuat dari tumbuhan. Penghapusan bahan plastik akan meningkatkan penebangan pohon yang berarti perusakan lingkungan hidup.\nPendapat 2: Walau bagaimana pun pelarangan penggunaan plastik tetap harus digalakkan. Kita harus melindungi bumi dari plastik. Jika plastik terlalu banyak, bumi akan tercemar. Plastik adalah zat yang tidak dapat membusuk dalam waktu puluhan tahun. Hal itu sangat membahayakan bumi.\nRumusan pendapat yang paling tepat dari pendapat-pendapat di atas adalah…", "options": {"A": "Demi menjaga bumi kita, seyogianya kita mengurangi semua jenis sampah baik itu sampah plastik maupun nonplastik.", "B": "Pengurangan sampah nonplastik lebih penting daripada sampah plastik karena membahayakan bumi.", "C": "Demi menjaga lingkungan hidup, penggunaan kantong plastik tidak perlu dilarang.", "D": "Demi menjaga lingkungan hidup, penggunaan kantong plastik harus dilarang keras.", "E": "Pengurangan sampah plastik lebih penting daripada sampah nonplastik."}, "answer": "A"}, {"no": 8, "stem": "Bacalah teks berikut dengan saksama!\nSelain pertambahan usia, faktor lingkungan berpengaruh pada perubahan kulit, terutama dampaknya kepada proses alami penuaan kulit. Ahli kulit sehat juga mengatakan bahwa sinar matahari menjadi penyebab utama dari kerusakan kulit karena adanya kandungan sinar ultraviolet dan radikal bebas. Paparan sinar ultraviolet (UV) yang berlebihan dari matahari pada dasarnya bersifat merusak sebagaimana efeknya dapat merusak kolagen dan elastin. Elastin adalah protein di dalam jaringan kulit yang membuatnya terasa lembut dan tampak kenyal.\nInti informasi yang terdapat pada teks di atas adalah…", "options": {"A": "Elastin adalah protein di dalam jaringan kulit.", "B": "Matahari menjadi penyebab utama kerusakan kulit.", "C": "Berbagai faktor yang memengaruhi perubahan kulit.", "D": "Faktor lingkungan berpengaruh pada perubahan kulit.", "E": "Penambahan usia berpengaruh pada perubahan kulit."}, "answer": "C"}, {"no": 9, "stem": "Bacalah teks berikut dengan saksama!\nTeks 1: Sinar UV berdampak kepada proses pigmentasi kulit. Dalam hal ini, efek negatif sinar UV dapat memicu kemunculan keriput, bintik-bintik cokelat, bahkan risiko kanker kulit. Belum lagi, tingginya radikal bebas turut berperan kepada pertumbuhan kanker kulit. Di sisi lain, merokok dan polusi udara dapat mengurangi kolagen dan mengakibatkan proses penuaan kulit prematur.\nTeks 2: Kulit juga berfungsi sebagai pertahanan pertama tubuh untuk melawan kuman dan kondisi lingkungan. Kulit juga dapat mengubah sinar matahari menjadi vitamin D. Lapisan lemak yang berada di bawah permukaan kulit membantu memastikan bahwa cairan penting di dalam tubuh tetap berada di dalam tubuh.\nPerbedaan isi kedua teks di atas adalah…", "options": {"A": "Teks 1 membahas efek sinar UV terhadap kulit; teks 2 membahas manfaat sinar UV bagi kulit.", "B": "Teks 1 membahas faktor-faktor yang merusak kulit; teks 2 membahas fungsi kulit.", "C": "Teks 1 membahas efek sinar UV terhadap kulit; teks 2 membahas fungsi kulit.", "D": "Teks 1 membahas keriput di kulit; teks 2 membahas lapisan lemak kulit.", "E": "Teks 1 membahas penyakit kulit; teks 2 membahas fungsi kulit."}, "answer": "C"}, {"no": 10, "stem": "Bacalah teks berikut dengan saksama!\nJADWAL KRL RELASI JOGJA-SOLO\nNo | Nomor Kereta | Relasi | Pergi | Tiba\n1 | 646 | Tugu-Balapan | 05.15 | 06.23\n2 | 648 | Tugu-Balapan | 06.28 | 07.48\n3 | 7102 | Tugu-Balapan | 06.59 | 08.10\n4 | 7104 | Tugu-Balapan | 08.13 | 09.31\n5 | 652 | Tugu-Balapan | 10.01 | 11.11\n6 | 7106 | Tugu-Balapan | 11.55 | 13.03\n7 | 7108 | Tugu-Balapan | 14.49 | 15.57\nPernyataan yang sesuai dengan informasi pada tabel di atas adalah…", "options": {"A": "Kereta bernomor 646 pergi setelah kereta bernomor 7104.", "B": "Kereta bernomor 7102 tiba lebih pagi daripada kereta bernomor 648.", "C": "Kereta yang berangkat terakhir adalah kereta yang bernomor 7108.", "D": "Kereta yang tiba menjelang tengah hari adalah kereta bernomor 7104.", "E": "Kereta bernomor 7108 tiba lebih awal dibandingkan kereta bernomor 7106."}, "answer": "C"}, {"no": 11, "stem": "Bacalah teks berikut dengan saksama!\nPenyakit paru-paru mengacu pada gangguan yang … paru-paru, organ yang memungkinkan kita untuk bernapas. Penyakit paru-paru merupakan masalah utama bagi wanita. Jumlah wanita Amerika Serikat, yang … dengan penyakit paru-paru terus meningkat. Lebih banyak wanita juga … karena penyakit paru-paru.\nTanda-tanda awal penyakit paru-paru mudah… . Sering kali tanda awal penyakit paru-paru adalah tidak memiliki tingkat energi seperti biasa. Tanda dan gejalanya dapat berbeda … jenis penyakit paru-paru.\nKata berimbuhan yang tepat untuk mengisi bagian rumpang pada teks di atas adalah….", "options": {"A": "dipengaruhi, terdiagnosis, menderita, dideteksi, tergantung", "B": "dipengaruhi, didiagnosis, meninggal, diketahui, berdasarkan", "C": "memengaruhi, terdiagnosis, menderita, diketahui, tergantung", "D": "memengaruhi, terdiagnosis, meninggal, diabaikan, tergantung", "E": "memengaruhi, didiagnosis, meninggal, diabaikan, berdasarkan"}, "answer": "D"}, {"no": 12, "stem": "Bacalah teks berikut dengan saksama!\nSehubungan dengan itu pendidik harus menyediakan lingkungan bermain yang menarik, menyenangkan dan mendukung proses belajar anak. Anak akan mudah memahami materi ajar jika ia berada dalam lingkungan belajar yang menyenangkan karena hal itu mendukung, merangsang … dan inovasi anak. Kreativitas dan inovasi tercermin melalui kegiatan yang membuat tertarik, …, …, dan terkonsentrasi. Suasana yang menyenangkan mempermudah anak untuk … dan … dengan benda-benda yang ada di sekitarnya dan akhirnya menemukan pengetahuan dari benda-benda yang dimainkannya.\nKata serapan yang tepat untuk mengisi bagian rumpang teks di atas adalah….", "options": {"A": "kreatif, fokus, serius, bernegosiasi, bereksperimen", "B": "kreatif, fokus, serius, bersosialisasi, bereksperimen", "C": "kreativitas, fokus, serius, bereksplorasi, bereksperimen", "D": "kreativitas, terinsipirasi, elaborasi, berkreasi, bereksperimen", "E": "kreativitas, terinspirasi, elaborasi, bereksplorasi, bereksperimen"}, "answer": "E"}, {"no": 13, "stem": "Bacalah teks berikut dengan saksama!\nSebagai material nonorganik, sampah plastik sangat potensial mencemari lingkungan karena merupakan bahan yang sulit terdegradasi. Sehingga perlu adanya tindakan preventif yang dilakukan oleh masyarakat serta pemerintah, dalam mencegah penumpukan jumlah sampah yang semakin besar setiap tahunnya. Sebagaimana Peraturan Menteri Nomor 18 Tahun 2008 yang mengamanatkan upaya menumbuhkembangkan dan meningkatkan kesadaran masyarakat dalam pengelolaan sampah.\nIsi penggalan karya ilmiah di atas adalah….", "options": {"A": "Penumpukan jumlah sampah semakin besar setiap tahun.", "B": "Perlu upaya menumbuhkembangkan kesadaran masyarakat dalam pengelolaan sampah.", "C": "Perlu tindakan preventif yang dilakukan masyarakat.", "D": "Perlu adanya peraturan menteri yang baru terkait dengan pengelolaan sampah.", "E": "Sampah plastik sangat potensial mencemari lingkungan karena sulit terdegradasi."}, "answer": "E"}, {"no": 14, "stem": "Bacalah puisi berikut!\nIBU - Chairil Anwar\nPernah aku ditegur\nKatanya untuk kebaikan\nPernah aku dimarah\nKatanya membaiki kelemahan\nPernah aku diminta membantu\nKatanya supaya aku pandai\nIbu…..\nPernah aku merajuk\nKatanya aku manja\nPernah aku melawan\nKatanya aku degil\nPernah aku menangis\nKatanya aku lemah\n…\nAmanat yang terkandung pada puisi di atas adalah…", "options": {"A": "Jadilah anak yang penurut agar tidak dimarahi oleh ibu.", "B": "Jadilah ibu yang sabar dan tidak sering memarahi anak.", "C": "Jika ibu marah kita harus melawan agar ibu mengetahui kemauan kita.", "D": "Jangan marah jika ditegur ibu karena semua demi kebaikan kita.", "E": "Jadilah anak yang kuat agar tidak selalu dimarahi oleh orang tua."}, "answer": "D"}, {"no": 15, "stem": "Bacalah teks berikut dengan saksama!\nSAJAK PUTIH - Sapardi Djoko Damono\nBeribu saat dalam kenangan\nSurut perlahan\n…\nSewaktu detik pun jatuh\nKita dengar bumi yang tua dalam setia\nKasih tanpa suara\nSewaktu bayang-bayang kita memanjang\nMengabur batas ruang\nKita pun bisu tersekat dalam pesona\nSewaktu ia pun memanggil-manggil\nSewaktu Kata membuat kita begitu terpencil\nDi luar cuaca\nLarik bermajas personifikasi yang tepat untuk mengisi bagian rumpang pada puisi di atas adalah…", "options": {"A": "Sampai tiba saatnya", "B": "Pelan-pelan tanpa suara", "C": "Kia dengarkan suara membahana", "D": "Akhirnya terjadilah semuanya di depan mata", "E": "Kita dengarkan bumi menerima tanpa mengaduh"}, "answer": "E"}, {"no": 16, "stem": "Bacalah teks berikut dengan saksama!\nTersebutlah perkataan seorang raja yang bernama Indera Bungsu dari Negeri Kobat Syahrial. Setelah berapa lama di atas kerajaan, tiada juga beroleh putra. Maka pada suatu hari, ia pun menyuruh orang membaca doa kunut dan sedekah kepada fakir dan miskin. Hatta beberapa lamanya, Tuan Puteri Sitti Kendi pun hamillah dan bersalin dua orang putra laki-laki. Adapun yang tua keluarnya dengan panah dan yang muda dengan pedang. Maka baginda pun terlalu amat suka cita dan menamai anaknya yang tua Syah Peri dan anaknya yang muda Indera Bangsawan.\n(Hikayat Indera Bangsawan)\nPenggalan teks hikayat tersebut jika dinarasikan kembali dengan menggunakan bahasa Indonesia secara tepat akan menjadi …", "options": {"A": "Raja Negeri Kobat yang bernama Indera Bungsu sudah lama tidak berputra. Lalu ia menyuruh orang untuk membaca doa kunut dan bersedekah kepada fakir miskin. Tak lama kemudian Putri Sitti Kendi hamil dan melahirkan putra kembar. Yang tua lahir dengan pedang dan yang kedua dengan panah. Anak yang tua diberi nama Syah Peri dan yang muda Indera Bangsawan.", "B": "Raja Indera Bungsu dari Negeri Kobat sudah lama tidak berputra. Setelah dibacakan doa kunut dan bersedekah pada fakir miskin, istrinya yang bernama Sitti Kendi pun hamil dan melahirkan dua bayi laki-laki. Yang tua lahir disertai panah diberi nama Syah Peri, yang muda lahir disertai pedang diberi nama Indera Bangsawan.", "C": "Raja Indera Bungsu dari Kerajaan Kobat sudah lama tidak berputra. Setelah membaca doa kunut dan bersedekah pada fakir miskin, istrinya pun hamillah. Dia melahirkan anak kembar. Yang tua dinamakan Indera Bangsawan karena lahir dengan panah, yang kedua dinamakan Syah Peri karena lahir dengan pedang.", "D": "Raja Negeri Kobat, Indera Bungsu membacakan doa kunut dan bersedekah kepada fakir miskin karena lama tidak berputra. Tak lama kemudian, ia berputra kembar yang dinamakan Indera Bangsawan dan Syah Peri. Keduanya lahir dengan tombak dan pedang.", "E": "Raja Indera Bungsu dari Negeri Kobat lama tidak berputra. Kemudian ia membaca doa kunut dan bersedekah pada fakir miskin. Setelah itu istrinya pun hamillah dan melahirkan dua bayi laki-laki. Mereka diberi nama Syah Peri dan Indera Bangsawan karena lahir dengan panah dan tombak."}, "answer": "B"}, {"no": 17, "stem": "Bacalah teks berikut dengan saksama!\nMusim hujan telah tiba. Banyak daerah yang mengalami banjir. Bencana ini timbul karena banyak sampah yang mengganggu aliran sungai dan berkurangnya pohon yang bisa menahan air.\nBerdasarkan kalimat latar belakang masalah teks tersebut, rumusan masalah yang tepat dalam karya tulis ilmiah adalah…", "options": {"A": "Di daerah manakah banjir terjadi?", "B": "Mengapa terjadi banjir di berbagai daerah?", "C": "Mengapa banyak sampah yang dibuang ke sungai?", "D": "Bagaimana cara mengatasi banjir yang terjadi di berbagai daerah?", "E": "Siapakah yang harus bertanggung jawab terhadap bencana banjir ini?"}, "answer": "D"}, {"no": 18, "stem": "Bacalah teks berikut dengan saksama!\nAku berhenti sekolah. Jangankan sekolah, untuk makan saja susah. Ibu bekerja serabutan, apa saja yang bisa dikerjakan, dikerjakan. Sayang Ibu lebih banyak sakitnya. Semakin lama semakin parah. Yang pasti dan benar akhirnya aku dan Dede terpaksa bekerja menjadi pengamen. Membawa kencrengan dari tutup botol. Menyanyikan lagu-lagu dewasa. Berangkat pagi-pagi. Pulang malam-malam. Ditempa kehidupan jalanan.\nBagiku tak masalah. Demi Ibu, menyenangkan saja melakukan semuanya. Hanya sekali-dua aku pernah menelan ludah sedih saat melihat serombongan anak sekolah yang naik ke metromini.\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nKalimat resensi yang tepat untuk penggalan novel di atas adalah…", "options": {"A": "Penggambaran tokoh Aku yang tidak bisa sekolah karena kemiskinannya, sangat bagus untuk menginspirasi pembaca di kalangan remaja agar semangat sekolah.", "B": "Sisi kemiskinan yang diangkat penulis novel ini terlalu berlebihan.", "C": "Menghadirkan tokoh anak-anak mengamen bukan hal yang bijak karena bisa ditiru anak-anak.", "D": "Kehadiran tokoh Aku sebagai anak yang baik dan sayang pada orang tua terlalu dipaksakan.", "E": "Sebaiknya penulis tidak membuat cerita tentang berhenti sekolah karena akan membuat anak-anak yang malas sekolah mengikuti jejaknya."}, "answer": "A"}, {"no": 19, "stem": "Bacalah teks berikut dengan saksama!\nKegiatan persami yang dilakukan di SMA Pelita Harapan berjalan dengan baik dan lancar meskipun dengan anggaran dan kondisi yang terbatas. Siswa baru yang menjadi peserta persami bisa mendapatkan berbagai manfaat, terutama kedisiplinan, kerja sama, kekompakan, dan juga sifat berani.\nAcara persami ini diharapkan bisa menjadi ajang memupuk calon generasi penerus bangsa yang berkualitas, baik dalam segi akademik maupun nonakademik. Demikianlah laporan ini dibuat sebagai bentuk pertanggungjawaban panitia dan semoga bermanfaat bagi evaluasi penyelenggaraan kegiatan Persami berikutnya.\nInformasi penting yang dibahas pada penggalan laporan kegiatan di atas adalah…", "options": {"A": "Kegiatan persami yang dilaksanakan SMA Pelita Harapan berjalan lancar.", "B": "Persami menjadi ajang memupuk calon generasi penerus bangsa.", "C": "Kegiatan persami dilaksanakan dengan anggaran yang terbatas.", "D": "Siswa baru mendapatkan berbagai manfaat persami.", "E": "Persami bagi siswa baru dilaksanakan dalam kondisi terbatas."}, "answer": "A"}, {"no": 20, "stem": "Bacalah teks berikut dengan saksama!\nTeks 1: Dede menoleh padaku. Menyeringai. Terganggu. Aku menunjuk Bianglala yang terang benderang oleh cahaya lampu. Adikku tak terlalu tertarik. Masih sibuk memukuli berang-berang di depannya.\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nTeks 2: 'Kan zaman sudah edan, Mas. Pilihan kita hanya dua. Ikut edan atau jadi korban keedanan.' 'Memang sih, Pak, sekarang ini di mana tidak ada orang edan? Jajaran birokrasi pemerintah, gudangnya.'\n(Orang-Orang Proyek, Ahmad Tohari)\nUlasan kebahasaan yang tepat untuk kedua kutipan cerita tersebut adalah …", "options": {"A": "Teks 1 menggunakan bahasa Indonesia sehari-hari; teks 2 menggunakan bahasa yang terpengaruh bahasa Jawa.", "B": "Teks 1 membahas keceriaan anak di taman hiburan; teks 2 membahas keburukan orang di zaman edan.", "C": "Teks 1 menggunakan bahasa yang bertele-tele; teks 2 menggunakan bahasa yang padat dan singkat.", "D": "Teks 1 menggunakan banyak majas; teks 2 tidak menggunakan majas.", "E": "Teks 1 tidak menggunakan majas; teks 2 menggunakan banyak majas."}, "answer": "A"}, {"no": 21, "stem": "Bacalah teks berikut dengan saksama!\nKulit merupakan organ terbesar pada tubuh manusia dengan lapisan terluarnya yang dinamakan epidermis. Epidermis adalah bagian yang berperan penting dalam melindungi kulit dari faktor-faktor perusak di luar tubuh. Di balik epidermis terdapat lapisan dermis yang disebut juga sebagai lapisan tengah kulit.\nJenis frasa yang bercetak tebal ('organ terbesar', 'berperan penting', 'di luar tubuh') pada teks di atas adalah….", "options": {"A": "frasa nominal, frasa verbal, frasa adverbial", "B": "frasa verbal, frasa nominal, frasa adverbial", "C": "frasa adjektival, frasa verbal, frasa adverbial", "D": "frasa adjektival, frasa verbal, frasa adverbial", "E": "frasa nominal, frasa verbal, frasa preposisional"}, "answer": "E"}, {"no": 22, "stem": "Bacalah teks berikut dengan saksama!\nKondisi telinga yang sering basah atau terlalu lembap memungkinkan bakteri dan jamur berkembang biak di dalam telinga. Hal ini akan memicu iritasi dan infeksi pada telinga.\nBila Anda hobi berenang, sebaiknya gunakan penyumbat telinga untuk mencegah air masuk ke dalam telinga.\nKalimat berikut yang sepola dengan kalimat yang bercetak tebal ('Hal ini akan memicu iritasi dan infeksi pada telinga') pada teks di atas adalah…", "options": {"A": "Rina menulis puisi dan pantun di kamar.", "B": "Jika kamu tertarik, kamu boleh memilikinya.", "C": "Tommy akan menuruti semua permintaanmu.", "D": "Jika kamu memohon, pasti akan dituruti oleh ayahmu.", "E": "Walaupun hujan, Andre tetap datang ke pertemuan di kantor."}, "answer": "A"}, {"no": 23, "stem": "Bacalah teks berikut dengan saksama!\nHipertensi dan diabetes merupakan penyakit yang sering menyebabkan komplikasi berupa …. Jika Anda memiliki penyakit-penyakit tersebut, Anda dianjurkan untuk melakukan pemeriksaan rutin …, guna memantau perkembangan kedua penyakit ini dan mencegah penyakit ginjal.\nSelain itu, saat mengalami hipertensi dan diabetes, pembatasan jumlah konsumsi makanan yang mengandung gula dan garam ….\nFrasa yang tepat untuk mengisi bagian rumpang pada teks di atas adalah….", "options": {"A": "penyakit jantung, secara berkala, adalah wajib", "B": "penyakit jantung, cek darah, sangat disarankan", "C": "penyakit ginjal, ke dokter, sangat disarankan", "D": "penyakit ginjal, sebulan sekali, adalah perlu", "E": "penyakit ginjal, cek darah, sangat perlu"}, "answer": "C"}, {"no": 24, "stem": "Bacalah teks berikut dengan saksama!\n…, penerapan pola asuh dengan model sentra bisa diterapkan. Orang tua bisa mengambil sebagian atau sedikit pola yang diterapkan misalnya bagaimana mendidik anak untuk menyelesaikan tugas dengan sempurna. Membiasakan anak dari hal kecil untuk menyelesaikan tugas dengan sempurna, misalnya ketika sedang makan bersama.\nKlausa yang tepat untuk melengkapi kalimat rumpang pada teks di atas adalah…", "options": {"A": "Jika anak sedang dalam kondisi bahagia", "B": "Apabila bepergian bersama teman sekelas", "C": "Ketika berada di kelas bersama teman-temannya", "D": "Karena sangat penting untuk perkembangan dirinya", "E": "Meskipun tidak secara formal dalam ruang-ruang kelas"}, "answer": "E"}, {"no": 25, "stem": "Bacalah teks berikut dengan saksama!\nTrombosis vena dalam atau deep vein thrombosis (DVT) adalah kondisi ketika pembuluh darah vena tersumbat oleh bekuan darah. ….\nPenyakit ini dapat menimbulkan gejala berupa tungkai bengkak dan nyeri, serta kulit di tungkai yang bermasalah menjadi merah dan terasa hangat. Jika tidak diobati, DVT dapat menyebabkan komplikasi berupa emboli paru.\nKalimat intransitif yang tepat untuk melengkapi bagian rumpang pada teks di atas adalah…", "options": {"A": "Kita sering tidak menyadari keadaan ini.", "B": "Kondisi ini sering kali terjadi pada area tungkai.", "C": "Seringkali kita tidak memerhatikan keadaan ini.", "D": "Kondisi ini menimbulkan rasa sakit pada tungkai.", "E": "Jika ini terjadi, kita akan merasakan nyeri di daerah tungkai."}, "answer": "B"}, {"no": 26, "stem": "Bacalah teks berikut dengan saksama!\nSistem peredaran darah terdiri dari jantung dan pembuluh darah, meliputi pembuluh darah arteri, vena, dan kapiler. Jantung merupakan organ utama sistem peredaran darah, dengan fungsi memompa darah ke seluruh tubuh.\n…. Hal inilah yang tidak banyak diketahui oleh sebagian besar orang.\nKalimat transitif yang tepat untuk mengisi bagian rumpang teks di atas adalah…", "options": {"A": "Apabila peredaran darah terganggu, kita pasti akan sakit.", "B": "Kelancaran peredaran darah berpengaruh pada kesehatan kita.", "C": "Aliran darah sangat berpengaruh pada ketahanan tubuh seseorang.", "D": "Apabila peredaran darah terganggu, organ tubuh akan mengalami kerusakan.", "E": "Sudah saatnya orang belajar tentang peredaran darah karena sangat penting."}, "answer": "D"}, {"no": 27, "stem": "Bacalah teks berikut dengan saksama!\n(1) Sebuah video yang menampilkan gerombolan mitra ojek berseragam merah putih sedang berhenti di pinggir jalan beredar di media sosial. (2) Pada seragam dan helm yang mereka kenakan tertulis brand 'Bonceng'. (3) Saat ditelusuri, brand tersebut merupakan salah satu nama perusahaan jasa transportasi online, seperti Grab dan GoJek. (4) Marketing and Public Relation Bonceng, Sheha Rahmawati, mengungkapkan bahwa Bonceng masih tergolong startup baru, mulai didirikan sejak 2018.\nKalimat verbal dalam teks di atas adalah kalimat nomor....", "options": {"A": "(1), (2)", "B": "(1), (3)", "C": "(1), (4)", "D": "(2), (3)", "E": "(3), (4)"}, "answer": "B"}, {"no": 28, "stem": "Bacalah teks berikut dengan saksama!\nAndin berpikir keras untuk menundukkan Aldebran. Ia ingin Al akan bersikap mesra padanya sepulang kerja. Ia membeli bunga untuk dipajang di kamarnya. Dibelinya aster, gladiol, dan daun philodendron. Ditatanya bunga itu dengan hati-hati dan penuh cinta.\nRelasi makna yang terdapat pada paragraf di atas adalah….", "options": {"A": "sinonim", "B": "antonim", "C": "hiponim", "D": "homofon", "E": "homograf"}, "answer": "C"}, {"no": 29, "stem": "Bacalah teks berikut dengan saksama!\nMaka kata mufti, 'Baiklah! Hai tuan-tuan sekalian, ketahuilah, bahwasanya kepada hukum Allah yang harus akan raja itu, berakal, tiada harus raja itu bebal, kedua balig, tiada harus kanak-kanak, ketiga berbudi, tiada harus raja itu khilaf akalnya, keempat raja itu sehat, tiada harus raja penyakit aib seperti sopak dan kusta, kelima, raja itu adil, tiada harus raja itu lalim...'\nWatak Mufti pada teks di atas adalah....", "options": {"A": "bijaksana", "B": "emosional", "C": "cerdik", "D": "pemarah", "E": "sok tahu"}, "answer": "A"}, {"no": 30, "stem": "Bacalah teks berikut dengan saksama!\nTersebut pula perkataan Buraksa itu. Apabila dilihatnya ada air di dalam mulut bejana itu, maka ia pun minumlah serta dimasukannya kepalanya ke dalam mulut bejana tempat jerat tertahan itu. Maka kuda hijau si Kembar pun menarik tali jerat itu dan Buraksa pun terjeratlah. Si Kembar segera datang memarangnya hingga mati serta mengiris hidungnya yang tujuh dan matanya yang tujuh itu.\n(Hikayat Indera Bangsawan)\nKarakteristik hikayat yang terdapat pada teks di atas adalah….", "options": {"A": "istanasentris, kemustahilan, bahasa klise", "B": "istanasentris, terpengaruh agama Islam, bahasa klise", "C": "istanasentris, terpengaruh agama Islam, kemustahilan", "D": "kemustahilan, terpengaruh agama Islam, bahasa klise", "E": "kemustahilan, anonim, terpengaruh agama Islam"}, "answer": "A"}, {"no": 31, "stem": "Bacalah teks berikut dengan saksama!\nTernyata kesuksesan mengatasi persoalan Edo yang hanya mendesis dan Ongky yang cuma mengembik, tidak bisa digunakan untuk membereskan persoalan Almira. Almira tak hanya tampak sebagai hewan bertulang belakang langka. Kau bisa saja segera mencekik Almira dan mengancam bocah serigala itu agar tidak mengulangi perbuatan yang membahayakan siapa pun. Akan tetapi kau tidak ingin meniru Gesti yang pernah mengikat tubuh Almira di tiang bendera hanya karena dia menggigit tangan si penguasa sekolah yang lalim itu.\n(Srigala di Kelas Almira, Triyanto Triwikromo)\nNilai kehidupan yang terkandung pada penggalan cerpen di atas adalah….", "options": {"A": "nilai moral", "B": "nilai sosial", "C": "nilai religius", "D": "nilai budaya", "E": "nilai estetika"}, "answer": "A"}, {"no": 32, "stem": "Bacalah teks berikut dengan saksama!\nLalu tak ada cara lain, Ahmad pun mengeruk lumpur dari masjid berhari-hari, berminggu-minggu. Sendiri. Tak mungkin meminta pertolongan dari para nelayan yang merasa bisa shalat di perahu. Pada akhirnya, lumpur-lumpur itu bisa dihilangkan. Akan tetapi tetap saja rob tak bisa dihalau. Agar bisa shalat, ia membangun semacam panggung di mihrab ketika lantai sujud sudah dilahap oleh air laut yang rakus itu.\n(Sepasang Pengendus Kematian, Triyanto Triwikromo)\nWatak tokoh Ahmad dalam penggalan cerpen di atas disajikan melalui….", "options": {"A": "pikiran tokoh", "B": "perilaku tokoh", "C": "dialog antartokoh", "D": "uraian pengarang", "E": "lingkungan hidup tokoh"}, "answer": "B"}, {"no": 33, "stem": "Bacalah teks berikut dengan saksama!\n'Aku yakin kau akan setuju,' kata Herney, kini dengan suara yang semakin serius, 'Bahwa di dunia yang sempurna, dampak temuan ini akan bersifat ilmiah.' Dia terdiam, mencondongkan tubuhnya ke depan, wajahnya memenuhi layar.\n'Sayangnya kita tidak hidup di dunia yang sempurna, dan begitu aku mengumumkannya, kemenangan NASA ini akan menjadi sepak bola politik.'\n(Deception Point, Dan Brown)\nSudut pandang yang digunakan pada penggalan novel di atas adalah….", "options": {"A": "orang ketiga terbatas", "B": "orang ketiga serbatahu", "C": "orang kedua serbatahu", "D": "orang pertama sebagai pelaku utama", "E": "orang pertama sebagai pelaku sampingan"}, "answer": "B"}, {"no": 34, "stem": "Bacalah teks berikut dengan saksama!\n'Wajahmu menyenangkan, Tania. Dan itu membuat banyak orang nyaman untuk bertanya dan bersamamu....' Itu yang dia jelaskan saat kami pernah membahasnya dalam chatting singkat soal kenapa teman-teman sekelasku lebih banyak bertanya kepadaku dibandingkan dengan anak lain.\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nAmanat yang terkandung pada penggalan novel di atas adalah…", "options": {"A": "Memasang wajah menyenangkan akan membuat kita bisa makan gratis.", "B": "Memasang wajah menyenangkan akan menguntungkan diri sendiri.", "C": "Pasanglah wajah menyenangkan agar orang di sekitarmu merasa nyaman.", "D": "Sebaiknya kita memberi apresiasi pada orang-orang yang berwajah nyaman.", "E": "Jangan memasang wajah menyenangkan karena kita akan direpotkan oleh orang lain."}, "answer": "C"}, {"no": 35, "stem": "Bacalah teks berikut dengan saksama!\nKini Kabul tersenyum. Terasa betul Biyung tetap memandangnya sebagai anak yang masih kanak-kanak. Tapi Kabul justru menikmati kedekatan dan rasa aman seperti dia masih bocah.\nWaras-slamet atau sehat-selamat adalah pertanyaan yang selalu terlontar dari mulut Biyung bila berjumpa dengan anak-anaknya.\n(Orang-Orang Proyek, Ahmad Tohari)\nNilai budaya pada penggalan novel di atas diungkapkan dengan…", "options": {"A": "menggunakan nama, panggilan, dan istilah daerah tertentu.", "B": "menampilkan kebiasaan dan adat daerah tertentu", "C": "menganalisis perasaan tokoh Kabul pada biyung", "D": "pertanyaan tentang kesehatan dan keselamatan", "E": "menggunakan pertanyaan yang gamblang"}, "answer": "A"}, {"no": 36, "stem": "Bacalah teks berikut dengan saksama!\nTim Pro: Kami setuju dengan rencana pemerintah untuk menghentikan program beasiswa bagi siswa yang kurang mampu. Sudah saatnya pemerintah berhenti memberikan beasiswa kepada anak kurang mampu. Program ini hanya pemborosan uang negara. Sudah saatnya pemerintah memberikan beasiswa pada siswa yang pandai saja, baik itu dari golongan mampu maupun tidak mampu.\nKalimat sanggahan yang tepat untuk menyanggah pendapat di atas adalah…", "opti
