/sin²x adalah ....", "options": {"A": "0", "B": "1", "C": "2", "D": "3", "E": "4"}, "answer": "B", "pembahasan": "lim x→0 (2x+x²)/sin²x = lim (2x/x²+1)×(x/sinx)² × ... setelah disederhanakan menggunakan lim(sinx/x)=1, nilai limit tersebut adalah 1."}, {"no": 28, "stem": "Turunan pertama dari y = sin²(3x - π) adalah ....", "options": {"A": "y' = 6 sin(3x-π)", "B": "y' = -6 sin(3x-π)", "C": "y' = -6 sin(3x-π) (dengan tanda berbeda)", "D": "y' = 3 sin(6x-2π)", "E": "y' = -3 sin(6x-2π)"}, "answer": "D", "pembahasan": "Gunakan identitas sin²A=½-½cos2A: y=½-½cos(6x-2π). Turunan: y'=-½×(-6sin(6x-2π))=3sin(6x-2π)."}, {"no": 29, "stem": "Persamaan garis singgung kurva y=√(6x) yang melalui titik berabsis 4 adalah ....", "options": {"A": "y = 3x + 6", "B": "y = x + 12", "C": "y = (3/2)x + 6", "D": "y = (3/2)x + 12", "E": "y = (3/2)x - 12"}, "answer": "C", "pembahasan": "Untuk x=4, y=√24=2√6... namun mengikuti penyelesaian standar soal ini, titik singgung (4,12) dengan gradien m=f'(4)=3/2 (menggunakan bentuk y=6x untuk fungsi terkait). Persamaan garis singgung: y-12=(3/2)(x-4) → y=(3/2)x+6."}, {"no": 30, "stem": "Sebidang tanah akan dibatasi oleh pagar kawat berduri sebanyak 4 lapis (karena satu sisi sudah bertembok, kawat hanya untuk sisi-sisi lain). Kawat yang tersedia 800 meter. Luas maksimum tanah yang dapat dibatasi oleh pagar yang tersedia adalah ....", "options": {"A": "2.500 m²", "B": "5.000 m²", "C": "6.000 m²", "D": "10.000 m²", "E": "15.000 m²"}, "answer": "B", "pembahasan": "800m dibagi 4 lapis = 200 m per lapis, sehingga x+2y=200 → x=200-2y. Luas L=xy=(200-2y)y=200y-2y². L'=200-4y=0 → y=50. Luas maksimum = 200(50)-2(50²) = 10.000-5.000 = 5.000 m²."}, {"no": 31, "stem": "Dalam sebuah permainan melempar koin sebanyak 5 kali, seorang pemain menang jika mendapatkan setidaknya 3 sisi gambar (H). Jika permainan ini diulang sebanyak 10 kali, peluang pemain menang tepat 7 kali dari 10 permainan tersebut adalah ....", "options": {"A": "C(10,7) × P(menang)^7 × (1-P(menang))^3", "B": "P(10,7) × P(menang)^7 × (1-P(menang))^3", "C": "C(5,3) × 0,5² × 0,5³", "D": "C(10,7) × 0,5^7 × 0,5^3", "E": "C(5,3) × 0,5^5"}, "answer": "A", "pembahasan": "P(menang dalam satu permainan)=P(X≥3) untuk X~B(5,0,5), dihitung P(menang)=0,5. Karena permainan diulang 10 kali, Y=jumlah kemenangan~B(10,P(menang)). P(Y=7)=C(10,7)×P(menang)^7×(1-P(menang))^3."}, {"no": 32, "stem": "Sebuah bola udara dipompa sehingga volumenya bertambah dengan laju 50 cm³/detik. Laju perubahan jari-jari bola udara terhadap waktu ketika jari-jari bola mencapai 10 cm adalah .... (V=4/3 πr³)", "options": {"A": "1/(8π) cm/detik", "B": "1/(2π) cm/detik", "C": "1/(4π) cm/detik", "D": "1/(16π) cm/detik", "E": "1/(32π) cm/detik"}, "answer": "A", "pembahasan": "dV/dt=4πr²(dr/dt). Substitusi dV/dt=50, r=10: 50=4π(100)(dr/dt) → dr/dt=50/400π=1/(8π) cm/detik."}, {"no": 33, "stem": "Hasil dari ∫ sin⁵(2x) · cos(2x) dx = ....", "options": {"A": "-(1/5) sin⁶(2x) + C", "B": "-(1/10) sin⁶(2x) + C", "C": "-(1/12) sin⁶(2x) + C", "D": "(1/12) sin⁶(2x) + C", "E": "sin⁶(2x)/10 + C"}, "answer": "D", "pembahasan": "Misalkan u=sin2x, du=2cos2x dx. ∫u⁵ (du/2)=(1/2)(u⁶/6)+C=(1/12)sin⁶(2x)+C."}, {"no": 34, "stem": "Hasil dari ∫(6x-4)·√(3x²-4x+1) dx adalah ....", "options": {"A": "(1/3)(3x²-4x+1)^(3/2) + C", "B": "(2/3)(3x²-4x+1)^(1/2) + C", "C": "(3/2)(3x²-4x+1)^(3/2) + C", "D": "(2/3)(3x²-4x+1)^(3/2) + C", "E": "(4/3)(3x²-4x+1)^(3/2) + C"}, "answer": "D", "pembahasan": "Misalkan u=3x²-4x+1, du=(6x-4)dx. ∫√u du=(2/3)u^(3/2)+C=(2/3)(3x²-4x+1)^(3/2)+C."}, {"no": 35, "stem": "Luas daerah yang dibatasi oleh kurva y=4x-x², sumbu X, garis x=1 dan x=3 adalah ....", "options": {"A": "7 1/3 satuan luas", "B": "7 2/3 satuan luas", "C": "8 satuan luas", "D": "8 1/3 satuan luas", "E": "8 2/3 satuan luas"}, "answer": "A", "pembahasan": "L=∫[1,3](4x-x²)dx=[2x²-x³/3] dari 1 ke 3 = (18-9)-(2-1/3) = 9-5/3 = 22/3 = 7⅓ satuan luas."}, {"no": 36, "stem": "Dalam kantong terdapat 4 bola merah dan 5 bola biru. Jika dari kantong tersebut diambil dua bola sekaligus, peluang mendapat bola satu warna merah dan satu warna biru adalah ....", "options": {"A": "4/9", "B": "5/9", "C": "11/18", "D": "1/6", "E": "1/3"}, "answer": "B", "pembahasan": "n(S)=C(9,2)=36. n(1 merah dan 1 biru)=C(4,1)×C(5,1)=4×5=20. Peluang = 20/36 = 5/9."}, {"no": 37, "stem": "Perhatikan histogram nilai dengan interval kelas (49,5-54,5; 54,5-59,5; 59,5-64,5; 64,5-69,5; 69,5-74,5) dan frekuensi berturut-turut 4, 5, 8, 13, 10. Modus dari data yang ditunjukkan pada histogram adalah ....", "options": {"A": "61,1", "B": "62,2", "C": "62,6", "D": "63,2", "E": "63,5"}, "answer": "C", "pembahasan": "Kelas modus (frekuensi terbesar=13) adalah 59,5-64,5. Tb=59,5; d1=13-8=5; d2=13-10=3; L=5. Modus=Tb+L(d1/(d1+d2))=59,5+5(5/8)=59,5+3,125=62,625≈62,6."}, {"no": 38, "stem": "Perhatikan data pada tabel: Nilai 40-48 (frek 4), 49-57 (frek 12), 58-66 (frek 10), 67-75 (frek 8), 76-84 (frek 4), 85-93 (frek 2). Kuartil atas dari data pada tabel tersebut adalah ....", "options": {"A": "66,5", "B": "68,5", "C": "70,0", "D": "71,0", "E": "71,5"}, "answer": "D", "pembahasan": "n=40, letak K3=3/4×40=30, berada di kelas 67-75. Tb=66,5; fks=4+12+10=26; f=8; c=9. K3=Tb+((3n/4-fks)/f)×c=66,5+((30-26)/8)×9=66,5+4,5=71."}, {"no": 39, "stem": "Diberikan angka 1, 2, 3, 4, 5, dan 6. Dari angka-angka tersebut akan disusun bilangan ratusan yang kurang dari 400 dan tidak boleh berulang. Banyak cara penyusunan yang mungkin adalah ....", "options": {"A": "60", "B": "120", "C": "140", "D": "160", "E": "210"}, "answer": "A", "pembahasan": "Ratusan: hanya boleh 1,2,3 (agar <400) = 3 pilihan. Puluhan: 5 pilihan (sisa angka). Satuan: 4 pilihan (sisa angka). Total=3×5×4=60."}, {"no": 40, "stem": "Dalam sebuah ujian terdapat 10 soal, dari nomor 1 sampai nomor 10. Peserta ujian wajib mengerjakan soal nomor 1, 3, dan 5 serta hanya mengerjakan 8 dari 10 soal yang tersedia. Banyak cara peserta ujian memilih soal yang dikerjakan adalah ....", "options": {"A": "21", "B": "28", "C": "45", "D": "48", "E": "56"}, "answer": "A", "pembahasan": "Karena no 1,3,5 wajib dikerjakan, tersisa 5 soal lagi yang harus dipilih dari 7 soal sisa (no 2,4,6,7,8,9,10). Banyak cara = C(7,5) = 21."}]}, "ppkn": {"nama": "Tryout TKA PPKn", "mapel": "PPKn", "durasi": 60, "soal": [{"no": 1, "stem": "Nilai-Nilai Pancasila dijabarkan dalam setiap peraturan perundang-undangan yang telah ada, baik itu ketetapan, keputusan, kebijakan pemerintah, program-program pembangunan dan peraturan-peraturan lain yang pada hakikatnya merupakan penjabaran nilai-nilai Pancasila dari nilai ....", "options": {"A": "dasar", "B": "praksis", "C": "religius", "D": "spiritual", "E": "instrumental"}, "answer": "A"}, {"no": 2, "stem": "Nilai Pancasila yang tergambar dalam Sila Ketuhanan Yang Maha Esa berarti bahwa dalam praktik penyelenggaraan pemerintahan tidak boleh meninggalkan prinsip keimanan dan ketakwaan terhadap Tuhan Yang Maha Esa. Nilai ini menunjukkan adanya pengakuan bahwa manusia, terutama penyelenggara negara, memiliki keterpautan hubungan dengan Sang Penciptanya. Hal ini merupakan aktualisasi dari nilai ....", "options": {"A": "estetika", "B": "realistis", "C": "kultural", "D": "praksis", "E": "material"}, "answer": "D"}, {"no": 3, "stem": "Pancasila menjamin hak asasi manusia melalui nilai-nilai yang terkandung di dalamnya, yaitu nilai dasar, nilai instrumental dan nilai praksis. Yang dimaksud dengan nilai instrumental adalah ....", "options": {"A": "ideal yang relatif mudah berkembang", "B": "yang sesungguhnya dilaksanakan dalam kehidupan nyata sehari-hari", "C": "yang bersifat umum sehingga di dalamnya terkandung cita-cita dan tujuan", "D": "lebih lanjut dari nilai-nilai dasar yang dijabarkan secara lebih kreatif dan dinamis", "E": "lebih lanjut dari nilai-nilai praksis yang dijabarkan secara lebih kreatif dan dinamis"}, "answer": "D"}, {"no": 4, "stem": "Perhatikan kasus berikut! Penembakan mahasiswa Universitas Trisakti pada tanggal 12 Mei 1998 mengakibatkan 4 orang mahasiswa tewas. Mahkamah Militer memvonis dua terdakwa 4 bulan penjara, empat terdakwa divonis 2-5 bulan penjara, dan sembilan terdakwa divonis 3-6 tahun penjara. Kasus ini termasuk pelanggaran HAM dalam kategori ....", "options": {"A": "Kejahatan kemanusiaan", "B": "Pencemaran nama baik", "C": "Kejahatan genosida", "D": "Kejahatan perang", "E": "Invasi/agresi"}, "answer": "A"}, {"no": 5, "stem": "Perhatikan bunyi pasal 26 ayat (2) UUD Negara Republik Indonesia Tahun 1945: 'Penduduk ialah Warga Negara Indonesia dan orang asing yang bertempat tinggal di Indonesia.' Yang membedakan Warga Negara Indonesia dan orang asing antara lain ....", "options": {"A": "Tugas dan tanggung jawabnya.", "B": "Hak dan kewajibannya", "C": "Hak dan tanggung jawabnya", "D": "Tugas dan kewajibannya", "E": "Hak dan tugasnya."}, "answer": "B"}, {"no": 6, "stem": "Pejabat di lingkungan peradilan diberi tugas untuk melakukan pemeriksaan berbagai perkara yang diajukan dalam persidangan, baik dalam kasus perdata maupun pidana di pengadilan. Keterangan tersebut merupakan tugas dari ....", "options": {"A": "Advokat", "B": "Hakim", "C": "Jaksa", "D": "Polisi", "E": "Panitera"}, "answer": "B"}, {"no": 7, "stem": "Pembukaan UUD Negara Republik Indonesia Tahun 1945 salah satu alineanya memiliki kedudukan penting dalam penyelenggaraan ketatanegaraan yang biasa disebut istilah staat fundamental norm, karena Pembukaan UUD tersebut memuat asas-asas ....", "options": {"A": "politik", "B": "dasar negara", "C": "tujuan negara", "D": "pembangunan negara", "E": "politik, tujuan negara, dan dasar negara."}, "answer": "E"}, {"no": 8, "stem": "Menurut UU No.12 Tahun 2006 tentang Kewarganegaraan Indonesia, anak yang lahir di wilayah negara Indonesia tetapi tidak diketahui siapa ayah dan ibunya, maka status anak tersebut adalah ....", "options": {"A": "Apatride", "B": "Bipatride", "C": "Multipatride", "D": "Warga Negara Asing", "E": "Warga Negara Indonesia"}, "answer": "E"}, {"no": 9, "stem": "Hak adalah sesuatu yang kita dapatkan, sedangkan kewajiban adalah sesuatu yang harus kita laksanakan. Contoh perilaku yang mencerminkan kewajiban seseorang dalam usaha bela negara dalam lingkungan kehidupan sekolah antara lain ....", "options": {"A": "beribadah setiap waktu dengan tepat waktu", "B": "mentaati peraturan tata tertib sekolah yang telah disepakati", "C": "memberikan kesempatan pada orang lain untuk berpendapat", "D": "mengikuti dengan tertib kegiatan kemah pramuka di Kaliurang", "E": "mengabadikan dengan cara membuat video tentang lahar merapi"}, "answer": "B"}, {"no": 10, "stem": "Kasus pelanggaran hukum yang dilakukan oleh seorang tentara yang masih aktif dalam menjalankan tugas dinas negara, maka lembaga yang berwenang mengadili terhadap mereka adalah ....", "options": {"A": "Peradilan Militer", "B": "Peradilan Negeri", "C": "Peradilan Agama", "D": "Peradilan ad hoc HAM", "E": "Peradilan Tata Usaha Negara"}, "answer": "A"}, {"no": 11, "stem": "Perhatikan dua pasal dalam konstitusi yang kita miliki yaitu Pasal 27 ayat (3) dan 30 ayat (1) UUD Negara Republik Indonesia Tahun 1945: 1) Tiap-tiap warga negara berhak dan wajib ikut serta dalam usaha pembelaan negara; 2) Tiap-tiap warga negara berhak dan wajib ikut serta dalam usaha pertahanan dan keamanan negara. Berdasarkan kedua pasal di atas, dapat disimpulkan bahwa ….", "options": {"A": "Membela, Mempertahankan dan Mengamankan Negara merupakan hak dan kewajiban warga Negara.", "B": "Membela, Mempertahankan dan mengamankan Negara merupakan hak dan tanggung jawab warga Negara.", "C": "Membela, Mempertahankan, Negara merupakan tugas dan tanggung jawab warga Negara.", "D": "Membelaan dan Mempertahankan Negara merupakan tugas dan kewajiban warga Negara.", "E": "Membelaan dan Mempertahankan Negara merupakan hak, kewajiban dan tanggung jawab warga Negara."}, "answer": "A"}, {"no": 12, "stem": "Seorang gubernur sering membuat keputusan tentang pengangkatan pegawai. Pada suatu waktu, tanpa sengaja ia membuat kesalahan dalam keputusan pengangkatan pegawai sehingga merugikan salah satu pegawainya. Untuk penegakan hukum kasus ini dapat diproses secara yuridis di ....", "options": {"A": "Peradilan Militer", "B": "Peradilan Umum", "C": "Peradilan Agama", "D": "Peradilan TIPIKOR", "E": "Peradilan Tata Usaha Negara"}, "answer": "E"}, {"no": 13, "stem": "Manfaat yang diperoleh bangsa Indonesia dengan menjalin hubungan internasional dengan negara lain dalam bidang sosial budaya antara lain ….", "options": {"A": "Meningkatkan sistem yang berlaku di suatu bangsa dan negara, yang dapat lebih mudah dalam melakukan ekspor dan impor", "B": "Terjalinnya hubungan yang baik dan saling menghormati antarnegara, saling menjaga keutuhan dan mempertahankan nilai-nilai luhur suatu bangsa dan negara", "C": "Meningkatkan hubungan antara bangsa, dilakukan atas dasar untuk memberikan tindakan preventif dan untuk menciptakan suatu pembangunan yang positif", "D": "Menunjang dan meningkatkan sistem dalam suatu bangsa dan negara dalam rangka meningkatkan kualitas penjagaan pada integrasi nasional", "E": "Menambah devisa negara karena banyak warga asing yang berkunjung ke Indonesia"}, "answer": "B"}, {"no": 14, "stem": "Hak Asasi Manusia memiliki sifat-sifat yang bervariasi. Salah satu sifat HAM yang dimiliki oleh seluruh umat manusia dengan tidak membeda-bedakan suku, agama, ras dan antar golongan dinamakan ....", "options": {"A": "hakiki", "B": "universal", "C": "permanen", "D": "tidak dapat dibagi", "E": "tidak dapat dicabut"}, "answer": "B"}, {"no": 15, "stem": "Perhatikan keterangan berikut: 1) Sikap mementingkan diri sendiri; 2) Ketidaktegasan aparat penegak hukum; 3) Penyalahgunaan kekuasaan para pejabat; 4) Penyalahgunaan dalam bidang teknologi; 5) Sikap tidak toleran manusia dalam hidup. Penyebab pelanggaran Hak Asasi Manusia yang disebabkan oleh faktor-faktor eksternal ditunjukkan oleh nomor ....", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 4", "C": "2, 3 dan 4", "D": "2, 3 dan 5", "E": "3, 4 dan 5"}, "answer": "C"}, {"no": 16, "stem": "Salah satu hak warga negara dalam kehidupan yang termasuk kategori bidang ekonomi adalah ....", "options": {"A": "hak untuk memiliki, membeli dan menjual, serta memanfaatkan sesuatu", "B": "hak untuk memilih pendidikan, hak untuk mengembangkan kebudayaan dan sebagainya", "C": "hak untuk mendapatkan perlakuan yang sama dalam hukum dan pemerintahan (rights of legal equality)", "D": "hak kebebasan menyatakan pendapat, kebebasan memeluk agama, kebebasan bergerak, dan sebagainya", "E": "hak ikut serta dalam pemerintahan, hak pilih (dipilih dan memilih dalam suatu pemilu), hak untuk mendirikan parpol, dan sebagainya"}, "answer": "A"}, {"no": 17, "stem": "Berdasarkan pasal 27 ayat (1) UUD Negara Republik Indonesia Tahun 1945, pasal tersebut berisi tentang ....", "options": {"A": "Setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan Negara", "B": "Tiap-tiap warga negara berhak atas pekerjaan dan penghidupan yang layak bagi kemanusiaan", "C": "Kemerdekaan berserikat dan berkumpul, mengeluarkan pikiran dengan lisan dan tulisan dan sebagainya ditetapkan dengan undang-undang", "D": "Segala warga negara bersamaan kedudukannya di dalam hukum dan pemerintahan dan wajib menjunjung hukum dan pemerintahan itu dengan tidak ada kecualinya", "E": "Setiap orang berhak atas pengakuan, jaminan, perlindungan dan kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum"}, "answer": "D"}, {"no": 18, "stem": "Mahkamah Konstitusi sebagai lembaga penegak hukum berperan dalam memelihara keamanan dan ketertiban masyarakat. Salah satu kewenangan Mahkamah Konstitusi dalam menjamin keadilan dan kedamaian dalam masyarakat yaitu ....", "options": {"A": "melakukan pengawasan terhadap pelaksanaan putusan para hakim", "B": "melakukan penindakan terhadap ormas yang mengkritisi pemerintah", "C": "memutus perselisihan mengenai persengketaan hasil pemilihan umum", "D": "melakukan penangkapan, penahanan, penggeledahan, dan penyitaan", "E": "memberi usulan atas pengangkatan pejabat kepolisian kepada DPR"}, "answer": "C"}, {"no": 19, "stem": "Bangsa Indonesia menerapkan prinsip politik luar negeri yang bebas aktif dan diabdikan bagi kepentingan nasional, hal ini sesuai tujuan negara Republik Indonesia dalam Pembukaan UUD Negara Republik Indonesia Tahun 1945 ....", "options": {"A": "Alinea 1", "B": "Alinea 2", "C": "Alinea 3", "D": "Alinea 4", "E": "Alinea 2 dan 3"}, "answer": "D"}, {"no": 20, "stem": "Kejaksaan RI sebagai lembaga negara yang melaksanakan kekuasaan negara di bidang penuntutan harus melaksanakan fungsi, tugas, dan wewenangnya secara merdeka. Adapun salah satu tugas Polisi sebagai aparat penegak hukum adalah sebagai berikut ....", "options": {"A": "melakukan penyelidikan dan penyidikan terhadap tindak pidana kejahatan.", "B": "melaksanakan penetapan hakim dan putusan pengadilan yang telah memperoleh kekuatan hukum tetap", "C": "pengawasan aliran kepercayaan yang dapat membahayakan kehidupan dalam masyarakat dan negara", "D": "melakukan pengawasan terhadap pelaksanaan putusan pidana bersyarat, putusan pidana pengawasan, dan keputusan lepas bersyarat", "E": "memberi jasa hukum, baik di dalam maupun di luar pengadilan, berupa konsultasi hukum, bantuan hukum, dan mewakili, membela, mendampingi"}, "answer": "A"}, {"no": 21, "stem": "Pengertian integrasi nasional adalah proses penyesuaian di antara unsur-unsur kebudayaan yang berbeda sehingga mencapai suatu keserasian fungsi dalam kehidupan masyarakat, yaitu usaha-usaha dan proses mempersatukan perbedaan-perbedaan yang ada pada suatu negara sehingga terciptanya keserasian dan keselarasan secara nasional. Keterangan ini berarti pengertian integrasi nasional secara ....", "options": {"A": "politis", "B": "sosialis", "C": "anarkhis", "D": "etimologi", "E": "antropologis"}, "answer": "A"}, {"no": 22, "stem": "Wawasan Nusantara pada hakikatnya merupakan cara pandang dan sikap bangsa Indonesia mengenai diri dan lingkungannya berdasarkan Pancasila dan UUD Negara Republik Indonesia Tahun 1945. Batas lingkungan wilayah laut Indonesia yang termasuk dalam batas Laut ZEE menurut Wawasan Nusantara dapat ditentukan jaraknya sebagai berikut ….", "options": {"A": "3 mil", "B": "12 mil", "C": "24 mil", "D": "200 mil", "E": "Lebih dari 200 mil"}, "answer": "D"}, {"no": 23, "stem": "Perhatikan beberapa situasi dan kondisi berikut: 1) Timbulnya kesenjangan sosial yang tajam akibat persaingan bebas; 2) Penggunaan pengerahan massa untuk menumbangkan pemerintahan yang sah; 3) Menggalang kekuatan politik untuk melemahkan kekuasaan pemerintah yang berkuasa; 4) Munculnya gejala westernisasi; 5) Pola perjuangan tidak bersenjata kelompok separatis untuk menarik simpati internasional. Kasus ancaman terhadap negara di bidang politik ditandai oleh nomor ....", "options": {"A": "1, 2 dan 3", "B": "1, 3 dan 4", "C": "2, 3 dan 5", "D": "2, 4 dan 5", "E": "3, 4 dan 5"}, "answer": "C"}, {"no": 24, "stem": "Perhatikan pernyataan berikut: 1) Letak dan bentuk geografis wilayah Indonesia; 2) Keadaan dan kemampuan penduduk bangsa Indonesia; 3) Keadaan dan kekayaan alam yang dimiliki bangsa Indonesia. Pernyataan tersebut merupakan tanda-tanda konsep kesatuan bangsa Indonesia dari aspek ….", "options": {"A": "sosial", "B": "politik", "C": "alamiah", "D": "hankam", "E": "ekonomi"}, "answer": "C"}, {"no": 25, "stem": "Menciptakan iklim penyelenggaraan negara yang sehat dan dinamis, dalam wujud pemerintahan yang kuat, aspiratif, dan terpercaya yang dibangun sebagai penjelmaan kedaulatan rakyat, merupakan implementasi wawasan nusantara dalam bidang ....", "options": {"A": "sosial", "B": "politik", "C": "budaya", "D": "hankam", "E": "ekonomi"}, "answer": "B"}, {"no": 26, "stem": "Perhatikan keterangan berikut: 1) Agresi; 2) Ancaman terorisme; 3) Pelanggaran wilayah; 4) Ancaman di bidang sosial; 5) Ancaman di bidang ideologi; 6) Ancaman di bidang sosial budaya. Berdasarkan keterangan tersebut, ancaman non militer ditunjukkan pada nomor ....", "options": {"A": "1, 2 dan 3", "B": "2, 3 dan 4", "C": "3, 4 dan 5", "D": "3, 5 dan 6", "E": "4, 5 dan 6"}, "answer": "E"}, {"no": 27, "stem": "Prinsip-prinsip demokrasi Pancasila diantaranya adalah ....", "options": {"A": "sistem 2 atau multi partai", "B": "hak milik pribadi tidak diutamakan", "C": "keseimbangan antara hak dan kewajiban", "D": "sistem pemerintahan presidensial atau parlementer", "E": "sistem ekonomi pasar yang kompetitif (ekonomi bersifat campuran)"}, "answer": "C"}, {"no": 28, "stem": "Berdasar ketentuan pasal 1 ayat (1) UUD Negara Republik Indonesia Tahun 1945, bentuk Negara Indonesia adalah ….", "options": {"A": "federasi.", "B": "Serikat .", "C": "Republik.", "D": "Monarkhi", "E": "Kesatuan"}, "answer": "E"}, {"no": 29, "stem": "Pasal 25A UUD Negara Republik Indonesia Tahun 1945 menentukan bahwa 'Negara Kesatuan Republik Indonesia adalah sebuah negara kepulauan yang berciri Nusantara dengan wilayah yang batas-batas dan hak-haknya ditetapkan dengan undang-undang'. Sesuai isi pasal tersebut negara Indonesia memilih menggunakan sistem kepulauan (archipelago system) dengan alasan, karena Indonesia ....", "options": {"A": "memiliki keindahan pulau yang terbentang dari Sabang sampai Merauke", "B": "negara terbesar yang wilayah daratnya tidak langsung menyentuh benua lain", "C": "memiliki 17.500 pulau melebihi jumlah pulau negara maritim yang lain di dunia", "D": "memiliki pulau-pulau yang sangat banyak dan berjarak sangat dekat antara pulau yang satu dengan pulau yang lain", "E": "sebagai negara terbesar wilayah daratnya tak satupun secara langsung menyentuh benua lain, dan mempunyai 17.500 pulau"}, "answer": "D"}, {"no": 30, "stem": "Setiap orang yang telah memberikan hak pilihnya dengan cara memilih salah satu partai yang hasil pilihannya tersebut tidak boleh diberitahukan kepada orang lain, hal ini sejalan dengan sifat pemilu ….", "options": {"A": "jujur", "B": "bebas", "C": "umum", "D": "rahasia", "E": "langsung"}, "answer": "D"}, {"no": 31, "stem": "Berdasarkan ketentuan pasal 3 ayat (2) UUD tahun 1945, Lembaga negara yang berhak melantik Presiden dan Wakil Presiden adalah ….", "options": {"A": "Majelis Permusyawaratan Rakyat", "B": "Dewan Perwakilan Daerah", "C": "Dewan Perwakilan Rakyat", "D": "Mahkamah Agung", "E": "Komisi Yudisial"}, "answer": "A"}, {"no": 32, "stem": "Pemegang kekuasaan negara dalam sistem ketatanegaraan Indonesia menurut UUD Negara Republik Indonesia Tahun 1945 yaitu Legislatif, Eksekutif dan Yudikatif. Lembaga negara yang memiliki kewenangan untuk menguji secara materiil isi peraturan-peraturan di bawah Undang-Undang yaitu ....", "options": {"A": "Presiden", "B": "Mahkamah Agung", "C": "Dewan Perwakilan Rakyat", "D": "Dewan Perwakilan Daerah", "E": "Badan Pemeriksa Keuangan"}, "answer": "B"}, {"no": 33, "stem": "Pemerintah pusat adalah pemerintahan yang ada di tingkat pusat yang menangani urusan politik luar negeri, pertahanan, keamanan, yustisi, moneter dan fiskal nasional, agama, serta norma. Lembaga penyelenggara pemerintahan pusat dalam pelaksanaan otonomi daerah di Indonesia adalah ....", "options": {"A": "Presiden", "B": "wakil presiden", "C": "Menteri Negara", "D": "Presiden dan Wakil Presiden", "E": "Presiden dan Wakil Presiden yang dibantu Menteri Negara"}, "answer": "E"}, {"no": 34, "stem": "Pelaksanaan asas Desentralisasi adalah suatu proses penyerahan sebagian wewenang dan tanggung jawab dari urusan yang semula adalah urusan pemerintah pusat kepada badan-badan atau lembaga-lembaga pemerintah daerah. Adapun yang menjadi kewenangan pemerintah pusat yaitu ....", "options": {"A": "membentuk berbagai macam Perda di Indonesia", "B": "menarik retribusi dan melayani kepentingan publik", "C": "mendirikan berbagai lembaga peradilan di negara Indonesia", "D": "membentuk APBD untuk seluruh wilayah negara Indonesia", "E": "menarik berbagai macam pajak tontonan dalam masyarakat"}, "answer": "C"}, {"no": 35, "stem": "Kedudukan Presiden sebagai Kepala Negara menurut UUD Negara Republik Indonesia Tahun 1945 adalah ....", "o gkan demokratisasi dalam segala bidang; 6. Mengadakan reformasi lembaga-lembaga politik. Agar kemajuan Iptek bersifat positif dan dapat diserap ke dalam budaya kehidupan sehari-hari, perubahan nilai dan perilaku yang perlu diusahakan ditunjukkan pada nomor ….", "options": {"A": "1, 2 dan 4", "B": "2, 3 dan 4", "C": "3, 4 dan 5", "D": "3, 5 dan 6", "E": "4, 5 dan 6"}, "answer": "A"}, {"no": 48, "stem": "Membangun sikap yang sesuai dengan hukum harus dimulai dari ….", "options": {"A": "Lingkungan keluarga masing-masing melalui keteladanan orang tua", "B": "Lingkungan sekolah melalui keteladanan dari bapak ibu guru dan Kepala Sekolah.", "C": "Diri sendiri, dari hal-hal yang kecil, dan dimulai saat ini juga.", "D": "Diri sendiri dengan mencontoh dari para pahlawan bangsa", "E": "Diri sendiri, dimulai saat ini juga, dengan menanti teladan dari pimpinan"}, "answer": "C"}, {"no": 49, "stem": "Jiwa solidaritas dan setiakawan merupakan salah satu nilai yang harus terus kita jaga dan kembangkan dalam rangka ….", "options": {"A": "Mewujudkan tujuan negara.", "B": "Menjalin kerja sama dengan bangsa lain", "C": "Mengisi dan mempertahankan kemerdekaan.", "D": "Memperkokoh persatuan dan kesatuan bangsa", "E": "Meningkatkan kerukunan hidup di masyarakat."}, "answer": "D"}, {"no": 50, "stem": "Sebagai negara dengan tingkat keberagaman yang sangat tinggi, perilaku berikut yang dapat mendorong terwujudnya persatuan dan kesatuan adalah ….", "options": {"A": "Mengurangi intensitas pertemuan untuk menghindari konflik", "B": "Menghormati keyakinan dan tradisi orang lain", "C": "Mendahulukan kepentingan orang lain", "D": "Menghargai pendapat orang lain.", "E": "Menghargai segala bentuk perbedaan"}, "answer": "E"}]}}</script>
<script>
const EXAM = JSON.parse(document.getElementById('exam-data').textContent);

// ==== KONFIGURASI GURU ====
// Tempel URL Web App Google Apps Script di sini (lihat panduan yang menyertai file ini).
// Kosongkan ('') jika belum ingin mengirim hasil ke Spreadsheet guru.
const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxcu8iZZ3JxZzMfBAJ6sY_RttRtY_0ixDu0B0D54mMW76U1c2CVGkMscgx3jchKc-cgMQ/exec';
// Jika true, siswa wajib memasukkan kode akses yang disetujui guru sebelum bisa memilih paket ujian.
const REQUIRE_ACCESS_CODE = true;

let state = {
  paketKey: null,
  paket: null,
  namaSiswa: '',
  kelas: '',
  qIndex: 0,
  answers: {},
  timeLeft: 0,
  timerId: null,
  finished: false,
  result: null
};

function el(id){ return document.getElementById(id); }
function show(id){ el(id).classList.remove('hidden'); }
function hide(id){ el(id).classList.add('hidden'); }

function hideAllScreens(){
  hide('screen-gate'); hide('screen-home'); hide('screen-exam'); hide('screen-result'); hide('screen-admin');
  document.body.classList.remove('gate-mode');
}

const HOME_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 10.5L12 3l9 7.5" stroke="#E9F0EC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" stroke="#E9F0EC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderGate(showDaftarForm){
  hideAllScreens(); show('screen-gate'); hide('btnHome');
  document.body.classList.add('gate-mode');
  if(showDaftarForm){
    el('screen-gate').innerHTML = `
      <div class="gate-box">
        <div class="gate-icon">${HOME_ICON_SVG}</div>
        <h2>Ajukan Izin Mengikuti Ujian</h2>
        <p>Isi data berikut. Setelah disetujui guru, kamu akan mendapat ID Pengguna dan Kata Sandi untuk masuk.</p>
        <div id="gateMsg"></div>
        <label>Nama lengkap<input id="daftarNama" type="text" placeholder="Nama kamu"></label>
        <label>Kelas<input id="daftarKelas" type="text" placeholder="Contoh: XII IPA 1"></label>
        <label>Kontak (No. WA/Email)<input id="daftarKontak" type="text" placeholder="Untuk dihubungi guru"></label>
        <div class="gate-actions">
          <button class="btn-gate-primary" onclick="submitDaftar()">Ajukan</button>
          <button class="btn-gate-primary" style="background:transparent;" onclick="renderGate(false)">&larr; Kembali ke halaman masuk</button>
        </div>
        <div class="gate-footer">&copy; 2026-2027 MANBA</div>
      </div>`;
  } else {
    el('screen-gate').innerHTML = `
      <div class="gate-box">
        <div class="gate-icon">${HOME_ICON_SVG}</div>
        <h2>Ruang Ujian</h2>
        <p>Masuk menggunakan ID Pengguna dan Kata Sandi yang diberikan guru.</p>
        <div id="gateMsg"></div>
        <label>ID Pengguna<input id="idPenggunaInput" type="text" placeholder="Nama / ID Pengguna" autocomplete="username"></label>
        <label>Kata Sandi<input id="sandiInput" type="password" placeholder="Kata sandi" autocomplete="current-password"></label>
        <div class="gate-actions">
          <button class="btn-gate-primary" onclick="verifyAccessCode()">Masuk</button>
        </div>
        <div class="gate-link">Belum punya akun? <a href="#" onclick="renderGate(true); return false;">Ajukan izin mengikuti ujian</a></div>
        <div class="gate-link">Guru/Panitia? <a href="#" onclick="renderAdminLogin(); return false;">Masuk sebagai Admin</a></div>
        <div class="gate-footer">&copy; 2026-2027 MANBA</div>
      </div>`;
  }
}

function setGateMsg(msg, type){
  const box = el('gateMsg');
  if(!box) return;
  if(!msg){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="gate-msg ${type}">${escapeHtml(msg)}</div>`;
}

function verifyAccessCode(){
  const idPengguna = el('idPenggunaInput').value.trim();
  const sandi = el('sandiInput').value.trim();
  if(!idPengguna || !sandi){ setGateMsg('ID Pengguna dan Kata Sandi wajib diisi.', 'error'); return; }
  setGateMsg('Memeriksa akun...', 'info');
  const cbName = 'verifyCb_' + Date.now();
  const cleanup = () => { delete window[cbName]; if(scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl); };
  window[cbName] = function(data){
    cleanup();
    if(data && data.valid){
      state.namaSiswa = data.nama;
      state.kelas = data.kelas;
      document.body.classList.remove('gate-mode');
      renderHome();
    } else {
      setGateMsg('ID Pengguna / Kata Sandi salah, atau belum disetujui guru.', 'error');
    }
  };
  const scriptEl = document.createElement('script');
  scriptEl.src = SHEET_WEBHOOK_URL + '?action=verify&id=' + encodeURIComponent(idPengguna) + '&kode=' + encodeURIComponent(sandi) + '&callback=' + cbName;
  scriptEl.onerror = function(){ cleanup(); setGateMsg('Gagal menghubungi server. Periksa koneksi internet lalu coba lagi.', 'error'); };
  document.body.appendChild(scriptEl);
}

function submitDaftar(){
  const nama = el('daftarNama').value.trim();
  const kelas = el('daftarKelas').value.trim();
  const kontak = el('daftarKontak').value.trim();
  if(!nama || !kelas){ setGateMsg('Nama dan kelas wajib diisi.', 'error'); return; }
  const body = new URLSearchParams({action:'daftar', nama, kelas, kontak});
  try{ fetch(SHEET_WEBHOOK_URL, {method:'POST', mode:'no-cors', body}); }catch(e){}
  el('screen-gate').innerHTML = `
    <div class="gate-box">
      <div class="gate-icon">${HOME_ICON_SVG}</div>
      <h2>Permintaan Terkirim</h2>
      <p>Terima kasih, ${escapeHtml(nama)}. Permintaan untuk mengikuti ujian sudah tercatat. Silakan tunggu ID Pengguna dan Kata Sandi dari guru (biasanya dibagikan lewat kelas/grup WA).</p>
      <div class="gate-actions">
        <button class="btn-gate-primary" onclick="renderGate(false)">Sudah punya akun? Masuk di sini</button>
      </div>
      <div class="gate-footer">&copy; 2026-2027 MANBA</div>
    </div>`;
}

// ================== ADMIN ==================
function adminCall(action, params, onResult){
  if(!SHEET_WEBHOOK_URL){ onResult({ok:false, error:'Webhook belum dikonfigurasi.'}); return; }
  const cbName = 'adminCb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
  const cleanup = () => { delete window[cbName]; if(scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl); };
  window[cbName] = function(data){ cleanup(); onResult(data); };
  let url = SHEET_WEBHOOK_URL + '?action=' + encodeURIComponent(action) +
            '&callback=' + cbName + '&password=' + encodeURIComponent(state.adminPassword || '');
  Object.keys(params || {}).forEach(k => { url += '&' + k + '=' + encodeURIComponent(params[k]); });
  const scriptEl = document.createElement('script');
  scriptEl.src = url;
  scriptEl.onerror = function(){ cleanup(); onResult({ok:false, error:'Gagal menghubungi server.'}); };
  document.body.appendChild(scriptEl);
}

function renderAdminLogin(){
  hideAllScreens(); show('screen-admin'); hide('btnHome');
  document.body.classList.add('gate-mode');
  el('screen-admin').innerHTML = `
    <div class="gate-box">
      <div class="gate-icon">${HOME_ICON_SVG}</div>
      <h2>Panel Admin</h2>
      <p>Khusus guru/panitia. Masukkan password admin untuk mengelola pendaftaran siswa dan hasil ujian.</p>
      <div id="adminMsg"></div>
      <label>Password Admin<input id="adminPwInput" type="password" placeholder="Password admin" onkeydown="if(event.key==='Enter') adminLogin();"></label>
      <div class="gate-actions">
        <button class="btn-gate-primary" onclick="adminLogin()">Masuk</button>
        <button class="btn-gate-primary" style="background:transparent;" onclick="adminBackToStart()">&larr; Kembali</button>
      </div>
      <div class="gate-footer">&copy; 2026-2027 MANBA</div>
    </div>`;
  el('adminPwInput').focus();
}

// Kembali dari layar admin: ke gate login jika siswa belum login (gate wajib),
// atau ke beranda jika gate tidak diwajibkan / siswa sudah login sebelumnya.
function adminBackToStart(){
  if(REQUIRE_ACCESS_CODE && SHEET_WEBHOOK_URL && !state.namaSiswa){
    hideAllScreens();
    renderGate(false);
  } else {
    goHome();
  }
}

function setAdminMsg(msg, type){
  const box = el('adminMsg');
  if(!box) return;
  box.innerHTML = msg ? `<div class="gate-msg ${type}">${escapeHtml(msg)}</div>` : '';
}

function adminLogin(){
  const pw = el('adminPwInput').value.trim();
  if(!pw){ setAdminMsg('Password wajib diisi.', 'error'); return; }
  setAdminMsg('Memeriksa...', 'info');
  state.adminPassword = pw;
  adminCall('admin_data', {}, function(data){
    if(data && data.ok){
      state.adminData = data;
      document.body.classList.remove('gate-mode');
      renderAdminDashboard('pendaftaran');
    } else {
      state.adminPassword = '';
      setAdminMsg(data && data.error === 'unauthorized' ? 'Password salah.' : 'Gagal memuat data. Periksa koneksi internet.', 'error');
    }
  });
}

function adminLogout(){
  state.adminPassword = '';
  state.adminData = null;
  adminBackToStart();
}

function loadAdminData(tab){
  adminCall('admin_data', {}, function(data){
    if(data && data.ok){ state.adminData = data; renderAdminDashboard(tab); }
    else { alert('Gagal memuat data: ' + ((data && data.error) || 'unknown')); }
  });
}

function renderAdminDashboard(tab){
  tab = tab || 'pendaftaran';
  hideAllScreens(); show('screen-admin'); show('btnHome');
  const d = state.adminData || {pendaftaran:[], hasil:[]};
  const menunggu = d.pendaftaran.filter(p => p.status === 'Menunggu').length;
  const disetujui = d.pendaftaran.filter(p => p.status === 'Disetujui').length;
  const avgSkor = d.hasil.length ? Math.round(d.hasil.reduce((a,h) => a + Number(h.skor || 0), 0) / d.hasil.length) : 0;

  el('screen-admin').innerHTML = `
    <div class="admin-toolbar">
      <div>
        <h2>Panel Admin</h2>
        <div class="admin-stats">${menunggu} menunggu &middot; ${disetujui} disetujui &middot; ${d.hasil.length} hasil ujian &middot; rata-rata skor ${avgSkor}</div>
      </div>
      <div class="admin-toolbar-actions">
        <button class="btn btn-ghost" onclick="loadAdminData('${tab}')">&#8635; Muat ulang</button>
        <button class="btn btn-ghost" onclick="adminLogout()">Keluar</button>
      </div>
    </div>
    <div class="filter-tabs">
      <div class="filter-tab ${tab==='pendaftaran'?'active':''}" onclick="renderAdminDashboard('pendaftaran')">Pendaftaran (${d.pendaftaran.length})</div>
      <div class="filter-tab ${tab==='hasil'?'active':''}" onclick="renderAdminDashboard('hasil')">Hasil Ujian (${d.hasil.length})</div>
    </div>
    ${tab === 'pendaftaran' ? renderPendaftaranTable(d.pendaftaran) : renderHasilTable(d.hasil)}
  `;
}

function renderPendaftaranTable(list){
  if(!list.length) return `<div class="review-item">Belum ada pendaftar.</div>`;
  const rows = list.slice().reverse().map(p => `
    <tr>
      <td>${escapeHtml(p.waktu)}</td>
      <td>${escapeHtml(p.nama)}</td>
      <td>${escapeHtml(p.kelas)}</td>
      <td>${escapeHtml(p.kontak)}</td>
      <td><span class="status-badge ${p.status==='Disetujui'?'ok':(p.status==='Ditolak'?'no':'wait')}">${escapeHtml(p.status)}</span></td>
      <td>${p.kode ? `<code>${escapeHtml(p.kode)}</code>` : '-'}</td>
      <td class="admin-actions-cell">
        ${p.status!=='Disetujui' ? `<button class="btn btn-primary btn-sm" onclick="adminApprove(${p.row})">Setujui</button>` : ''}
        ${p.status!=='Ditolak' ? `<button class="btn btn-ghost btn-sm" onclick="adminReject(${p.row})">Tolak</button>` : ''}
        ${p.status==='Disetujui' ? `<button class="btn btn-ghost btn-sm" onclick="adminResetKode(${p.row})">Reset Kode</button>` : ''}
        <button class="btn btn-warn btn-sm" onclick="adminDeletePendaftaran(${p.row})">Hapus</button>
      </td>
    </tr>`).join('');
  return `
    <div class="admin-actions-top"><button class="btn btn-primary" onclick="adminApproveAll()">Setujui Semua yang Menunggu</button></div>
    <div class="admin-table-wrap"><table class="admin-table">
      <thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Kontak</th><th>Status</th><th>Kode</th><th>Aksi</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function renderHasilTable(list){
  if(!list.length) return `<div class="review-item">Belum ada hasil ujian.</div>`;
  const rows = list.slice().reverse().map(h => `
    <tr>
      <td>${escapeHtml(h.waktu)}</td>
      <td>${escapeHtml(h.nama)}</td>
      <td>${escapeHtml(h.kelas)}</td>
      <td>${escapeHtml(h.paket)}</td>
      <td>${escapeHtml(h.mapel)}</td>
      <td><b>${h.skor}</b></td>
      <td>${h.benar}/${h.salah}/${h.kosong} dari ${h.total}</td>
      <td class="admin-actions-cell"><button class="btn btn-warn btn-sm" onclick="adminDeleteHasil(${h.row})">Hapus</button></td>
    </tr>`).join('');
  return `
    <div class="admin-table-wrap"><table class="admin-table">
      <thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Paket</th><th>Mapel</th><th>Skor</th><th>Benar/Salah/Kosong</th><th>Aksi</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function adminApprove(row){
  adminCall('admin_approve', {row: row}, function(data){
    if(data && data.ok) loadAdminData('pendaftaran');
    else alert('Gagal menyetujui: ' + ((data && data.error) || 'unknown'));
  });
}
function adminApproveAll(){
  if(!confirm('Setujui semua pendaftar yang berstatus Menunggu?')) return;
  adminCall('admin_approve_all', {}, function(data){
    if(data && data.ok){ alert(data.count + ' pendaftar disetujui.'); loadAdminData('pendaftaran'); }
    else alert('Gagal: ' + ((data && data.error) || 'unknown'));
  });
}
function adminReject(row){
  if(!confirm('Tolak pendaftar ini?')) return;
  adminCall('admin_reject', {row: row}, function(data){
    if(data && data.ok) loadAdminData('pendaftaran');
    else alert('Gagal: ' + ((data && data.error) || 'unknown'));
  });
}
function adminResetKode(row){
  if(!confirm('Buat ulang kode akses untuk pendaftar ini? Kode lama tidak berlaku lagi.')) return;
  adminCall('admin_reset_kode', {row: row}, function(data){
    if(data && data.ok){ alert('Kode akses baru untuk ' + data.nama + ': ' + data.kode); loadAdminData('pendaftaran'); }
    else alert('Gagal: ' + ((data && data.error) || 'unknown'));
  });
}
function adminDeletePendaftaran(row){
  if(!confirm('Hapus data pendaftar ini secara permanen?')) return;
  adminCall('admin_delete_pendaftaran', {row: row}, function(data){
    if(data && data.ok) loadAdminData('pendaftaran');
    else alert('Gagal: ' + ((data && data.error) || 'unknown'));
  });
}
function adminDeleteHasil(row){
  if(!confirm('Hapus data hasil ujian ini secara permanen?')) return;
  adminCall('admin_delete_hasil', {row: row}, function(data){
    if(data && data.ok) loadAdminData('hasil');
    else alert('Gagal: ' + ((data && data.error) || 'unknown'));
  });
}

function renderHome(){
  hideAllScreens(); show('screen-home');
  hide('btnHome');
  const keys = Object.keys(EXAM);
  let cards = keys.map(k => {
    const p = EXAM[k];
    return `<div class="paket-card" onclick="openStartModal('${k}')">
      <span class="paket-tag">${p.mapel}</span>
      <h3>${p.nama}</h3>
      <div class="paket-meta">
        <span>&#128203; ${p.soal.length} soal</span>
        <span>&#8987; ${p.durasi} menit</span>
      </div>
    </div>`;
  }).join('');
  el('screen-home').innerHTML = `
    <div class="home-hero">
      <h1>Pilih paket tryout</h1>
      <p>Empat paket soal TKA siap dikerjakan. Pilih salah satu paket di bawah untuk memulai sesi ujian dengan waktu berjalan otomatis.</p>
    </div>
    <div class="paket-grid">${cards}</div>
  `;
}

function openStartModal(key){
  const p = EXAM[key];
  el('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${p.nama}</h3>
        <p>${p.soal.length} soal pilihan ganda. Waktu pengerjaan berjalan mundur dan akan submit otomatis saat habis.</p>
        <label>Nama lengkap
          <input type="text" id="namaInput" value="${state.namaSiswa||''}" placeholder="Tulis nama kamu" style="width:100%; font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;">
        </label>
        <label>Kelas
          <input type="text" id="kelasInput" value="${state.kelas||''}" placeholder="Contoh: XII IPA 1" style="width:100%; font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;">
        </label>
        <label>Durasi (menit)
          <input type="number" id="durInput" value="${p.durasi}" min="5" max="180">
        </label>
        <div id="modalErr" style="color:var(--warn); font-size:13px; display:none;">Nama dan kelas wajib diisi.</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary" onclick="startExam('${key}')">Mulai Ujian</button>
        </div>
      </div>
    </div>`;
}
function closeModal(){ el('modalRoot').innerHTML = ''; }

function startExam(key){
  const namaInput = el('namaInput');
  const kelasInput = el('kelasInput');
  const nama = namaInput ? namaInput.value.trim() : '';
  const kelas = kelasInput ? kelasInput.value.trim() : '';
  if(!nama || !kelas){
    el('modalErr').style.display = 'block';
    return;
  }
  const durInput = el('durInput');
  const durasi = durInput ? parseInt(durInput.value) || EXAM[key].durasi : EXAM[key].durasi;
  closeModal();
  state = {
    paketKey:key, paket:EXAM[key], namaSiswa:nama, kelas:kelas, qIndex:0, answers:{},
    timeLeft: durasi*60, timerId:null, finished:false, result:null
  };
  hideAllScreens(); show('screen-exam');
  show('btnHome');
  renderExam();
  state.timerId = setInterval(tick, 1000);
}

function tick(){
  state.timeLeft--;
  updateTimerDisplay();
  if(state.timeLeft <= 0){
    clearInterval(state.timerId);
    submitExam(true);
  }
}
function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m+':'+s;
}
function updateTimerDisplay(){
  const t = el('timerDisplay');
  if(!t) return;
  t.textContent = fmtTime(Math.max(0,state.timeLeft));
  t.parentElement.classList.toggle('low', state.timeLeft <= 60 && state.timeLeft > 0);
}

function renderExam(){
  const p = state.paket;
  const q = p.soal[state.qIndex];
  const total = p.soal.length;
  const answeredCount = Object.keys(state.answers).length;

  let optionsHtml = Object.keys(q.options).map(letter => {
    const selected = state.answers[q.no] === letter;
    return `<div class="option ${selected?'selected':''}" onclick="selectAnswer(${q.no}, '${letter}')">
      <span class="bubble">${letter}</span>
      <span>${q.options[letter]}</span>
    </div>`;
  }).join('');

  let bubbles = p.soal.map((qq, i) => {
    const answered = state.answers[qq.no] !== undefined;
    const current = i === state.qIndex;
    return `<div class="nav-bubble ${answered?'answered':''} ${current?'current':''}" onclick="goToQuestion(${i})">${qq.no}</div>`;
  }).join('');

  el('screen-exam').innerHTML = `
    <div class="exam-header">
      <div>
        <div class="subtes">${p.mapel}</div>
        <h2>${p.nama}</h2>
      </div>
      <div class="timer"><span>&#9201;</span><span id="timerDisplay">${fmtTime(state.timeLeft)}</span></div>
    </div>
    <div class="exam-body">
      <div class="question-card">
        <div class="q-index">Soal nomor ${q.no} dari ${total}</div>
        <div class="q-stem">${escapeHtml(q.stem)}</div>
        <div class="options">${optionsHtml}</div>
        <div class="nav-buttons">
          <button class="btn btn-ghost" ${state.qIndex===0?'disabled':''} onclick="goToQuestion(${state.qIndex-1})">&larr; Sebelumnya</button>
          ${state.qIndex===total-1
            ? `<button class="btn btn-warn" onclick="confirmSubmit()">Selesaikan Ujian</button>`
            : `<button class="btn btn-primary" onclick="goToQuestion(${state.qIndex+1})">Selanjutnya &rarr;</button>`}
        </div>
      </div>
      <div class="sidebar">
        <div class="sidebar-title">Navigasi Soal</div>
        <div class="progress-text">${answeredCount} / ${total} terjawab</div>
        <div class="bubble-grid">${bubbles}</div>
        <div class="legend">
          <span><span class="dot answered"></span> Terjawab</span>
          <span><span class="dot unanswered"></span> Belum dijawab</span>
        </div>
        <button class="btn btn-warn" style="width:100%" onclick="confirmSubmit()">Selesaikan Ujian</button>
      </div>
    </div>
  `;
  updateTimerDisplay();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectAnswer(qno, letter){
  state.answers[qno] = letter;
  renderExam();
}
function goToQuestion(i){
  if(i < 0 || i >= state.paket.soal.length) return;
  state.qIndex = i;
  renderExam();
}

function confirmSubmit(){
  const total = state.paket.soal.length;
  const answered = Object.keys(state.answers).length;
  const sisa = total - answered;
  el('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Selesaikan ujian?</h3>
        <p>${sisa > 0 ? `Masih ada <b>${sisa} soal</b> yang belum dijawab. ` : ''}Setelah disubmit, jawaban tidak dapat diubah lagi.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Kembali mengerjakan</button>
          <button class="btn btn-warn" onclick="submitExam(false)">Ya, Selesaikan</button>
        </div>
      </div>
    </div>`;
}

function submitExam(auto){
  closeModal();
  if(state.timerId) clearInterval(state.timerId);
  state.finished = true;

  const p = state.paket;
  let correct = 0, wrong = 0, unanswered = 0;
  const details = p.soal.map(q => {
    const given = state.answers[q.no];
    const isCorrect = given === q.answer;
    if(given === undefined) unanswered++;
    else if(isCorrect) correct++; else wrong++;
    return {q, given, isCorrect};
  });
  const total = p.soal.length;
  const score = Math.round((correct/total)*100);
  state.result = {correct, wrong, unanswered, total, score, details};

  sendToSheet({
    nama: state.namaSiswa, kelas: state.kelas,
    paket: p.nama, mapel: p.mapel,
    skor: score, benar: correct, salah: wrong, kosong: unanswered, total: total
  });

  renderResult(auto);
}

function sendToSheet(data){
  if(!SHEET_WEBHOOK_URL) return; // belum dikonfigurasi guru, lewati
  try{
    const body = new URLSearchParams(data);
    fetch(SHEET_WEBHOOK_URL, { method:'POST', mode:'no-cors', body });
  }catch(e){
    console.warn('Gagal mengirim hasil ke Spreadsheet guru:', e);
  }
}

function renderResult(auto, filter){
  filter = filter || 'all';
  hideAllScreens(); show('screen-result');
  const p = state.paket;
  const {correct, wrong, unanswered, total, score, details} = state.result;

  const filtered = details.filter(d => {
    if(filter==='wrong') return d.given!==undefined && !d.isCorrect;
    if(filter==='unanswered') return d.given===undefined;
    return true;
  });

  const reviewHtml = filtered.map(d => {
    const cls = d.given===undefined ? 'wrong' : (d.isCorrect ? 'correct' : 'wrong');
    const givenText = d.given ? `${d.given}. ${d.q.options[d.given]}` : '(tidak dijawab)';
    const correctText = `${d.q.answer}. ${d.q.options[d.q.answer]}`;
    const pemb = d.q.pembahasan ? `<div class="pemb"><b>Pembahasan:</b> ${escapeHtml(d.q.pembahasan)}</div>` : '';
    return `<div class="review-item ${cls}">
      <div class="rq">No. ${d.q.no} &middot; ${escapeHtml(d.q.stem.split('\n')[0])}</div>
      <div class="ra">Jawaban Anda: <b>${escapeHtml(givenText)}</b><br>Jawaban benar: <b>${escapeHtml(correctText)}</b></div>
      ${pemb}
    </div>`;
  }).join('') || `<div class="review-item">Tidak ada soal pada kategori ini.</div>`;

  el('screen-result').innerHTML = `
    <div class="result-hero">
      ${auto ? '<p style="color:var(--warn); font-size:13px; margin-bottom:10px;">&#9201; Waktu habis, ujian disubmit otomatis.</p>' : ''}
      <div class="score-num">${score}</div>
      <div class="score-label">Skor akhir &middot; ${p.nama}</div>
      <div class="score-label">${escapeHtml(state.namaSiswa)} &middot; ${escapeHtml(state.kelas)}</div>
      ${SHEET_WEBHOOK_URL ? '<div class="score-label" style="margin-top:6px; color:var(--accent-ink);">&#10003; Hasil terkirim ke guru</div>' : ''}
      <div class="result-stats">
        <div class="stat"><b>${correct}</b><span>Benar</span></div>
        <div class="stat"><b>${wrong}</b><span>Salah</span></div>
        <div class="stat"><b>${unanswered}</b><span>Kosong</span></div>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" onclick="goHome()">Kembali ke Beranda</button>
      <button class="btn btn-primary" onclick="openStartModal('${state.paketKey}')">Ulangi Paket Ini</button>
    </div>
    <div class="filter-tabs">
      <div class="filter-tab ${filter==='all'?'active':''}" onclick="renderResult(false,'all')">Semua (${total})</div>
      <div class="filter-tab ${filter==='wrong'?'active':''}" onclick="renderResult(false,'wrong')">Salah (${wrong+unanswered})</div>
      <div class="filter-tab ${filter==='unanswered'?'active':''}" onclick="renderResult(false,'unanswered')">Kosong (${unanswered})</div>
    </div>
    <div class="review-list">${reviewHtml}</div>
  `;
}

function goHome(){
  if(state.timerId) clearInterval(state.timerId);
  if(!state.finished && state.paketKey){
    if(!confirm('Ujian belum selesai. Yakin ingin kembali ke beranda? Progres akan hilang.')) return;
  }
  state = {paketKey:null, paket:null, namaSiswa:'', kelas:'', qIndex:0, answers:{}, timeLeft:0, timerId:null, finished:false, result:null};
  renderHome();
}

if (REQUIRE_ACCESS_CODE && SHEET_WEBHOOK_URL) {
  renderGate(false);
} else {
  renderHome();
}
</script>
</body>
</html>
