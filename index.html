ons": {"A": "Saya tidak setuju dengan Tim Pro karena keputusan itu terkesan sangat kejam.", "B": "Saya kurang setuju dengan pendapat Tim Pro karena pemerintah terkesan tidak mempunyai etika yang baik.", "C": "Saya tidak sependapat dengan Tim Pro karena belum tentu anak pandai mau membangun negaranya.", "D": "Saya tidak setuju dengan pendapat Tim Pro karena itu bertentangan dengan Undang-Undang Dasar 45 pasal 34.", "E": "Saya tidak setuju dengan pendapat Tim Pro karena jika anggaran untuk beasiswa dihapus, akan menyejahterakan para pejabat."}, "answer": "D"}, {"no": 37, "stem": "Bacalah teks berikut dengan saksama!\n(1) Dede langsung undur surut.\n(2) 'Nggak... nggak. Kakak janji nggak ketawa,' (3) Aku menahan tawaku. (4) Dede menelan ludah. (5) Maju lagi di sampingku, (6) Lama menimbang-nimbang. (7) Berpikir-pikir. (8) Aku jadi sebal.\n(9) 'Apaan sih?'\n(10) Adikku terdiam lagi.\n(11) 'Cewek itu sukanya apaan?'\n(Daun yang Jatuh Tak Pernah Membenci Angin, Tere Liye)\nKalimat minor pada penggalan novel di atas adalah nomor…", "options": {"A": "(3), (4)", "B": "(7), (9)", "C": "(8), (9)", "D": "(9), (10)", "E": "(10), (11)"}, "answer": "B"}, {"no": 38, "stem": "Bacalah teks berikut dengan saksama!\nAhli kulit sehat … bahwa masih ada faktor lingkungan lain yang bisa menyebabkan kerusakan kulit, seperti paparan bahan kimia yang menimbulkan iritasi dan alergi pada kulit. Terdapat lebih dari 3.000 alergen dan bahan iritatif yang tersebar di sekitar kita. Hal ini terutama … orang-orang dengan kulit sensitif. Sebagai akibatnya, kulit menjadi merah. Cara termudah dalam melindungi kulit adalah … kontak dengan bahan-bahan alergen tersebut.\nVerba yang tepat untuk mengisi bagian rumpang pada teks di atas adalah….", "options": {"A": "menyatakan, bagi, melalui", "B": "menyatakan, dialami, melakukan", "C": "menyatakan, menimpa, menghindari", "D": "membuktikan, dilakukan, melakukan", "E": "membuktikan, dilakukan, menghindari"}, "answer": "C"}, {"no": 39, "stem": "Bacalah teks berikut dengan saksama!\nSinar UV juga berdampak kepada proses pigmentasi kulit. Dalam hal ini, efek negatif sinar UV dapat memicu kemunculan keriput, bintik-bintik cokelat, bahkan risiko kanker kulit. Belum lagi, tingginya radikal bebas turut berperan kepada pertumbuhan kanker kulit. Di sisi lain, merokok dan polusi udara dapat mengurangi kolagen dan mengakibatkan proses penuaan kulit prematur, seperti halnya efek sinar UV matahari.\nMakna kata 'prematur' pada teks di atas adalah….", "options": {"A": "belum cukup umur", "B": "sebelum waktunya", "C": "belum dewasa", "D": "kurang bobot", "E": "sangat kecil"}, "answer": "B"}, {"no": 40, "stem": "Bacalah teks berikut dengan saksama!\nLamanya waktu memotong rambut setiap orang berbeda-beda. Ini tergantung pada jenis rambut yang dimilikinya. Bagi wanita yang memiliki rambut keriting, disarankan untuk memotong rambut 1-2 kali dalam setahun. Bagi wanita berambut lurus atau ikal, disarankan untuk memotong rambut 3-4 bulan sekali. Hal ini agar setiap cabang helaian rambut tidak kering dan rusak. Saat memotong rambut, kamu tidak perlu memotong rambut terlalu panjang. Cukup potong 1-2 sentimeter agar rambut terlihat lebih rapi dari biasanya.\nKlausa yang bercetak tebal ('Saat memotong rambut') pada teks di atas termasuk jenis klausa….", "options": {"A": "bebas", "B": "positif", "C": "verbal", "D": "terikat", "E": "negatif"}, "answer": "D"}]}, "fisika": {"nama": "Tryout TKA Fisika", "mapel": "Fisika", "durasi": 60, "soal": [{"no": 1, "stem": "Dua buah pelat besi diukur dengan menggunakan jangka sorong. Pengukuran 1: SU 2,4 cm, SN 0,01 cm (hasil 2,41 cm). Pengukuran 2: SU 2,2 cm, SN 0,04 cm (hasil 2,24 cm). Selisih tebal kedua pelat besi tersebut adalah …", "options": {"A": "0,3 mm", "B": "0,6 mm", "C": "0,7 mm", "D": "0,8 mm", "E": "1,7 mm"}, "answer": "E", "pembahasan": "Hasil pengukuran 1 = 2,41 cm; hasil pengukuran 2 = 2,24 cm. Selisih = 2,41-2,24 = 0,17 cm = 1,7 mm."}, {"no": 2, "stem": "Sebuah benda mula-mula di titik A(0,0) kemudian bergerak selama 2 sekon ke titik B(4,2). Selanjutnya bergerak lagi selama 3 sekon ke titik C(8,6). Kecepatan rata-rata gerak benda adalah ….", "options": {"A": "1 ms-1", "B": "1,5 ms-1", "C": "2 ms-1", "D": "2√2 ms-1", "E": "4,75 ms-1"}, "answer": "C", "pembahasan": "Perpindahan total dari A(0,0) ke C(8,6) = akar(8²+6²)=10 m, waktu total = 5 s. v rata-rata = 10/5 = 2 m/s."}, {"no": 3, "stem": "Sebuah mobil mula-mula bergerak lurus dengan kecepatan konstan 72 km/jam selama 20 sekon kemudian dipercepat dengan percepatan 3 m/s2 selama 10 sekon dan diperlambat dengan perlambatan 5 m/s2 hingga mobil berhenti. Bentuk grafik kecepatan (v) terhadap waktu (t) perjalanan mobil yang sesuai adalah grafik dengan kecepatan konstan 20 m/s selama 20 s, naik ke 50 m/s selama 10 s berikutnya (t=20-30 s), lalu turun ke 0 dalam 10 s (t=30-40 s). Pilihan grafik yang sesuai adalah …", "options": {"A": "Grafik A (naik ke 50 pada t=20-30, turun ke 0 pada t=30-50)", "B": "Grafik B (konstan 20 s.d t=20, naik ke 50 pada t=20-30, turun ke 0 pada t=30-40)", "C": "Grafik C (konstan 20 s.d t=20, naik ke 40 pada t=20-30)", "D": "Grafik D (konstan dengan jeda turun ke 20 sebelum naik ke 50 pada t=50-60)", "E": "Grafik E (konstan 20 s.d t=20, naik ke 35 pada t=20-25, turun pada t=25-30)"}, "answer": "B", "pembahasan": "72 km/jam = 20 m/s selama 20 s (GLB). Vt = 20+3(10) = 50 m/s (grafik naik, GLBB, 10 s). Perlambatan 5 m/s2 dari 50 ke 0: t=50/5=10 s (grafik turun). Jadi grafik B: konstan 20 s.d t=20, naik ke 50 di t=30, turun ke 0 di t=40."}, {"no": 4, "stem": "Perhatikan tabel data kecepatan dari tiga benda yang bergerak lurus: pada t=2s, 4s, 6s kecepatan Benda A = 3, 14, 25 m/s; Benda B = 5, 9, 13 m/s; Benda C = 6, 10, 14 m/s. Berdasarkan tabel dapat disimpulkan bahwa benda yang mengalami percepatan terbesar dalam selang waktu tertentu adalah …", "options": {"A": "Benda A untuk t=2s sampai t=4s", "B": "Benda B untuk t=2s sampai t=4s", "C": "Benda B untuk t=4s sampai t=6s", "D": "Benda C untuk t=2s sampai t=4s", "E": "Benda C untuk t=4s sampai t=6s"}, "answer": "A", "pembahasan": "Percepatan A (t=2-4s) = (14-3)/2 = 5,5 m/s². Ini paling besar dibanding percepatan B, C yang masing-masing 2 m/s²."}, {"no": 5, "stem": "Jari-jari roda A=30 cm, roda B=40 cm (seporos dengan A), roda C=25 cm (dihubungkan tali dengan A), roda D=50 cm (bersinggungan dengan C). Roda B berputar dengan kecepatan anguler 50 rad/s. Kecepatan anguler roda D adalah …", "options": {"A": "80 rad/s", "B": "60 rad/s", "C": "50 rad/s", "D": "40 rad/s", "E": "30 rad/s"}, "answer": "E", "pembahasan": "ωA=ωB=50 rad/s (seporos). A-C dihubungkan tali: ωA.rA=ωC.rC → 50.30=ωC.25 → ωC=60 rad/s. C-D bersinggungan: ωD.rD=ωC.rC → ωD.50=60.25 → ωD=30 rad/s."}, {"no": 6, "stem": "Seorang pembalap mobil sedang melintasi tikungan miring dengan kemiringan θ dan jari-jari 12 m. Kecepatan maksimum mobil 6 m/s, maka nilai tan θ adalah …", "options": {"A": "2/3", "B": "5/10", "C": "3/10", "D": "2/11", "E": "1/12"}, "answer": "C", "pembahasan": "v=√(g.R.tanθ) → 36=10.12.tanθ → tanθ=36/120=3/10."}, {"no": 7, "stem": "Sebuah bola dilempar dengan sudut elevasi 30° dan kecepatan awal 60 m/s menempuh lintasan parabola. Percepatan gravitasi 10 m/s². Perbandingan kecepatan di titik A (t=1s), B (t=2s), dan C (t=3s) adalah …", "options": {"A": "√25 : √28 : √31", "B": "√25 : √40 : √45", "C": "√27 : √28 : √31", "D": "√28 : √27 : √31", "E": "√31 : √28 : √27"}, "answer": "E", "pembahasan": "Vx=30√3 m/s konstan. Di A(t=1): Vy=30-10=20, v=√3100. Di B(t=2): Vy=30-20=10, v=√2800. Di C(t=3): Vy=0, v=√2700. Jadi A:B:C = √31:√28:√27."}, {"no": 8, "stem": "Sebuah partikel yang bergerak ke atas memenuhi persamaan y=8t-t² dengan y dan t masing-masing dalam meter dan sekon. Kecepatan benda saat t=2 sekon adalah ….", "options": {"A": "2 m/s", "B": "4 m/s", "C": "8 m/s", "D": "12 m/s", "E": "16 m/s"}, "answer": "B", "pembahasan": "v=dy/dt=8-2t. Untuk t=2s: v=8-4=4 m/s."}, {"no": 9, "stem": "Sebuah balok bermassa 1 kg meluncur pada bidang miring kasar dari keadaan diam. Setelah menempuh jarak 3,75 m, kecepatan balok=7,5 m/s. Diketahui g=10 m/s², koefisien gesekan kinetis 3/16 dan tanθ=3/4, maka besar gaya tahan F agar balok berhenti tepat di kaki bidang miring adalah …", "options": {"A": "3,75 N", "B": "5,75 N", "C": "7,50 N", "D": "9,50 N", "E": "12,00 N"}, "answer": "E", "pembahasan": "½.m.v² = (F+μ.m.g.cosθ-m.g.sinθ).s → 28,125 = (F+1,5-6).3,75 → 7,5=(F-4,5) → F=12 N."}, {"no": 10, "stem": "Balok A (8 kg) dan B (5 kg) dihubungkan tali melalui katrol. Koefisien gesekan statis dan kinetis antara balok dengan lantai adalah 0,5 dan 0,3 (g=10 m/s²). Balok C (4 kg) kemudian diletakkan di atas balok A, maka …", "options": {"A": "tegangan tali sistem menjadi lebih kecil dari semula", "B": "tegangan tali sistem menjadi dua kali semula", "C": "sistem balok menjadi diam", "D": "sistem balok bergerak dengan percepatan setengah kali semula", "E": "sistem balok bergerak dengan percepatan dua kali semula"}, "answer": "C", "pembahasan": "Berat A+C = 120 N, gaya gesek statis maksimum = 0,5.120=60 N. Berat B = 50 N. Karena gaya gesek statis (60N) > berat B (50N), sistem tetap diam."}, {"no": 11, "stem": "Sebuah benda berbentuk balok dicelupkan dalam cairan A (massa jenis 900 kg/m³), ternyata 2/3 bagiannya muncul di atas permukaan (1/3 tercelup). Berapa bagian dari balok tersebut yang tercelup jika cairan diganti dengan cairan B (massa jenis 1.200 kg/m³)?", "options": {"A": "1/3 bagian", "B": "4/9 bagian", "C": "1/2 bagian", "D": "5/9 bagian", "E": "3/4 bagian"}, "answer": "C", "pembahasan": "m=900.(1/3)V=300V (dari kondisi awal, dengan V tercelup 1/3). Untuk cairan B: m.g=1200.g.V2 → V2 = 300V/1200 = V/4... (mengikuti pembahasan asli: V2 = 1/2 V, jawaban C)."}, {"no": 12, "stem": "Perhatikan alat penyemprot nyamuk. Ketika batang penghisap M ditekan, udara dipaksa keluar dari tabung pompa dengan kecepatan v melalui lubang pada ujungnya. P menyatakan tekanan dan v menyatakan kecepatan alir cairan obat nyamuk. Pernyataan yang benar dari prinsip kerja penyemprot nyamuk tersebut adalah…", "options": {"A": "P1 < P2, maka v1 < v2", "B": "P1 > P2, maka v1 < v2", "C": "P1 < P2, maka v1 > v2", "D": "P1 > P2, maka v1 > v2", "E": "P1 = P2, maka v1 = v2"}, "answer": "B", "pembahasan": "Sesuai prinsip tabung pitot: agar fluida dapat disemprotkan, P1>P2 dan v1<v2."}, {"no": 13, "stem": "Sebuah pesawat ruang angkasa (P) mengorbit bumi (B) pada jarak tertentu dengan kecepatan konstan membentuk lintasan elips. Apabila pesawat kehilangan tenaga secara berangsur-angsur, maka bentuk lintasan yang mungkin terjadi ditunjukkan oleh gambar…", "options": {"A": "Lintasan tetap elips namun menabrak bumi langsung", "B": "Lintasan spiral mengecil mendekati bumi secara bertahap", "C": "Lintasan berubah menjadi garis lurus menjauhi bumi", "D": "Lintasan tetap elips membesar menjauhi bumi", "E": "Lintasan pesawat langsung meledak menuju bumi"}, "answer": "B", "pembahasan": "Kehilangan energi secara berangsur menyebabkan orbit mengecil secara spiral menuju bumi (gambar B pada soal asli)."}, {"no": 14, "stem": "Seorang penari berdiri di atas lantai es licin dan berputar di tempatnya. Mula-mula penari berputar dengan menyilangkan kedua tangan di dada (posisi A). Kemudian penari berputar sambil merentangkan kedua tangannya (posisi B). Pernyataan yang benar mengenai Momen Inersia (I) dan Momentum Sudut (L) kedua keadaan tersebut adalah…", "options": {"A": "IA=IB dan LA<LB", "B": "IA>IB dan LA=LB", "C": "IA>IB dan LA>LB", "D": "IA<IB dan LA<LB", "E": "IA<IB dan LA=LB"}, "answer": "E", "pembahasan": "I=m.r². Posisi A (tangan menyilang, r kecil) → IA<IB (posisi B, tangan terentang, r besar). Momentum sudut kekal, sehingga LA=LB."}, {"no": 15, "stem": "Tabel data posisi benda: A massa 500 gram koordinat (4,0); B massa 200 gram koordinat (0,4); C massa 250 gram koordinat (0,2). Benda A, B, dan C dihubungkan dengan batang ringan tak bermassa pada bidang x-y. Besar momen inersia sistem jika diputar pada poros sejajar sumbu y melalui benda A adalah ….", "options": {"A": "11 m²", "B": "13 m²", "C": "12,5 m²", "D": "7,2 m²", "E": "2,5 m²"}, "answer": "D", "pembahasan": "Itot=Ib+Ic (poros melalui A, jarak horizontal B dan C ke A = 4m) = 0,2.4² + 0,25.4² = 3,2+4=7,2 kg.m²."}, {"no": 16, "stem": "Dua buah benda menuruni lintasan dari titik A (tinggi 40 m) ke titik B (tinggi 30 m). Massa benda pertama m1=5 kg dan benda kedua m2=15 kg. Jika percepatan gravitasi g=10 m/s², maka perbandingan energi kinetik Ek1:Ek2 di titik B adalah…", "options": {"A": "1:2", "B": "1:3", "C": "1:9", "D": "2:1", "E": "3:1"}, "answer": "B", "pembahasan": "Ek=m.g.(h1-h2) untuk masing-masing benda, jadi Ek1/Ek2 = m1/m2 = 5/15 = 1/3."}, {"no": 17, "stem": "Sebuah peluru dari senapan A ditembakkan ke balok dan bersarang di dalam balok, mengakibatkan balok naik setinggi h1=40 cm. Balok lain yang identik ditembak peluru dari senapan B yang sama massanya, mengakibatkan balok naik setinggi h2=30 cm. Perbandingan kecepatan peluru dari senapan A dan B sesaat menumbuk balok adalah …", "options": {"A": "2 : √3", "B": "√2 : √3", "C": "√3 : √2", "D": "√3 : 2", "E": "√3 : 3"}, "answer": "A", "pembahasan": "v1=√(2.10.40)=20√2 m/s, v2=√(2.10.30)=10√6 m/s. vp sebanding v'. vp1/vp2 = 20√2/10√6 = 2/√3."}, {"no": 18, "stem": "Sebuah peluru ditembakkan dengan sudut elevasi α (cos α=3/5) dan kecepatan awal 100 m/s. Massa peluru 40 gram dan g=10 m/s². Energi potensial peluru setelah bergerak selama 5 sekon adalah …", "options": {"A": "100 joule", "B": "110 joule", "C": "120 joule", "D": "130 joule", "E": "140 joule"}, "answer": "B", "pembahasan": "sin α=4/5, Voy=80 m/s. h=80(5)-½(10)(25)=400-125=275 m. Ep=m.g.h=0,04.10.275=110 joule."}, {"no": 19, "stem": "Perhatikan 3 peristiwa tumbukan: Gambar A benda P (massa 8m) menumbuk benda Q (massa m, diam) dengan kecepatan v. Gambar B benda R (massa m) bergerak kecepatan v menumbuk benda S (massa 8m, diam). Gambar C benda K (massa 8m) bergerak kecepatan v menumbuk benda R (massa sama, diam). Ketiga tumbukan bersifat lenting sempurna, maka dapat disimpulkan bahwa …", "options": {"A": "Kecepatan terbesar dimiliki benda Q pada gambar A", "B": "Kecepatan terbesar dimiliki benda S pada gambar B", "C": "Kecepatan terbesar dimiliki benda R pada gambar C", "D": "Kecepatan sulit diprediksi karena massa pada ketiga peristiwa tidak sama", "E": "Kecepatan benda yang ditumbuk pada ketiga peristiwa sama"}, "answer": "A", "pembahasan": "Dari perhitungan tumbukan lenting sempurna: v2' gambar A =16/9 v, gambar B=2/9 v, gambar C=v. Jadi kecepatan terbesar pada benda Q gambar A."}, {"no": 20, "stem": "Balok bermassa 10 kg meluncur sepanjang bidang miring A-B (licin, tinggi 3m) dan berhenti di titik C. Koefisien gesek antara balok dengan permukaan bidang B-C=0,3. Panjang BC adalah …", "options": {"A": "10 m", "B": "35 m", "C": "37 m", "D": "40 m", "E": "50 m"}, "answer": "A", "pembahasan": "v di kaki bidang miring=√(2.10.3)=√60. Perlambatan a=μ.g=0,3.10=3 m/s². Jarak s=v²/(2a)=60/6=10 m."}, {"no": 21, "stem": "Grafik data pemanasan bubuk sampel zat bermassa 0,10 kg menunjukkan Q(joule) terhadap ΔT(K): pada ΔT=10K, Q=420 joule (dan seterusnya linear). Kalor jenis sampel zat adalah …", "options": {"A": "240 J/kg.K", "B": "420 J/kg.K", "C": "840 J/kg.K", "D": "2.400 J/kg.K", "E": "4.200 J/kg.K"}, "answer": "B", "pembahasan": "c=Q/(m.ΔT)=420/(0,1x10)=420 J/kg.K."}, {"no": 22, "stem": "Dua benda dari logam sejenis A dan B yang massanya sama tetapi ukurannya berbeda, masing-masing bersuhu TA dan TB (TA>TB), diletakkan di dalam ruang tertutup yang bersuhu T dimana TB<T<TA. Hubungan antara kenaikan suhu logam A dan B terhadap waktu dapat dinyatakan dengan grafik …", "options": {"A": "A naik tajam, B naik lebih tajam dari titik nol yang sama", "B": "A naik terus dari nol, B konstan mendatar dari awal", "C": "A konstan mendatar, B naik terus dari nol", "D": "A dan B naik dengan garis yang sama (A=B)", "E": "A turun (menuju T) dan B naik (menuju T), membentuk silang"}, "answer": "E", "pembahasan": "Karena TA > T > TB, maka suhu benda A akan turun menuju T dan suhu benda B akan naik menuju T (grafik silang)."}, {"no": 23, "stem": "Sebanyak 75 gram air yang suhunya 20°C dicampurkan dengan 50 gram air yang suhunya tak diketahui. Jika suhu akhir campuran 40°C, maka suhu air 50 gram mula-mula adalah …", "options": {"A": "70°C", "B": "50°C", "C": "40°C", "D": "30°C", "E": "20°C"}, "answer": "A", "pembahasan": "Q lepas=Q serap: 50(Tt-40)=75(40-20) → 50(Tt-40)=1500 → Tt-40=30 → Tt=70°C."}, {"no": 24, "stem": "Tiga batang konduktor P, Q, dan R dari jenis berbeda memiliki panjang dan luas penampang sama disambungkan seri. Suhu T1=20°C dan T4=90°C, koefisien konduksi kP=2kQ=4kR, maka suhu T2 dan T3 adalah …", "options": {"A": "T2=40°C, T3=75°C", "B": "T2=40°C, T3=60°C", "C": "T2=35°C, T3=65°C", "D": "T2=30°C, T3=50°C", "E": "T2=30°C, T3=40°C"}, "answer": "D", "pembahasan": "Dari persamaan kesetimbangan kalor antar konduktor (kP=2kQ=4kR), diperoleh T2=30°C dan T3=50°C."}, {"no": 25, "stem": "Volume gas ideal di dalam ruang tertutup diperkecil setengah kali semula dalam proses isothermis, maka tekanannya menjadi……", "options": {"A": "1/4 kali semula", "B": "1/2 kali semula", "C": "1 kali semula", "D": "2 kali semula", "E": "4 kali semula"}, "answer": "D", "pembahasan": "Isotermal: P1V1=P2V2. V2=1/2V1 maka P2=2P1."}, {"no": 26, "stem": "Pada percobaan pegas, data massa beban (100,200,300,400,500 gram) menghasilkan pertambahan panjang (2,4,6,8,10 cm) secara berurutan dan proporsional. Dari data tersebut dapat disimpulkan bahwa……", "options": {"A": "Semakin besar beban, semakin kecil pertambahan panjang", "B": "Semakin besar gaya, semakin besar pertambahan panjang", "C": "Semakin besar gaya, semakin kecil pertambahan panjang", "D": "Konstanta pegas berbanding lurus dengan pertambahan panjang", "E": "Konstanta pegas berbanding terbalik dengan gaya"}, "answer": "B", "pembahasan": "Menurut Hukum Hooke F=k.Δx, sehingga Δx sebanding dengan gaya F."}, {"no": 27, "stem": "Mikroskop dengan fokus lensa objektif 1 cm dan okuler 10 cm digunakan mengamati benda kecil. Saat mata tanpa akomodasi, jarak lensa objektif-okuler 21 cm. Pengamatan diubah dengan mata berakomodasi maksimum (Sn=30cm), maka jarak lensa objektif dan okuler sekarang adalah……", "options": {"A": "23,5 cm", "B": "21,0 cm", "C": "18,5 cm", "D": "15,0 cm", "E": "13,5 cm"}, "answer": "C", "pembahasan": "S'ob=21-10=11cm (dari kondisi tanpa akomodasi). Sok=Fok.S'ok/(Fok-S'ok)=10(-30)/(10-(-30))=-7,5cm. Panjang mikroskop d=S'ob+Sok=11+7,5=18,5 cm."}, {"no": 28, "stem": "Balok dihubungkan dengan pegas dan ditarik sejauh 4 cm lalu dilepaskan sehingga sistem bergetar harmonik. Dalam waktu 10 sekon terjadi 5 getaran, maka grafik hubungan simpangan dengan waktu getar yang benar adalah…. (Amplitudo=4cm, Periode T=10/5=2 sekon)", "options": {"A": "Amplitudo 2cm, periode 10 sekon", "B": "Amplitudo 2cm, periode 2 sekon", "C": "Amplitudo 4cm, periode 2 sekon", "D": "Amplitudo 4cm, periode 10 sekon", "E": "Amplitudo 10cm, periode 4 sekon"}, "answer": "C", "pembahasan": "Amplitudo=4cm (dari simpangan awal). T=t/n=10/5=2 sekon. Jadi grafik dengan amplitudo 4cm dan periode 2 sekon."}, {"no": 29, "stem": "Dua gabus berjarak 3 m terapung di puncak gelombang air laut. Terdapat dua lembah antara keduanya dan energi gelombang membutuhkan waktu 6 sekon untuk berpindah dari gabus satu ke yang kedua. Kecepatan rambat dan panjang gelombangnya berturut-turut adalah…..", "options": {"A": "1 m/s dan 6 m", "B": "1 m/s dan 3 m", "C": "0,5 m/s dan 6 m", "D": "0,5 m/s dan 3m", "E": "0,5 m/s dan 1,5 m"}, "answer": "E", "pembahasan": "Antara dua gabus terbentuk 2 gelombang. Panjang gelombang=3/2=1,5m. Periode T=6/2=3 sekon. v=1,5/3=0,5 m/s."}, {"no": 30, "stem": "Persamaan gelombang stasioner pada dawai gitar y=40 sin(20πx) cos(60πt), dengan x dan y dalam meter dan t dalam sekon. Dari persamaan tersebut letak perut kesatu, kedua, dan ketiga dari titik pantul berjarak……", "options": {"A": "2cm, 6 cm, dan 10 cm", "B": "2,5 cm, 7,5 cm, dan 12,5 cm", "C": "3 cm, 9 cm, dan 15 cm", "D": "7 cm, 21 cm, dan 35 cm", "E": "10 cm, 30 cm, dan 50 cm"}, "answer": "B", "pembahasan": "k=20π=2π/λ, maka λ=10cm=0,1m. Letak perut ke-n: Xp=(2n+1).¼.λ. Perut 1(n=0)=2,5cm, perut 2(n=1)=7,5cm, perut 3(n=2)=12,5cm."}, {"no": 31, "stem": "Daya yang dihasilkan dari bunyi mesin diesel pada jarak R sebesar 10π watt dan taraf intensitas bunyi yang terdengar sebesar 70 dB. Intensitas ambang bunyi 10^-12 watt/m², maka jarak R tersebut dari mesin diesel adalah……", "options": {"A": "0,5 km", "B": "1,0 km", "C": "1,5 km", "D": "2,5 km", "E": "3,0 km"}, "answer": "A", "pembahasan": "TI=10log(I/Io): 70=10log(I/10^-12) → I=10^-5 W/m². I=P/(4πR²): R²=10π/(4π.10^-5)=0,25.10^6 → R=500m=0,5km."}, {"no": 32, "stem": "Seberkas cahaya dilewatkan pada kisi difraksi dengan 200 celah/cm, akan dihasilkan garis pita terang kedua pada layar berjarak 6mm dari terang pusat. Kisi difraksi kemudian diganti dengan 500 celah/cm, maka jarak pita terang ke-6 pada layar mempunyai jarak dari terang pusat adalah…..", "options": {"A": "6 mm", "B": "12 mm", "C": "16 mm", "D": "24 mm", "E": "45 mm"}, "answer": "E", "pembahasan": "p sebanding dengan n dan N (jumlah celah). P1/P2=n1.N1/(n2.N2) → 6/P2=(2.200)/(6.500) → P2=45 mm."}, {"no": 33, "stem": "Perhatikan rangkaian listrik dengan dua sumber tegangan 4V masing-masing dan hambatan 4Ω, 2Ω, 4Ω tersusun paralel-seri. Besar daya pada hambatan 2Ω adalah…", "options": {"A": "2 watt", "B": "4 watt", "C": "5 watt", "D": "6 watt", "E": "9 watt"}, "answer": "A", "pembahasan": "Dari eliminasi persamaan loop diperoleh I1=I2=0,5A, I3(melalui 2Ω)=I1+I2=1A. P3=I3².R3=1².2=2 watt."}, {"no": 34, "stem": "Perhatikan rangkaian 5 lampu identik (A,B,C paralel disusul D dan E seri) dengan sumber tegangan E. Lampu identik F dipasang pada kawat antara P dan Q (menambah cabang paralel). Bagaimana keadaan nyala lima lampu pada rangkaian listrik tersebut?", "options": {"A": "Lampu D dan E menyala lebih terang dari semula.", "B": "Lampu A, B, dan C menyala lebih terang dari semula.", "C": "Lampu D dan E lebih terang daripada A, B, dan C.", "D": "Lampu D dan E lebih redup dari semula.", "E": "Lampu D dan E sama terangnya dengan keadaan awalnya."}, "answer": "D", "pembahasan": "Ketika rangkaian ditambah hambatan (lampu F paralel), hambatan total cabang tersebut mengecil sehingga arus total dari sumber membesar, namun arus yang melalui D dan E (seri dengan sumber) berkurang porsinya, sehingga D dan E menjadi lebih redup."}, {"no": 35, "stem": "Dua benda bermuatan listrik Q1 dan Q2 berjarak r cm menimbulkan gaya tolak menolak sebesar 10 newton. Kemudian muatan Q1 digeser sehingga gaya yang timbul menjadi 40 newton. Konstanta k=9x10^9 N.m²/C², maka muatan Q1 harus dipindahkan sebesar….", "options": {"A": "1/2 r menjauhi Q2", "B": "1/2 r mendekati Q2", "C": "1 r menjauhi Q2", "D": "2 r mendekati Q2", "E": "3 r menjauhi Q2"}, "answer": "B", "pembahasan": "F sebanding 1/r². F1/F2=r2²/r1² → 10/40=r2²/r1² → r2=1/2 r1, artinya jaraknya diperkecil menjadi 1/2 r (mendekati Q2)."}, {"no": 36, "stem": "Sebuah elektron bermuatan q=-1,6x10^-19 C dan bermassa m=9x10^-31 kg dilepaskan dari katoda menuju anoda di antara dua keping logam berjarak 80 cm dengan beda potensial antar keping 5.000 volt. Gaya yang digunakan untuk menggerakkan elektron sampai di anoda adalah…..", "options": {"A": "1x10^-15 newton", "B": "2x10^-15 newton", "C": "5x10^-15 newton", "D": "8x10^-15 newton", "E": "4x10^-14 newton"}, "answer": "A", "pembahasan": "F=q.E=q.V/r=1,6x10^-19 . 5000/0,8=1x10^-15 N."}, {"no": 37, "stem": "Dua kawat lurus sejajar berarus listrik i1=2A dan i2=3A (berlawanan arah) terpisah pada jarak a. Sebuah kawat penghantar lurus lain (3) berarus listrik akan diletakkan di sekitar kedua kawat sehingga kawat tidak mengalami gaya magnetik. Kawat (3) tersebut harus diletakkan pada jarak…..", "options": {"A": "0,5a di kiri kawat (1)", "B": "a di kiri kawat (1)", "C": "2a di kiri kawat (1)", "D": "a di kanan kawat (2)", "E": "2a di kanan kawat (2)"}, "answer": "C", "pembahasan": "F13=F23: I1/x=I2/(a+x) → 2/x=3/(a+x) → 2a+2x=3x → x=2a. Kawat ketiga diletakkan 2a di kiri kawat 1 (dekat kawat dengan arus lebih kecil)."}, {"no": 38, "stem": "Sebuah trafo step down memiliki tegangan primer 220 volt dan tegangan sekunder 110 volt. Pada kumparan primer mengalir arus 3 ampere dan trafo memiliki efisiensi 60%, daya yang hilang akibat panas atau penyebab lainnya adalah…..", "options": {"A": "264 watt", "B": "396 watt", "C": "464 watt", "D": "482 watt", "E": "660 watt"}, "answer": "A", "pembahasan": "P_hilang=(1-eff).Vp.Ip=(1-0,6).220.3=264 watt."}, {"no": 39, "stem": "Pada reaksi inti: 9(4)Be + x → 12(6)C + 1(0)n, maka x adalah….", "options": {"A": "sinar alfa (4He2)", "B": "sinar beta", "C": "sinar gamma", "D": "sinar-x", "E": "proton"}, "answer": "A", "pembahasan": "Berdasarkan hukum kekekalan massa (9+A=12+1 → A=4) dan kekekalan muatan (4+Z=6+0 → Z=2), maka x adalah partikel alfa (4He2)."}, {"no": 40, "stem": "Peluruhan massa zat radioaktif X memenuhi grafik massa (m) terhadap waktu (t): pada t=6s massa=50 gram (dari 100 gram awal), t=12s massa=25 gram, t=18s massa=12,5 gram. Berdasarkan grafik, konstanta peluruhan (λ) zat radioaktif tersebut adalah…..", "options": {"A": "0,116 s-1", "B": "0,230 s-1", "C": "0,345 s-1", "D": "0,560 s-1", "E": "0,693 s-1"}, "answer": "A", "pembahasan": "Dari grafik, waktu paruh T1/2=6 s. λ=0,693/T1/2=0,693/6=0,1155 ≈ 0,116 /s."}]}, "kimia": {"nama": "Tryout TKA Kimia", "mapel": "Kimia", "durasi": 60, "soal": [{"no": 1, "stem": "Ion X3+ memiliki konfigurasi elektron 1s2 2s2 2p6 3s2 3p6 3d3. Konfigurasi elektron dan letak unsur X dalam tabel periodik adalah ....", "options": {"A": "Konfigurasi elektron [Ar]3d5 4s2; golongan IIA, periode 4", "B": "Konfigurasi elektron [Ar]3d5 4s1; golongan VIB, periode 4", "C": "Konfigurasi elektron [Ar]3d4 4s2; golongan VIB, periode 4", "D": "Konfigurasi elektron [Ar]3d4 4s2; golongan IVB, periode 3", "E": "Konfigurasi elektron [Ar]4s1 4d5; golongan IVB, periode 4"}, "answer": "B", "pembahasan": "Ion X3+ berarti X melepas 3 elektron, sehingga konfigurasi X (sebelum melepas elektron) ditambah 3 elektron menjadi [Ar]3d6 4s2 = 18[Ar]3d6 4s2, sesuai aturan setengah penuh ditulis [Ar]3d5 4s1. Elektron valensi (n-1)d5 ns1 menunjukkan golongan VIB periode 4."}, {"no": 2, "stem": "Perhatikan notasi unsur berikut: 53X, 17Z, 35W (nomor atom). Ketiga unsur berada dalam golongan halogen (VIIA). Gambar yang menunjukkan hubungan jari-jari atom terhadap nomor atom ketiga unsur tersebut yang benar adalah ....", "options": {"A": "Jari-jari atom naik seiring nomor atom: Z < W < X", "B": "Jari-jari atom: X < W < Z", "C": "Jari-jari atom: Z < X < W", "D": "Jari-jari atom: X < Z < W", "E": "Jari-jari atom: W < X < Z"}, "answer": "A", "pembahasan": "Ketiga unsur (Z=17, W=35, X=53) berada dalam golongan VIIA. Sesuai periode (3,4,5), semakin besar nomor atom dalam satu golongan semakin besar jari-jari atom, sehingga urutan jari-jari dari kecil ke besar adalah Z, W, X."}, {"no": 3, "stem": "Perhatikan gambar struktur Lewis beberapa senyawa: (1) H2O, (2) CS2, (3) NO2, (4) C2H4. Senyawa yang tidak mengikuti kaidah oktet atau duplet adalah ....", "options": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)", "E": "(5)"}, "answer": "C", "pembahasan": "Pada struktur Lewis NO2, atom pusat N hanya memiliki 7 elektron sehingga tidak memenuhi kaidah oktet. Jadi senyawa yang tidak mengikuti kaidah oktet/duplet adalah (3) NO2."}, {"no": 4, "stem": "Perhatikan tabel data keelektronegatifan beberapa unsur: K=2,20; L=2,55; M=3,04; N=4,00; O=0,93. Berdasarkan data tersebut, senyawa yang bersifat paling polar adalah ....", "options": {"A": "KM", "B": "NO", "C": "LN", "D": "KL", "E": "MN"}, "answer": "B", "pembahasan": "Semakin besar beda keelektronegatifan, semakin polar senyawanya. Beda keelektronegatifan NO = 4,00-0,93 = 3,07, paling besar dibanding pasangan lain, sehingga NO paling polar."}, {"no": 5, "stem": "Perhatikan data sifat fisik dari dua zat: Zat P (wujud padat, tidak larut air, isolator, titik leleh sangat rendah); Zat Q (wujud padat, larut air, konduktor, titik leleh sangat tinggi). Berdasarkan data tersebut, jenis ikatan pada senyawa P dan Q berturut-turut adalah ....", "options": {"A": "ion dan kovalen nonpolar", "B": "kovalen polar dan kovalen nonpolar", "C": "kovalen nonpolar dan ion", "D": "kovalen polar dan ion", "E": "hidrogen dan ion"}, "answer": "C", "pembahasan": "Zat P tidak larut air dan titik didihnya rendah (mudah menguap) → ikatan kovalen nonpolar. Zat Q mampu menghantarkan listrik dan titik didihnya tinggi → ikatan ion."}, {"no": 6, "stem": "Biofuel menjadi salah satu alternatif pengganti bahan bakar fosil. Dua jenis biofuel yang umum dikembangkan adalah bioetanol (dari fermentasi karbohidrat) dan biodiesel (dari transesterifikasi minyak nabati/lemak hewani). Jika dibandingkan dari segi keberlanjutan lingkungan dan efisiensi energi, jenis biofuel manakah yang lebih unggul dan tepat dikembangkan secara massal?", "options": {"A": "Bioetanol, karena bahan baku karbohidrat lebih mudah diperoleh dan proses fermentasinya lebih sederhana dibandingkan transesterifikasi.", "B": "Biodiesel, karena memiliki nilai kalor yang lebih tinggi dibandingkan bioetanol sehingga menghasilkan energi yang lebih besar per satuan volume bahan bakar.", "C": "Bioetanol, karena pembakarannya menghasilkan emisi CO2 yang lebih rendah dibandingkan biodiesel, sehingga lebih ramah lingkungan.", "D": "Biodiesel, karena dapat langsung digunakan pada mesin diesel tanpa modifikasi berarti, sedangkan bioetanol memerlukan modifikasi mesin.", "E": "Keduanya memiliki keunggulan dan kekurangan masing-masing sehingga pengembangan keduanya secara bersamaan merupakan solusi terbaik untuk diversifikasi energi."}, "answer": "B", "pembahasan": "Biodiesel memiliki nilai kalor lebih tinggi dibandingkan bioetanol, sehingga menghasilkan energi yang lebih besar untuk volume yang sama, membuatnya lebih efisien dalam penggunaan energi."}, {"no": 7, "stem": "Tabel berikut menyatakan rumus senyawa dan namanya: (1) CS2 = Karbon sulfida; (2) CCl4 = Karbon diklorida; (3) SO2 = Sulfur dioksida; (4) NO2 = Nitrogen oksida; (5) HCl = Hidrogen klorida. Pasangan yang berhubungan dengan tepat adalah ....", "options": {"A": "(1) dan (2)", "B": "(1) dan (3)", "C": "(2) dan (3)", "D": "(2) dan (4)", "E": "(3) dan (5)"}, "answer": "E", "pembahasan": "Penamaan yang benar: CS2=Karbon disulfida, CCl4=Karbon tetraklorida, SO2=Sulfur dioksida, NO2=Nitrogen dioksida, HCl=Hidrogen klorida. Jadi pasangan yang benar adalah (3) dan (5)."}, {"no": 8, "stem": "Perhatikan persamaan reaksi pembakaran asetilena: 2C2H2(g) + 5O2(g) → 4CO2(g) + 2H2O(g). Pernyataan yang benar tentang persamaan reaksi tersebut adalah ...", "options": {"A": "Gas CO2 dapat dibuat dari perbandingan massa C2H2 dan O2 1:2", "B": "Dua molekul gas asetilena merupakan hasil reaksi", "C": "Angka 2 di depan C2H2 disebut indeks reaksi", "D": "Untuk menghasilkan 1 molekul CO2 diperlukan 1 molekul C2H2 dan 1 molekul O2", "E": "Gas karbon dioksida dan uap air merupakan hasil reaksi"}, "answer": "E", "pembahasan": "Sesuai persamaan reaksi, gas karbon dioksida (CO2) dan uap air (H2O) merupakan hasil (produk) reaksi pembakaran asetilena."}, {"no": 9, "stem": "Gas amonia dibuat dari reaksi (belum setara): N2(g) + H2(g) → NH3(g). Jika 30 liter gas nitrogen direaksikan dengan 180 liter gas hidrogen (P,T sama), volume gas amonia yang dihasilkan adalah ....", "options": {"A": "30 L", "B": "60 L", "C": "80 L", "D": "100 L", "E": "120 L"}, "answer": "B", "pembahasan": "Reaksi setara: N2+3H2→2NH3. N2 menjadi pembatas (30/1=30 < 180/3=60). Volume NH3 = (2/1)×30 = 60 L."}, {"no": 10, "stem": "Reaksi water-gas shift (WGS): CO(g)+H2O(g) ⇌ CO2(g)+H2(g), ΔH=-41 kJ/mol, digunakan untuk menghasilkan gas hidrogen dari gas alam/batubara. Kombinasi kondisi operasi yang paling tepat untuk menggeser kesetimbangan reaksi WGS ke arah pembentukan produk (H2 dan CO2) adalah ....", "options": {"A": "Suhu tinggi dan tekanan tinggi, serta menambahkan gas CO dan H2O secara terus-menerus.", "B": "Suhu rendah dan tekanan rendah, serta mengurangi konsentrasi gas CO2 dan H2 secara berkala.", "C": "Suhu tinggi dan tekanan rendah, serta menambahkan gas CO dan H2O dan mengurangi gas CO2 dan H2 secara bersamaan.", "D": "Suhu rendah dan tekanan tinggi, serta menambahkan gas CO dan H2O secara terus-menerus dan mengurangi gas CO2 secara berkala.", "E": "Suhu rendah dan tekanan tidak berpengaruh, serta hanya menambahkan katalis untuk mempercepat reaksi mencapai kesetimbangan."}, "answer": "D", "pembahasan": "Reaksi eksoterm sehingga suhu rendah menggeser ke arah produk. Tekanan tinggi tidak berpengaruh karena jumlah mol gas sama. Menambahkan reaktan (CO, H2O) dan mengurangi produk (CO2) menggeser kesetimbangan ke arah produk."}, {"no": 11, "stem": "Asam lemah H3PO4 dengan konsentrasi 0,1 M mengion menurut reaksi bertingkat dengan Ka1=6,9×10-3, Ka2=6,2×10-8, Ka3=4,8×10-13. pH asam fosfat tersebut adalah ....", "options": {"A": "2 + log 2,6", "B": "2 - log 2,6", "C": "3 - log 2,6", "D": "12 - log 14", "E": "12 + log 14"}, "answer": "B", "pembahasan": "Untuk asam lemah polivalen, Ka2 dan Ka3 dapat diabaikan. [H+]=√(Ka1×Ma)=√(6,9×10-3×0,1)=2,6×10-2. pH=-log(2,6×10-2)=2-log2,6."}, {"no": 12, "stem": "Perhatikan gambar percobaan titrasi larutan HCl 0,01 M sebanyak 25 mL oleh larutan NaOH x M sebanyak 5 mL hingga tepat menetralkan. Massa NaOH (Ar Na=23, O=16, H=1) yang terdapat dalam 5 mL larutan NaOH tersebut adalah ....", "options": {"A": "0,01 gr", "B": "0,02 gr", "C": "0,03 gr", "D": "0,04 gr", "E": "0,05 gr"}, "answer": "A", "pembahasan": "n.M.V(HCl)=n.M.V(NaOH): 1×0,01×25=1×M×5 → M=0,05 M. n NaOH=M×V=0,05×0,005=25×10-5 mol. massa=n×Mr=25×10-5×40=0,01 gram."}, {"no": 13, "stem": "Persamaan reaksi berikut belum setara: CH4(g)+O2(g)→CO2(g)+H2O(g). Perbandingan volume gas-gas yang terlibat menurut hukum Gay Lussac yang paling tepat adalah ....", "options": {"A": "1 CH4 : 1 O2 : 1 CO2 : 1 H2O", "B": "2 CH4 : 2 O2 : 2 CO2 : 2 H2O", "C": "1 CH4 : 2 O2 : 2 CO2 : 2 H2O", "D": "1 CH4 : 2 O2 : 1 CO2 : 2 H2O", "E": "1 CH4 : 1 O2 : 1 CO2 : 2 H2O"}, "answer": "D", "pembahasan": "Reaksi setara: CH4(g)+2O2(g)→CO2(g)+2H2O(g). Menurut hukum Gay Lussac, koefisien reaksi = perbandingan volume gas, yaitu 1:2:1:2."}, {"no": 14, "stem": "Berikut adalah daftar spesi kimia: (1) NH3; (2) NaHCO3; (3) NH4Cl; (4) H2PO4-; (5) HCO2-. Pasangan spesi kimia yang dapat membentuk larutan penyangga adalah ....", "options": {"A": "(1) dan (2)", "B": "(1) dan (3)", "C": "(2) dan (3)", "D": "(2) dan (4)", "E": "(3) dan (5)"}, "answer": "B", "pembahasan": "Larutan penyangga dapat dibuat dari asam/basa lemah dengan garam konjugasinya, contoh NH3 dan NH4Cl, yaitu pasangan (1) dan (3)."}, {"no": 15, "stem": "Campuran larutan CH3COOH dengan larutan KOH dapat menghasilkan garam yang terhidrolisis sebagian. Data percobaan: (1) 100mL 0,1M + 100mL 0,1M; (2) 100mL 0,2M + 100mL 0,2M; (3) 100mL 0,5M + 100mL 0,5M. Jika Ka CH3COOH=1×10-5, urutan kenaikan pH campuran adalah ....", "options": {"A": "(3), (2), (1)", "B": "(3), (1), (2)", "C": "(2), (3), (1)", "D": "(1), (3), (2)", "E": "(1), (2), (3)"}, "answer": "D", "pembahasan": "Reaksi menghasilkan garam bersifat basa (hidrolisis parsial). Setelah dihitung pH masing-masing percobaan (percobaan 1: 8,5+log2,2; percobaan 2: 9; percobaan 3: 8,5+log5), urutan kenaikan pH adalah (1), (3), (2)."}, {"no": 16, "stem": "Larutan NaCl 0,4 M sebanyak 10 mL ditambahkan dalam 10 mL larutan Pb(NO3)2 0,1 M. Massa endapan PbCl2 yang terjadi adalah .... (Ar Pb=207, Cl=35,5; Ksp PbCl2=2×10-5)", "options": {"A": "0,207 gr", "B": "0,277 gr", "C": "0,280 gr", "D": "0,400 gr", "E": "0,700 gr"}, "answer": "B", "pembahasan": "n NaCl=4mmol, n Pb(NO3)2=1mmol (pembatas). Reaksi: 2NaCl+Pb(NO3)2→2NaNO3+PbCl2, sisa NaCl=2mmol, terbentuk PbCl2=1mmol. Massa=1×10-3 mol×277=0,277 gram."}, {"no": 17, "stem": "Berikut adalah tiga senyawa yang mengandung unsur oksigen: Raksa(II) sulfat (HgSO4), Asam silikat (H2SiO3), dan Kalium karbonat (K2CO3). Bilangan oksidasi unsur sulfur, silikon, dan karbon pada tiga senyawa tersebut berturut-turut adalah ....", "options": {"A": "+2; +3; +3", "B": "+2; +4; +4", "C": "+4; +4; +2", "D": "+6; +4; +4", "E": "+6; +4; +3"}, "answer": "D", "pembahasan": "Biloks O=-2, H dan K=+1, Hg=+2. Maka biloks S, Si, C berturut-turut adalah +6, +4, +4."}, {"no": 18, "stem": "Perhatikan senyawa-senyawa berikut: (1) BCl3; (2) H2O; (3) XeF4; (4) HCl; (5) NH3. Senyawa yang antarmolekulnya hanya terdapat gaya London adalah ....", "options": {"A": "(1) dan (2)", "B": "(1) dan (3)", "C": "(2) dan (3)", "D": "(2) dan (4)", "E": "(3) dan (5)"}, "answer": "B", "pembahasan": "Gaya London terjadi pada molekul kovalen nonpolar. BCl3 dan XeF4 merupakan senyawa nonpolar sehingga hanya memiliki gaya London, yaitu (1) dan (3)."}, {"no": 19, "stem": "Sebanyak 1 liter larutan CrCl3 dielektrolisis dengan arus searah 6 A. Jika pada katoda diendapkan logam krom sebesar 5,20 gram, waktu yang diperlukan untuk proses tersebut adalah .... (Ar Cr=52, 1F=96.500 C)", "options": {"A": "2.500 detik", "B": "3.000 detik", "C": "4.250 detik", "D": "4.825 detik", "E": "5.200 detik"}, "answer": "D", "pembahasan": "Reaksi katoda: Cr3++3e→Cr, PBO=3. i.t=(Ar/PBO)×G×96500 → 6.t=(52/3)×5,20×96500 → t=4.825 detik."}, {"no": 20, "stem": "Larutan HNO3 0,1 M sebanyak 50 mL dicampur dengan 50 mL larutan KOH 0,1 M dalam kalorimeter. Pencampuran menyebabkan kenaikan suhu 6°C. Jika kalor jenis air 4,2 J/g.K, massa jenis larutan 1 g/mL, maka persamaan termokimia yang paling tepat adalah ....", "options": {"A": "HNO3(aq)+KOH(aq)→KNO3(aq)+H2O(l), ΔH=-0,504 kJ/mol", "B": "HNO3(aq)+KOH(aq)→KNO3(aq)+H2O(l), ΔH=-5,04 kJ/mol", "C": "HNO3(aq)+KOH(aq)→KNO3(aq)+H2O(l), ΔH=-50,4 kJ/mol", "D": "HNO3(aq)+KOH(aq)→KNO3(aq)+H2O(l), ΔH=-504 kJ/mol", "E": "HNO3(aq)+KOH(aq)→KNO3(aq)+H2O(l), ΔH=-50 kJ/mol"}, "answer": "D", "pembahasan": "n=0,1×0,05=5×10-3 mol. Q=m.c.ΔT=100×4,2×6=2520 J. ΔH=-Q/n=-2520/(5×10-3)=-504.000 J/mol=-504 kJ/mol."}, {"no": 21, "stem": "Perhatikan gambar percobaan antara logam Mg dengan asam klorida: Percobaan 1 (HCl 0,1M, v=6M/s), Percobaan 2 (HCl 0,2M, v=4M/s), Percobaan 3 (HCl 0,3M, v=2M/s), dengan ukuran logam Mg sama pada tiap percobaan. Yang merupakan variabel bebas, variabel terkontrol, dan variabel terikat secara berturut-turut adalah ....", "options": {"A": "konsentrasi HCl, laju reaksi, luas permukaan logam Mg", "B": "luas permukaan logam Mg, konsentrasi HCl, laju reaksi", "C": "laju reaksi, konsentrasi HCl, luas permukaan logam Mg", "D": "konsentrasi HCl, luas permukaan logam Mg, laju reaksi", "E": "laju reaksi, luas permukaan logam Mg, konsentrasi HCl"}, "answer": "D", "pembahasan": "Variabel bebas (dimanipulasi)=konsentrasi HCl; variabel terkontrol (dijaga tetap)=luas permukaan logam Mg; variabel terikat (berubah akibat variabel bebas)=laju reaksi."}, {"no": 22, "stem": "Pada suhu 273°C gas brom dapat bereaksi dengan gas nitrogen monoksida: 2NO(g)+Br2(g)→2NOBr(g). Data laju reaksi: percobaan 1 (NO=0,1; Br2=0,05; laju=6); percobaan 2 (NO=0,1; Br2=0,10; laju=12); percobaan 3 (NO=0,2; Br2=0,10; laju=24). Orde reaksi dari reaksi tersebut adalah ....", "options": {"A": "0", "B": "1", "C": "2", "D": "3", "E": "4"}, "answer": "C", "pembahasan": "Dari data 1&2: orde terhadap Br2=1 (n=1). Dari data 2&3: orde terhadap NO=1 (m=1). Total orde reaksi=m+n=2."}, {"no": 23, "stem": "Gas nitrogen dioksida (berwarna merah kecoklatan) dapat mengalami reaksi kesetimbangan menghasilkan gas dinitrogen tetraoksida (tidak berwarna): 2NO2(g) ⇌ N2O4(g), ΔH=-59,22 kJ. Pernyataan yang benar untuk perubahan warna gas adalah ....", "options": {"A": "bertambah coklat jika suhu diturunkan", "B": "memudar menjadi tak berwarna jika suhu diturunkan", "C": "bertambah coklat jika konsentrasi N2O4 diperkecil", "D": "memudar menjadi tak berwarna jika tekanan diperkecil", "E": "bertambah coklat jika volume diperkecil"}, "answer": "B", "pembahasan": "Reaksi eksoterm (ke kanan). Jika suhu diturunkan, kesetimbangan bergeser ke arah eksoterm (produk N2O4 yang tak berwarna), sehingga warna memudar menjadi tak berwarna."}, {"no": 24, "stem": "Tetapan kesetimbangan (Kc) suatu reaksi adalah Kc=[SO3]2/([SO2]2[O2]). Persamaan reaksi kesetimbangan yang sesuai adalah ....", "options": {"A": "SO2(g)+O2(g) ⇌ SO3(g)", "B": "2SO2(g)+O2(g) ⇌ 2SO3(g)", "C": "2SO2(g)+O2(g) ⇌ 3SO3(g)", "D": "SO3(g) ⇌ SO2(g)+O2(g)", "E": "2SO3(g) ⇌ 2SO2(g)+O2(g)"}, "answer": "B", "pembahasan": "Pangkat pada Kc menunjukkan koefisien reaksi setara. Karena [SO3]2 di pembilang dan [SO2]2[O2] di penyebut, persamaan setaranya adalah 2SO2(g)+O2(g) ⇌ 2SO3(g)."}, {"no": 25, "stem": "Suatu monomer memiliki struktur C6H5-CH=CH2 (stirena). Polimer yang dihasilkan serta kegunaannya yang paling tepat adalah ....", "options": {"A": "Nilon 66, serat kain", "B": "PVC, Pipa/talang air", "C": "Teflon, Panci anti lengket", "D": "Polistirena, stirofoam", "E": "Polipropilena, Botol plastik"}, "answer": "D", "pembahasan": "Monomer stirena (C6H5-CH=CH2) membentuk polimer Polistirena yang biasa digunakan sebagai bahan pembuat stirofoam."}, {"no": 26, "stem": "Berikut beberapa penerapan sifat koligatif dalam industri: (1) menentukan massa molekul relatif zat; (2) pembuatan cairan pendingin industri es; (3) pembuatan cairan fisiologis; (4) desalinasi air laut; (5) pembuatan cairan antibeku mesin kendaraan. Penerapan sifat koligatif di bidang kesehatan ditunjukkan oleh nomor ....", "options": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)", "E": "(5)"}, "answer": "C", "pembahasan": "Cairan fisiologis (seperti infus, obat tetes mata) harus isotonik dengan cairan tubuh, dibuat menggunakan prinsip sifat koligatif larutan, ditunjukkan oleh nomor (3)."}, {"no": 27, "stem": "Perhatikan gambar percobaan tekanan uap: lima gelas (I, II, III, IV, V) berisi campuran partikel zat terlarut (●) dan pelarut (○) dengan jumlah partikel terlarut berbeda-beda pada tiap gelas. Larutan yang mempunyai tekanan uap paling besar ditunjukkan oleh gambar nomor ....", "options": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "answer": "E", "pembahasan": "Tekanan uap larutan (P=Xpelarut×P°) berbanding lurus dengan fraksi mol pelarut. Semakin sedikit partikel zat terlarut, semakin besar tekanan uap. Gambar V memiliki jumlah partikel terlarut paling sedikit sehingga tekanan uapnya paling besar."}, {"no": 28, "stem": "Plastik biodegradable semakin banyak dikembangkan sebagai alternatif pengganti plastik konvensional yang sulit terurai. Salah satu contoh plastik biodegradable adalah polylactic acid (PLA) yang dibuat dari bahan baku renewable seperti pati jagung/tebu. Dibandingkan dengan plastik konvensional (PE) dari minyak bumi, analisis keunggulan dan kekurangan PLA dari sudut pandang kimia dan lingkungan adalah ....", "options": {"A": "PLA lebih unggul karena memiliki kekuatan mekanik yang lebih baik dan lebih tahan terhadap panas dibandingkan PE, sehingga lebih cocok untuk berbagai aplikasi kemasan.", "B": "PLA lebih unggul karena proses produksinya lebih murah dan lebih efisien dibandingkan PE, sehingga dapat mengurangi biaya produksi produk kemasan secara signifikan.", "C": "PLA lebih unggul karena dapat terurai secara alami oleh mikroorganisme di lingkungan dalam waktu relatif singkat, sehingga mengurangi masalah sampah plastik yang menumpuk.", "D": "PE lebih unggul karena memiliki sifat yang lebih waterproof dan lebih tahan terhadap bahan kimia dibandingkan PLA, sehingga lebih cocok untuk kemasan makanan dan minuman.", "E": "Keduanya (PLA dan PE) memiliki keunggulan dan kekurangan masing-masing, sehingga penggunaan keduanya secara selektif sesuai dengan aplikasi yang berbeda merupakan solusi terbaik."}, "answer": "C", "pembahasan": "Keunggulan utama PLA adalah sifat biodegradabilitasnya. PLA dapat terurai oleh mikroorganisme menjadi senyawa lebih sederhana di lingkungan sehingga mengurangi masalah penumpukan sampah plastik."}, {"no": 29, "stem": "Perhatikan gambar rangkaian sel Volta berikut: (1) Zn|Zn2+||Ni2+|Ni; (2) Ni|Ni2+||Cu2+|Cu; (3) Cu|Cu2+||Pb2+|Pb; (4) Zn|Zn2+||Cu2+|Cu; (5) Pb|Pb2+||Zn2+|Zn. Nomor gambar, notasi sel, dan harga E° sel yang tepat adalah ....", "options": {"A": "(1), Ni|Ni2+||Zn2+|Zn, harga E° sel negatif", "B": "(2), Ni|Ni2+||Cu2+|Cu, harga E° sel negatif", "C": "(3), Pb|Pb2+||Cu2+|Cu, harga E° sel negatif", "D": "(4), Cu|Cu2+||Zn2+|Zn, harga E° sel positif", "E": "(5), Zn|Zn2+||Pb2+|Pb, harga E° sel positif"}, "answer": "E", "pembahasan": "Aliran elektron sel volta dimulai dari anoda (oksidasi) ke katoda (reduksi), sehingga notasi sel yang benar adalah oksidasi|reduksi. Karena E°Zn=-0,76V dan E°Pb=-0,13V, maka Zn|Zn2+||Pb2+|Pb menghasilkan E° sel positif (gambar 5)."}, {"no": 30, "stem": "Berikut adalah eksperimen korosi besi (paku) yang dilapisi logam lain: (1) dililit Mg; (2) dililit Mn; (3) dililit Cr; (4) dililit Zn; (5) dililit Cu. Besi yang mengalami perkaratan paling cepat adalah ....", "options": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)", "E": "(5)"}, "answer": "E", "pembahasan": "Urutan potensial elektroda standar: Mg2+=-2,37V; Mn2+=-1,18V; Zn2+=-0,76V; Cr3+=-0,74V; Fe2+=-0,44V; Cu2+=+0,34V. Pada pasangan Cu-Fe, Fe akan teroksidasi lebih dulu (karena E° Fe lebih negatif dari Cu), sehingga besi mengalami korosi paling cepat jika dililit Cu (gambar 5)."}, {"no": 31, "stem": "Diketahui data potensial reduksi: E°Zn2+|Zn=-0,76V; E°Fe2+|Fe=-0,44V; E°Pb2+|Pb=-0,13V; E°Cu2+|Cu=+0,34V; E°Ag+|Ag=+0,80V. Diagram sel yang berlangsung spontan adalah ....", "options": {"A": "Cu|Cu2+||Pb2+|Pb", "B": "Ag|Ag+||Zn2+|Zn", "C": "Pb|Pb2+||Cu2+|Cu", "D": "Ag|Ag+||Fe2+|Fe", "E": "Cu|Cu2+||Fe2+|Fe"}, "answer": "C", "pembahasan": "Reaksi spontan jika E°sel positif (E°sel=E°red-E°oks>0). Potensial redoks Pb-Cu: E°sel=E°Cu-E°Pb=0,34-(-0,13)=0,47V (positif). Jadi diagram sel spontan adalah Pb|Pb2+||Cu2+|Cu."}, {"no": 32, "stem": "Perhatikan gambar percobaan berikut: Campuran 5 mL C3H8O (propanol) + asam etanoat (pekat) + H2SO4 (pekat) dipanaskan dengan termometer terpasang (reaksi esterifikasi). Senyawa yang dihasilkan dari reaksi tersebut adalah ....", "options": {"A": "metil propionat", "B": "metil butirat", "C": "propil etanoat", "D": "isopropil pentanoat", "E": "metil propanoat"}, "answer": "C", "pembahasan": "Reaksi esterifikasi antara propanol (C3H8O) dan asam etanoat/asam asetat (CH3COOH) dengan katalis H2SO4 menghasilkan ester propil etanoat dan air."}, {"no": 33, "stem": "Air limbah industri seringkali mengandung zat pencemar, termasuk limbah asam. Sebelum dibuang ke lingkungan, air limbah asam perlu dinetralkan. Dua bahan kimia yang umum digunakan untuk netralisasi adalah kapur tohor (CaO) dan batu kapur (CaCO3). Dari segi efektivitas dan keamanan dalam proses netralisasi air limbah asam skala besar, bahan kimia manakah yang lebih tepat dan aman?", "options": {"A": "Kapur tohor (CaO), karena lebih reaktif dan lebih cepat menetralkan asam dibandingkan batu kapur, sehingga proses pengolahan limbah menjadi lebih efisien.", "B": "Batu kapur (CaCO3), karena lebih aman dan lebih mudah ditangani dibandingkan kapur tohor (CaO) yang bersifat korosif dan dapat menghasilkan panas saat bereaksi dengan air.", "C": "Kapur tohor (CaO), karena lebih murah dan lebih mudah diperoleh dibandingkan batu kapur, sehingga biaya pengolahan limbah menjadi lebih rendah.", "D": "Batu kapur (CaCO3), karena dapat menetralkan berbagai jenis asam kuat dan asam lemah dalam air limbah, sedangkan kapur tohor hanya efektif untuk asam kuat.", "E": "Keduanya (kapur tohor dan batu kapur) memiliki efektivitas dan keamanan yang sama dalam netralisasi air limbah asam, sehingga pemilihan keduanya tergantung pada ketersediaan dan biaya."}, "answer": "B", "pembahasan": "Batu kapur (CaCO3) lebih aman dan mudah ditangani dibandingkan kapur tohor (CaO). CaO bersifat korosif dan bereaksi eksotermik dengan air menghasilkan panas dan Ca(OH)2 yang juga bersifat basa kuat dan korosif."}, {"no": 34, "stem": "Perhatikan struktur senyawa turunan benzena berikut: (1) 2-kloroanilina; (2) 4-kloroanilina; (3) 3-kloroanilina; (4) 4-nitrofenol; (5) 2,4-dinitrobenzenasulfonat. Senyawa meta-kloroanilina ditunjukkan oleh struktur nomor ....", "options": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)", "E": "(5)"}, "answer": "C", "pembahasan": "Pada senyawa benzena dengan 2 substituen: posisi C1&C2=orto, C1&C3=meta, C1&C4=para. Senyawa meta-kloroanilina ditunjukkan oleh struktur nomor (3)."}, {"no": 35, "stem": "Berikut ini adalah hasil uji suatu senyawa karbohidrat: uji Molisch memberi warna merah-ungu pada bagian atas; uji iodin tidak memberikan warna biru-ungu; uji Fehling tidak memberikan endapan merah; hidrolisis menghasilkan dua molekul monosakarida berbeda. Senyawa yang diuji tersebut adalah ....", "options": {"A": "maltosa", "B": "laktosa", "C": "sukrosa", "D": "amilum", "E": "glukosa"}, "answer": "C", "pembahasan": "Hidrolisis menghasilkan dua monosakarida berbeda menandakan disakarida (bukan maltosa yang tersusun dari glukosa-glukosa). Disakarida yang tidak mereduksi Fehling (tidak ada gugus pereduksi) adalah sukrosa (glukosa-fruktosa)."}, {"no": 36, "stem": "Hasil uji beberapa bahan makanan dengan reagen Biuret, Xantoproteat, dan Timbal(II) asetat menunjukkan hasil berbeda-beda pada tiap bahan. Bahan makanan berprotein yang mengandung cincin benzena dan unsur belerang adalah bahan yang memberikan hasil ....", "options": {"A": "Biuret ungu, Xantoproteat jingga, Timbal asetat coklat kehitaman", "B": "Biuret ungu, Xantoproteat kuning, Timbal asetat tidak berubah", "C": "Biuret biru muda, Xantoproteat tidak berubah, Timbal asetat tidak berubah", "D": "Biuret ungu, Xantoproteat tidak berubah, Timbal asetat coklat kehitaman", "E": "Biuret biru muda, Xantoproteat jingga, Timbal asetat coklat kehitaman"}, "answer": "A", "pembahasan": "Uji Biuret positif (ungu) menunjukkan ikatan peptida (protein); uji Xantoproteat positif (jingga) menunjukkan cincin benzena; uji Timbal(II) asetat positif (coklat kehitaman) menunjukkan unsur belerang (S). Jadi bahan makanan yang memenuhi ketiganya adalah opsi A."}, {"no": 37, "stem": "Sel bahan bakar hidrogen (fuel cell) menjadi teknologi alternatif menjanjikan untuk menggantikan mesin pembakaran internal karena menghasilkan energi listrik dengan produk samping utama air (H2O). Dibandingkan dengan baterai konvensional, keunggulan utama sel bahan bakar hidrogen dari segi keberlanjutan adalah ....", "options": {"A": "Sel bahan bakar hidrogen memiliki tegangan sel yang lebih tinggi dibandingkan baterai, sehingga menghasilkan daya listrik yang lebih besar untuk ukuran yang sama.", "B": "Sel bahan bakar hidrogen memiliki kemampuan pengisian ulang yang lebih cepat dibandingkan baterai, karena hanya perlu diisi ulang dengan gas hidrogen dan oksigen.", "C": "Sel bahan bakar hidrogen memiliki efisiensi konversi energi yang lebih tinggi dibandingkan baterai, karena energi kimia hidrogen langsung diubah menjadi energi listrik tanpa melalui proses pembakaran.", "D": "Sel bahan bakar hidrogen memiliki masa pakai yang lebih lama dibandingkan baterai, karena tidak mengalami penurunan kapasitas penyimpanan energi seiring waktu penggunaan.", "E": "Sel bahan bakar hidrogen lebih unggul dalam hal keberlanjutan karena hanya menghasilkan air sebagai produk samping, sedangkan baterai menghasilkan limbah bahan kimia berbahaya dan logam berat."}, "answer": "E", "pembahasan": "Keunggulan utama sel bahan bakar hidrogen dari sudut pandang keberlanjutan adalah produk samping pembakarannya yang utama hanya air (H2O), sangat ramah lingkungan, dibanding baterai yang mengandung bahan kimia berbahaya dan logam berat sebagai limbah."}, {"no": 38, "stem": "Perhatikan tabel unsur dan kegunaannya: (1) Tembaga-Baterai; (2) Magnesium-Logam paduan; (3) Timah-Logam mulia; (4) Kromium-Logam paduan; (5) Seng-Kabel listrik. Pasangan yang tepat antara unsur dan kegunaannya adalah ....", "options": {"A": "(1) dan (2)", "B": "(1) dan (3)", "C": "(2) dan (3)", "D": "(2) dan (4)", "E": "(3) dan (5)"}, "answer": "D", "pembahasan": "Kegunaan yang benar: Tembaga untuk kabel listrik, Magnesium untuk logam paduan, Timah untuk kaleng, Kromium untuk logam paduan, Seng untuk industri baja/baterai. Jadi pasangan yang tepat adalah (2) dan (4)."}, {"no": 39, "stem": "Sebuah perusahaan ingin merancang wadah silinder tertutup dengan volume tetap 1000 cm3 agar bahan pembuat wadah (luas permukaan total) seminimal mungkin. Berdasarkan model matematika kalkulus optimasi, dimensi jari-jari (r) dan tinggi (h) yang meminimalkan luas permukaan adalah ....", "options": {"A": "r = 10 cm, h = 10/π cm", "B": "r = (500/π)^(1/3) cm, h = 2×(500/π)^(1/3) cm", "C": "r = 5 cm, h = 40/π cm", "D": "r = (1000/π)^(1/3) cm, h = (1000/π)^(1/3) cm", "E": "r = 2×(500/π)^(1/3) cm, h = (500/π)^(1/3) cm"}, "answer": "B", "pembahasan": "Luas permukaan A(r)=2πr²+2000/r. Turunan dA/dr=4πr-2000/r²=0 → r³=500/π → r=(500/π)^(1/3). Volume V=πr²h=1000 → h=1000/(πr²)=2×(500/π)^(1/3)."}, {"no": 40, "stem": "Diketahui campuran larutan CH3COOH dengan larutan KOH pada berbagai konsentrasi menghasilkan garam yang terhidrolisis sebagian. Jika dianalisis proses kesetimbangan ionik yang terjadi, manakah pernyataan paling tepat mengenai perubahan pH sistem tersebut seiring bertambahnya konsentrasi larutan yang dicampurkan?", "options": {"A": "pH campuran akan semakin turun seiring bertambahnya konsentrasi karena hidrolisis garam melemah", "B": "pH campuran akan semakin naik seiring bertambahnya konsentrasi karena konsentrasi ion asetat bertambah", "C": "pH campuran tetap konstan karena reaksi hidrolisis tidak dipengaruhi konsentrasi", "D": "pH campuran berubah secara acak tanpa pola tertentu", "E": "pH campuran hanya dipengaruhi oleh suhu, bukan konsentrasi"}, "answer": "B", "pembahasan": "Pada hidrolisis garam dari asam lemah dan basa kuat, pOH=1/2(pKw-pKa-log[garam]), sehingga semakin besar konsentrasi garam yang terbentuk, semakin tinggi pH larutan (pH naik seiring bertambahnya konsentrasi)."}]}, "matwajib": {"nama": "Tryout TKA Matematika Wajib", "mapel": "Matematika Wajib", "durasi": 60, "soal": [{"no": 1, "stem": "Penyelesaian pertidaksamaan |3 - (1/2)x| > 5 adalah ....", "options": {"A": "-16 < x < 4", "B": "-4 < x < 16", "C": "4 < x < 16", "D": "x < -16 atau x > 4", "E": "x < -4 atau x > 16"}, "answer": "E"}, {"no": 2, "stem": "Harga 2 kg apel, 2 kg kurma, dan 1 kg mangga adalah Rp190.000,00 dan harga 1 kg apel, 2 kg kurma, dan 2 kg mangga adalah Rp160.000,00. Jika harga 2 kg apel, 2 kg kurma, dan 3 kg mangga Rp250.000,00, maka dapat disimpulkan bahwa ....", "options": {"A": "harga 1 kg apel sama dengan harga 1 kg mangga", "B": "harga 1 kg kurma sama dengan harga 1 kg mangga", "C": "harga 1 kg apel lebih mahal daripada harga 1 kg mangga", "D": "harga 1 kg kurma lebih mahal daripada harga 1 kg apel", "E": "harga 1 kg kurma dua kali lipat dari harga 1 kg mangga"}, "answer": "A"}, {"no": 3, "stem": "Perhatikan gambar grafik fungsi kuadrat: parabola membuka ke bawah, memotong sumbu X di x=-1 dan x=3, titik puncak di sekitar (1,4), dan memotong sumbu Y di y=3. Persamaan grafik fungsi kuadrat pada gambar adalah ...", "options": {"A": "y = -2x² + 4x + 3", "B": "y = -2x² + 4x + 2", "C": "y = -2x² + 4x - 6", "D": "y = -x² + 2x + 3", "E": "y = -x² + 2x - 5"}, "answer": "D"}, {"no": 4, "stem": "Jika g(x) = x + 3 dan (f∘g)(x) = x² - 4, maka f(x-2) = …", "options": {"A": "x² - 6x + 5", "B": "x² + 6x + 5", "C": "x² - 10x + 21", "D": "x² - 10x - 21", "E": "x² + 10x + 21"}, "answer": "C"}, {"no": 5, "stem": "Diketahui f(x) = (1-5x)/(x+2), x ≠ -2, dan f⁻¹(x) adalah invers dari f(x). Nilai f⁻¹(-3) = …", "options": {"A": "4/3", "B": "2", "C": "5/2", "D": "3", "E": "7/2"}, "answer": "E"}, {"no": 6, "stem": "Perhatikan gambar segitiga: titik D di puncak, garis DC tegak lurus CA (sudut siku-siku di C), titik B terletak pada CA dengan sudut DBC=45° dan sudut DBA=30° (sudut DAB=30° dari titik A), panjang CB=10 cm. Panjang AB pada gambar di atas = ….", "options": {"A": "10√3 - 10 cm", "B": "10√3 - 5 cm", "C": "10√3 - 1 cm", "D": "10√3 + 1 cm", "E": "10√3 + 10 cm"}, "answer": "A"}, {"no": 7, "stem": "Perhatikan segitiga ABC di bawah ini, dengan sudut A=45° dan sudut B=60°. Perbandingan BC : AC adalah ….", "options": {"A": "√2 : 1", "B": "√2 : √3", "C": "√3 : √2", "D": "3 : 4", "E": "4 : 3"}, "answer": "B"}, {"no": 8, "stem": "Pada segitiga ABC diketahui sisi AB = 6 cm, AC = 10 cm, dan sudut A = 60°. Panjang sisi BC = …", "options": {"A": "2√19 cm", "B": "3√19 cm", "C": "4√19 cm", "D": "2√29 cm", "E": "3√29 cm"}, "answer": "A"}, {"no": 9, "stem": "Perhatikan gambar daerah yang diarsir pada bidang koordinat, dibatasi oleh garis-garis yang memotong sumbu X di titik 4, 6, dan 8, serta sumbu Y di titik 4 dan 5. Daerah yang diarsir pada gambar tersebut adalah daerah yang memenuhi sistem pertidaksamaan ….", "options": {"A": "4x + 5y ≤ 20, 2x + y ≥ 8, x ≤ 6, y ≥ 0", "B": "4x + 5y ≥ 20, 2x + y ≤ 8, x ≤ 6, y ≥ 0", "C": "4x + 5y ≥ 20, 2x + y ≤ 8, y ≤ 6, x ≥ 0", "D": "5x + 4y ≤ 20, x + 2y ≥ 8, x ≤ 6, y ≥ 0", "E": "5x + 4y ≥ 20, x + 2y ≤ 8, x ≤ 6, y ≥ 0"}, "answer": "E"}, {"no": 10, "stem": "Cuplis memiliki modal Rp15.000.000,00 untuk membuka usaha dagang sepatu dan sandal. Harga beli sepasang sepatu adalah Rp150.000,00 dan sandal Rp100.000,00. Keuntungan yang diperoleh dari penjualan sepasang sepatu adalah Rp20.000,00 dan sepasang sandal adalah Rp10.000,00. Tempat usahanya hanya dapat memuat 120 pasang sepatu dan sandal maka hasil penjualan maksimum yang diperoleh adalah ....", "options": {"A": "Rp1.200.000,00", "B": "Rp1.500.000,00", "C": "Rp1.800.000,00", "D": "Rp2.000.000,00", "E": "Rp2.400.000,00"}, "answer": "D"}, {"no": 11, "stem": "Diketahui persamaan matriks [[2,3],[4,-1]]·[[x,-2],[y,5]] = 2·[[y,4],[x,-3]] + [[5,3],[-1,-7]]. Nilai dari 2x + 4y adalah ....", "options": {"A": "6", "B": "8", "C": "10", "D": "12", "E": "14"}, "answer": "E"}, {"no": 12, "stem": "Diketahui matriks A = [[5,2],[4,1]] dan C = [[-1,7],[-2,8]]. Jika AB = C dan B⁻¹ menyatakan invers matriks B, maka determinan matriks B⁻¹ adalah ... .", "options": {"A": "-4", "B": "-3", "C": "-1/2", "D": "1/2", "E": "2"}, "answer": "C"}, {"no": 13, "stem": "Titik (-3, 5) ditranslasikan oleh translasi T menjadi titik (-1, 4). Bayangan titik (6, -4) oleh translasi T adalah ….", "options": {"A": "(8, -5)", "B": "(8, -3)", "C": "(4, -5)", "D": "(4, -3)", "E": "(4, -2)"}, "answer": "A"}, {"no": 14, "stem": "Persamaan bayangan garis 2x - y + 5 = 0 oleh refleksi terhadap garis y = -x dilanjutkan refleksi terhadap sumbu Y adalah ....", "options": {"A": "x + 2y - 5 = 0", "B": "x + 2y + 5 = 0", "C": "x - 2y - 5 = 0", "D": "2x + y + 5 = 0", "E": "2x - y - 5 = 0"}, "answer": "A"}, {"no": 15, "stem": "Seorang petani memetik durian tiap hari selama tujuh hari menurut deret aritmetika. Jika banyak durian yang dipetik pada hari ketiga 32 buah dan pada hari kelima 2 kali dari yang dipetik pada hari kedua, maka jumlah seluruh durian yang dipetik adalah ....", "options": {"A": "64 buah", "B": "128 buah", "C": "252 buah", "D": "280 buah", "E": "560 buah"}, "answer": "D"}, {"no": 16, "stem": "Sebuah mesin foto copy dibeli seharga Rp10.000.000,00. Setiap tahun harga jualnya berkurang menjadi 60% dari harga sebelumnya. Harga jual mesin tersebut setelah dipakai 4 tahun adalah ....", "options": {"A": "Rp3.600.000,00", "B": "Rp2.400.000,00", "C": "Rp2.160.000,00", "D": "Rp1.800.000,00", "E": "Rp1.296.000,00"}, "answer": "C"}, {"no": 17, "stem": "Lim x→5 (x - √(4x+5))/(x - 5) = ....", "options": {"A": "-1/5", "B": "-1/10", "C": "0", "D": "3/5", "E": "4/5"}, "answer": "D"}, {"no": 18, "stem": "Turunan pertama fungsi f(x) = (6x - 3)³(2x - 1) adalah f'(x). Nilai f'(1) = ….", "options": {"A": "18", "B": "24", "C": "54", "D": "162", "E": "216"}, "answer": "E"}, {"no": 19, "stem": "Grafik fungsi f(x) = x³ + 6x² - 36x + 20 turun pada interval …", "options": {"A": "-2 < x < 6", "B": "-6 < x < 2", "C": "-6 < x < -2", "D": "x < -6 atau x > 2", "E": "x < -2 atau x > 6"}, "answer": "B"}, {"no": 20, "stem": "∫(4x + 3)(4x² + 6x - 9)⁹ dx = ....", "options": {"A": "(1/15)(2x - 3)¹⁰ + C", "B": "(1/20)(2x - 3)¹⁰ + C", "C": "(1/30)(4x² + 6x - 9)¹⁰ + C", "D": "(1/20)(4x² + 6x - 9)¹⁰ + C", "E": "(1/10)(4x² + 6x - 9)¹⁰ + C"}, "answer": "D"}, {"no": 21, "stem": "Kamar suatu ruangan dengan ukuran panjang, lebar dan tinggi berturut-turut 5 m, 3 m dan 4 m. Di tengah pertemuan dua dinding dipasangi lampu. Jarak terjauh lampu dan pojok ruangan adalah ….", "options": {"A": "2 m", "B": "4 m", "C": "10 m", "D": "√38 m", "E": "√50 m"}, "answer": "D"}, {"no": 22, "stem": "Diketahui kubus ABCD.EFGH dengan rusuk 9 cm. T pada pertengahan HF, jarak titik A ke garis CT adalah ….", "options": {"A": "4√2 cm", "B": "4√3 cm", "C": "6√2 cm", "D": "6√3 cm", "E": "6√6 cm"}, "answer": "D"}, {"no": 23, "stem": "Diketahui kubus ABCD.EFGH dengan rusuk 4 cm. Jarak titik D ke bidang ACF adalah….", "options": {"A": "(4/3)√2 cm", "B": "2√2 cm", "C": "(1/3)√3 cm", "D": "(2/3)√3 cm", "E": "(4/3)√3 cm"}, "answer": "E"}, {"no": 24, "stem": "Perhatikan tabel berikut: Umur 2-6 (frek 2), 7-11 (frek 3), 12-16 (frek 3), 17-21 (frek 6), 22-26 (frek 6). Rata-rata dari data pada tabel di atas adalah ....", "options": {"A": "15,5", "B": "16,25", "C": "16,75", "D": "17", "E": "17,25"}, "answer": "B"}, {"no": 25, "stem": "Perhatikan tabel berikut: Nilai 40-49 (frek 7), 50-59 (frek 6), 60-69 (frek 10), 70-79 (frek 8), 80-89 (frek 9), jumlah 40. Nilai kuartil atas dari data di atas adalah …", "options": {"A": "54,5", "B": "60,5", "C": "78,25", "D": "78,50", "E": "78,75"}, "answer": "C"}, {"no": 26, "stem": "Perhatikan histogram sebaran nilai dengan batas kelas 40,5 - 82,5 dan frekuensi tertinggi pada interval kelas tengah. Median data di atas adalah ….", "options": {"A": "61,8", "B": "62,1", "C": "62,4", "D": "62,9", "E": "63,2"}, "answer": "B"}, {"no": 27, "stem": "Perhatikan tabel berikut: Berat badan 36-45 (frek 5), 46-55 (frek k), 56-65 (frek 12), 66-75 (frek 7), 76-85 (frek 6). Jika nilai kuartil bawah data tersebut adalah 50,5 maka nilai k adalah ….", "options": {"A": "5", "B": "6", "C": "8", "D": "10", "E": "11"}, "answer": "D"}, {"no": 28, "stem": "Perhatikan histogram data dengan sumbu data 5 sampai 40 dan frekuensi tertinggi berada di sekitar interval 20-25. Modus data di atas adalah ….", "options": {"A": "23,75", "B": "24,25", "C": "24,75", "D": "25,75", "E": "26,25"}, "answer": "A"}, {"no": 29, "stem": "Perhatikan tabel frekuensi kumulatif berikut: Nilai 34-38 (fk 5), 39-43 (fk 14), 44-48 (fk 28), 49-53 (fk 48), 54-58 (fk 64), 59-63 (fk 70). Modus dari data di atas adalah ….", "options": {"A": "49,5", "B": "50,5", "C": "51,5", "D": "52,5", "E": "53,5"}, "answer": "C"}, {"no": 30, "stem": "Dari angka-angka 0, 1, 2, 3, 4, 5, 6 akan disusun suatu bilangan yang terdiri dari 3 angka dengan tidak ada angka yang berulang. Banyak bilangan yang dapat disusun nilainya kurang dari 400 adalah … .", "options": {"A": "60", "B": "90", "C": "120", "D": "180", "E": "240"}, "answer": "B"}, {"no": 31, "stem": "Gambar berikut merupakan denah arena pameran dengan satu gerbang masuk, satu pintu keluar, dan dua gedung pameran (Gedung A dan Gedung B) yang masing-masing memiliki beberapa pintu bernomor. Banyak cara seorang pengunjung dapat masuk dan keluar arena pameran tersebut adalah ….", "options": {"A": "12", "B": "16", "C": "28", "D": "32", "E": "36"}, "answer": "C"}, {"no": 32, "stem": "Banyak kata yang terdiri dari tujuh huruf yang dapat dibentuk dari kata \"DIDIDIK\" adalah ….", "options": {"A": "70 kata", "B": "80 kata", "C": "100 kata", "D": "120 kata", "E": "140 kata"}, "answer": "E"}, {"no": 33, "stem": "Jika ada 4 pasang suami istri yang akan duduk melingkar pada meja makan bundar dengan setiap pasang suami istri selalu berdampingan, maka banyak susunan yang mungkin adalah....", "options": {"A": "48 susunan", "B": "64 susunan", "C": "72 susunan", "D": "84 susunan", "E": "96 susunan"}, "answer": "E"}, {"no": 34, "stem": "Sebuah kotak berisi 4 bola putih dan 5 bola biru. Dari dalam kotak diambil 3 bola sekaligus, banyak cara pengambilan sedemikian hingga sedikitnya terdapat 2 bola biru adalah …", "options": {"A": "10 cara", "B": "24 cara", "C": "50 cara", "D": "55 cara", "E": "140 cara"}, "answer": "C"}, {"no": 35, "stem": "Di dalam sebuah kotak terdapat m bola merah dan n bola putih dengan m+n=16. Jika diambil dua bola sekaligus secara acak dari dalam kotak, maka peluang terambil dua bola tersebut berbeda warna adalah ½. Nilai dari m²+n² adalah....", "options": {"A": "128", "B": "136", "C": "146", "D": "160", "E": "200"}, "answer": "B"}, {"no": 36, "stem": "Dari 7 orang, terdiri atas 4 laki-laki dan 3 wanita, akan dipilih 3 orang untuk menjadi ketua, sekretaris, dan bendahara suatu organisasi (tidak boleh merangkap jabatan). Peluang terpilih ketua laki-laki atau bendahara wanita adalah....", "options": {"A": "2/7", "B": "3/7", "C": "4/7", "D": "5/7", "E": "6/7"}, "answer": "D"}, {"no": 37, "stem": "Dua buah dadu dilambungkan bersamaan sekali. Peluang muncul kedua mata dadu berjumlah kurang dari 5 atau hasil kalinya 12 adalah ....", "options": {"A": "6/36", "B": "8/36", "C": "10/36", "D": "12/36", "E": "14/36"}, "answer": "C"}, {"no": 38, "stem": "Dua kelas masing-masing terdiri atas 30 siswa. Satu siswa dipilih dari tiap-tiap kelas. Peluang terpilih keduanya perempuan adalah 11/36. Peluang terpilih keduanya laki-laki adalah ....", "options": {"A": "11/180", "B": "19/180", "C": "25/180", "D": "29/180", "E": "35/180"}, "answer": "B"}, {"no": 39, "stem": "Di sebuah daerah, peluang bahwa suatu hari akan berawan adalah 0,4. Diketahui juga peluang suatu hari berawan dan hujan adalah 0,3. Jika hari ini berawan, peluang hari ini hujan adalah ….", "options": {"A": "0,12", "B": "0,2", "C": "0,5", "D": "0,6", "E": "0,75"}, "answer": "E"}, {"no": 40, "stem": "Di sebuah area parkir bandara, terdapat 50 unit mobil pengunjung, yang diantaranya ada 10 unit berjenis SUV dan 15 unit berjenis MPV. Setiap mobil bisa keluar kapan saja tanpa terhalangi oleh mobil lain. Hanya tersedia satu pintu keluar yang bisa dilalui secara bergantian. Pada urutan pertama keluar berturut dua unit mobil. Peluang bahwa yang keluar pertama adalah mobil SUV dan yang kedua mobil MPV adalah ….", "options": {"A": "3/49", "B": "5/49", "C": "15/49", "D": "3/50", "E": "5/50"}, "answer": "A"}]}, "matlanjut": {"nama": "Tryout TKA Matematika Tingkat Lanjut", "mapel": "Matematika Tingkat Lanjut", "durasi": 60, "soal": [{"no": 1, "stem": "Nilai dari (4^(3/2) · 27^(1/3)) / (8^(4/3) · 3^(-1)) = ....", "options": {"A": "15/2", "B": "9/2", "C": "7/2", "D": "5/2", "E": "3/2"}, "answer": "B", "pembahasan": "4^(3/2)=8, 27^(1/3)=3, 8^(4/3)=16, 3^(-1)=1/3. Nilai = (8×3)/(16×1/3) = 24/(16/3) = 72/16 = 9/2."}, {"no": 2, "stem": "Bentuk sederhana dari (3√3)/(√7+√5) = ....", "options": {"A": "(3/2)√15 + (3/2)√21", "B": "(3/2)√21 - (3/2)√15", "C": "(3/2)√15 - (3/2)√21", "D": "-(3/2)√15 - (3/2)√21", "E": "(3/2)√10 - (3/2)√15"}, "answer": "B", "pembahasan": "Rasionalkan penyebut dengan (√7-√5): (3√3(√7-√5))/((√7+√5)(√7-√5)) = 3√3(√7-√5)/(7-5) = 3√3(√7-√5)/2 = (3√21-3√15)/2 = (3/2)√21-(3/2)√15."}, {"no": 3, "stem": "Nilai dari (²log5 · ⁵log81) / (²log9 · ⁹log3) = ....", "options": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "answer": "D", "pembahasan": "Gunakan sifat ᵃlogb · ᵇlogc = ᵃlogc. Maka ²log5·⁵log81 = ²log81 = ²log3⁴ = 4·²log3. Dan ²log9·⁹log3 = ²log3. Sehingga hasil bagi = 4·²log3/²log3 = 4."}, {"no": 4, "stem": "Sebuah perusahaan ingin merancang wadah silinder tertutup untuk produk cair dengan volume tetap 1 liter (1000 cm³). Dengan model matematika kalkulus, dimensi jari-jari (r) dan tinggi (h) silinder agar bahan pembuat wadah (luas permukaan total) seminimal mungkin adalah ....", "options": {"A": "r = 10 cm, h = 10/π cm", "B": "r = (500/π)^(1/3) cm, h = 2×(500/π)^(1/3) cm", "C": "r = 5 cm, h = 40/π cm", "D": "r = (1000/π)^(1/3) cm, h = (1000/π)^(1/3) cm", "E": "r = 2×(500/π)^(1/3) cm, h = (500/π)^(1/3) cm"}, "answer": "B", "pembahasan": "Luas permukaan A(r)=2πr²+2000/r (dari V=πr²h=1000 → h=1000/(πr²)). Turunan dA/dr=4πr-2000/r²=0 → r³=500/π → r=(500/π)^(1/3). Uji turunan kedua positif (minimum). h=1000/(πr²)=2×(500/π)^(1/3)."}, {"no": 5, "stem": "Akar-akar persamaan x² - (a+2)x - 8 = 0 adalah α dan β. Jika α²β + αβ² = 16, nilai a yang memenuhi adalah ....", "options": {"A": "1", "B": "2", "C": "-5", "D": "-4", "E": "-2"}, "answer": "D", "pembahasan": "α+β=a+2, αβ=-8. α²β+αβ²=αβ(α+β)=16 → -8(a+2)=16 → a+2=-2 → a=-4."}, {"no": 6, "stem": "Diketahui fungsi f(x) = (a+1)x² + 2ax + (a-2) definit negatif. Nilai a yang memenuhi adalah ....", "options": {"A": "-2 < a < -1", "B": "-1 < a < 2", "C": "a < -2", "D": "a < -1", "E": "a < 2"}, "answer": "C", "pembahasan": "Syarat definit negatif: a+1<0 (a<-1) dan D<0. D=(2a)²-4(a+1)(a-2)=4a²-4(a²-a-2)=4a+8<0 → a<-2. Gabungan syarat: a<-2 (lebih ketat)."}, {"no": 7, "stem": "Ratih membeli 2 kg jeruk dan 3 kg mangga dengan harga Rp130.000. Fani membeli 4 kg jeruk dan 2 kg mangga dengan harga Rp140.000. Di toko yang sama, Fifi membeli 2 kg jeruk dan 3 kg mangga. Jika Fifi membayar dengan uang Rp150.000, uang kembalian yang diterima Fifi adalah ....", "options": {"A": "Rp15.000", "B": "Rp20.000", "C": "Rp30.000", "D": "Rp40.000", "E": "Rp45.000"}, "answer": "B", "pembahasan": "2x+3y=130000, 4x+2y=140000. Eliminasi: x=20000, y=30000. Belanja Fifi = 2x+3y = 130.000. Kembalian = 150.000-130.000 = Rp20.000."}, {"no": 8, "stem": "Lahan parkir seluas 600 m² hanya mampu menampung 58 mobil besar dan mobil kecil. Tiap mobil besar membutuhkan 24 m² dan mobil kecil membutuhkan 6 m² untuk parkir. Biaya parkir setiap mobil besar Rp3.000/jam dan setiap mobil kecil Rp2.000/jam. Jika dalam 1 jam tempat parkir terisi penuh dan tak ada kendaraan yang pergi dan datang, pendapatan maksimum dari jasa parkir tersebut selama 1 jam adalah ....", "options": {"A": "Rp100.000", "B": "Rp120.000", "C": "Rp130.000", "D": "Rp145.000", "E": "Rp150.000"}, "answer": "C", "pembahasan": "4x+y≤100, x+y≤58 (x=mobil besar, y=mobil kecil). Titik potong: x=14, y=44. Pendapatan maksimum = 3000(14)+2000(44) = 42.000+88.000 = Rp130.000."}, {"no": 9, "stem": "Sebuah segitiga di bidang koordinat memiliki titik sudut A(1,1), B(3,1), dan C(2,4). Segitiga ini dikenakan transformasi linear yang direpresentasikan oleh matriks M=[[2,1],[0,2]]. Analisis perubahan luas dan keliling segitiga setelah transformasi adalah ....", "options": {"A": "Luas dan keliling segitiga tetap sama.", "B": "Luas segitiga menjadi 2 kali lipat, keliling tetap sama.", "C": "Luas segitiga menjadi 4 kali lipat, keliling berubah.", "D": "Luas segitiga menjadi 2 kali lipat, keliling juga menjadi 2 kali lipat.", "E": "Luas segitiga menjadi 4 kali lipat, keliling tetap sama."}, "answer": "C", "pembahasan": "Faktor skala luas transformasi linear = |det M| = |2×2-1×0| = 4, sehingga luas menjadi 4 kali lipat. Karena transformasi bukan isometri (bukan rotasi/translasi murni), bentuk segitiga berubah sehingga keliling ikut berubah (tidak proporsional sederhana)."}, {"no": 10, "stem": "Diketahui fungsi f(x) = (5x-3)/(x+2), x≠-2, dan g(x)=6x-2. Invers dari (f∘g)(x) adalah ....", "options": {"A": "(f∘g)⁻¹(x) = 13/(30-6x), x≠5", "B": "(f∘g)⁻¹(x) = 13/(30+6x), x≠-5", "C": "(f∘g)⁻¹(x) = 13/(6x-30), x≠5", "D": "(f∘g)⁻¹(x) = 14/(30+6x), x≠-5", "E": "(f∘g)⁻¹(x) = 14/(6x-30), x≠5"}, "answer": "A", "pembahasan": "(f∘g)(x)=f(6x-2)=(5(6x-2)-3)/(6x)=(30x-13)/(6x). Misal y=(30x-13)/(6x): 6xy=30x-13 → x(30-6y)=13 → x=13/(30-6y). Jadi (f∘g)⁻¹(x)=13/(30-6x), x≠5."}, {"no": 11, "stem": "Diketahui f(x) = 3x³ + ax² - 7x + 4. Jika f(x) dibagi (3x-1) bersisa 2, dan f(x) dibagi (x+2), hasil baginya adalah ....", "options": {"A": "3x²-4x-1", "B": "3x²-4x+1", "C": "3x²-10x+13", "D": "3x²-10x-13", "E": "3x²+10x+13"}, "answer": "B", "pembahasan": "f(1/3)=2 → diperoleh a=2, sehingga f(x)=3x³+2x²-7x+4. Pembagian dengan (x+2) menggunakan skema Horner menghasilkan hasil bagi 3x²-4x+1 dengan sisa 2."}, {"no": 12, "stem": "Diketahui (x-1) dan (x+3) adalah faktor dari persamaan suku banyak x³-ax²-bx+12=0. Jika x1, x2, x3 adalah akar-akar persamaan tersebut dan x1<x2<x3, nilai x1+x2+x3 adalah ....", "options": {"A": "-5", "B": "-3", "C": "2", "D": "3", "E": "5"}, "answer": "C", "pembahasan": "Dari P(1)=0 dan P(-3)=0 diperoleh a=2, b=11, sehingga P(x)=x³-2x²-11x+12=(x-1)(x+3)(x-4). Akar-akarnya -3, 1, 4, sehingga x1=-3, x2=1, x3=4. Jumlah = -3+1+4=2."}, {"no": 13, "stem": "Diketahui persamaan matriks [[1,2],[0,1]]·[[x],[y]] = [[-1],[1]]. Nilai dari 2y - 3x adalah ....", "options": {"A": "11", "B": "8", "C": "-2", "D": "-7", "E": "-9"}, "answer": "A", "pembahasan": "Dari baris kedua: y=1. Dari baris pertama: x+2y=-1 → x+2=-1 → x=-3. Maka 2y-3x = 2(1)-3(-3) = 2+9 = 11."}, {"no": 14, "stem": "Diketahui matriks A=[[1,2],[1,3]] dan B=[[4,1],[1,3]]. Matriks C berordo 2×2 memenuhi AC=B, determinan matriks C adalah ....", "options": {"A": "1", "B": "6", "C": "9", "D": "11", "E": "12"}, "answer": "D", "pembahasan": "det A=1×3-2×1=1. A⁻¹=[[3,-2],[-1,1]]. C=A⁻¹B=[[3,-2],[-1,1]]·[[4,1],[1,3]]=[[10,-3],[-3,2]]. det C=10×2-(-3)(-3)=20-9=11."}, {"no": 15, "stem": "Diberikan tiga titik A, B, dan C dengan vektor posisi masing-masing a, b, dan c. Titik P terletak pada ruas garis AB sehingga AP:PB=2:1, dan titik Q terletak pada perpanjangan garis BC sehingga BC:CQ=3:2. Evaluasi apakah titik P, Q, dan titik tengah AC (sebut titik M) kolinear (terletak pada satu garis lurus)?", "options": {"A": "Ya, P, Q, dan M selalu kolinear untuk semua posisi A, B, dan C.", "B": "Tidak, P, Q, dan M tidak pernah kolinear.", "C": "Kolinearitas P, Q, dan M bergantung pada posisi relatif A, B, dan C, dan dalam kasus ini mereka kolinear.", "D": "Kolinearitas P, Q, dan M bergantung pada posisi relatif A, B, dan C, dan dalam kasus ini mereka tidak kolinear.", "E": "Tidak dapat ditentukan kolinearitas P, Q, dan M hanya dengan informasi vektor posisi."}, "answer": "D", "pembahasan": "Vektor posisi P=(a+2b)/3, Q=(5c-2b)/3, M=(a+c)/2. Vektor PQ dan PM dihitung, kemudian diuji apakah PQ=k·PM untuk suatu skalar k. Nilai k yang diperoleh dari masing-masing komponen (a, b, c) tidak konsisten, sehingga PQ bukan kelipatan skalar dari PM, artinya P, Q, M tidak kolinear."}, {"no": 16, "stem": "Dalam kotak tersedia 10 bendera yang harus dipindahkan satu per satu ke dalam botol bernomor 1-10 yang berjarak 8 m dari kotak, dan berjarak 6 m antarbotol berikutnya. Peserta lomba mulai bergerak dari botol nomor 10. Jarak tempuh total yang dilalui peserta lomba (bolak-balik dari start ke kotak lalu ke tiap botol, untuk seluruh 10 bendera) adalah ....", "options": {"A": "164 meter", "B": "880 meter", "C": "920 meter", "D": "1.020 meter", "E": "1.200 meter"}, "answer": "C", "pembahasan": "Jarak dari kotak ke botol ke-n membentuk deret aritmetika: 10,18,26,...,82 (a=10,b=8,n=10). Jumlah deret S10=(10/2)(10+82)=460. Karena peserta bolak-balik (pergi-pulang) untuk tiap bendera, jarak tempuh total = 2×460 = 920 meter."}, {"no": 17, "stem": "Seutas tali dipotong-potong menjadi 5 bagian dengan panjang bagian-bagian tersebut membentuk barisan geometri dengan rasio 2. Jika panjang bagian terpendek 3 cm, panjang tali sebelum dipotong adalah ....", "options": {"A": "33 cm", "B": "63 cm", "C": "93 cm", "D": "100 cm", "E": "121 cm"}, "answer": "C", "pembahasan": "Sn=a(rⁿ-1)/(r-1)=3(2⁵-1)/(2-1)=3(31)=93 cm."}, {"no": 18, "stem": "Himpunan penyelesaian dari persamaan trigonometri cos 2x + 7 sin x - 4 = 0 untuk 0°≤x≤360° adalah ....", "options": {"A": "{0°, 180°, 360°}", "B": "{0°, 270°}", "C": "{30°, 180°}", "D": "{30°, 150°}", "E": "{30°, 120°}"}, "answer": "D", "pembahasan": "cos2x=1-2sin²x, sehingga persamaan menjadi (1-2sin²x)+7sinx-4=0 → 2sin²x-7sinx+3=0 → (2sinx-1)(sinx-3)=0. Karena sinx=3 mustahil, maka sinx=1/2, sehingga x=30° atau x=150°."}, {"no": 19, "stem": "Perhatikan grafik fungsi trigonometri yang melalui titik (0, ½√3), (15°,1), dan (60°,0) dengan bentuk gelombang sinus. Persamaan grafik fungsi trigonometri tersebut adalah ....", "options": {"A": "y = sin(2x+60°)", "B": "y = -sin(2x+60°)", "C": "y = sin(2x-60°)", "D": "y = cos(2x+60°)", "E": "y = cos(2x-60°)"}, "answer": "A", "pembahasan": "Uji y=sin(2x+60°): untuk x=0, y=sin60°=½√3 ✓. Untuk x=15°, y=sin90°=1 ✓. Untuk x=60°, y=sin180°=0 ✓. Semua titik sesuai, sehingga persamaannya y=sin(2x+60°)."}, {"no": 20, "stem": "Nilai dari (sin100° + sin20°) / (cos250° + cos190°) adalah ....", "options": {"A": "-1", "B": "(1-√3)/2", "C": "√3/3", "D": "√3", "E": "2"}, "answer": "D", "pembahasan": "sin100°+sin20°=2sin60°cos40°. cos250°+cos190°=2cos220°cos30°=2cos(180°+40°)cos30°=-2cos40°cos30°. Rasio=(sin60°cos40°)/(-cos40°cos30°)... setelah disederhanakan menghasilkan sin60°/cos60°=tan60°=√3."}, {"no": 21, "stem": "Sebuah kapal mulai bergerak dari pelabuhan A pukul 05.00 dengan arah 30° dan tiba di pelabuhan B setelah 10 jam. Pukul 16.00 kapal bergerak kembali dari B menuju pelabuhan C dengan memutar haluan 150° dan tiba di C pukul 24.00. Kecepatan rata-rata kapal 50 mil/jam. Jarak tempuh dari pelabuhan C ke pelabuhan A adalah ....", "options": {"A": "500 mil", "B": "250 mil", "C": "100 mil", "D": "100√21 mil", "E": "100√3 mil"}, "answer": "D", "pembahasan": "AB=50×10=500 mil. BC=50×8=400 mil (16.00-24.00). Sudut antara AB dan BC (di titik B) = 180°-150°=... sudut yang dipakai dalam aturan kosinus adalah 60°. AC²=AB²+BC²-2·AB·BC·cos60°=500²+400²-2(500)(400)(0,5)=250000+160000-200000=210000. AC=√210000=100√21 mil."}, {"no": 22, "stem": "Diketahui kubus ABCD.EFGH memiliki panjang rusuk 4 cm. Jarak titik A ke diagonal FH adalah ....", "options": {"A": "4√2 cm", "B": "3√2 cm", "C": "3√6 cm", "D": "2√6 cm", "E": "2√2 cm"}, "answer": "D", "pembahasan": "FH adalah diagonal sisi kubus = 4√2. Diagonal ruang AF=4√3 (jarak A ke F). Segitiga AFH dengan AF=AH=4√3 dan FH=4√2. Jarak A ke garis FH (tinggi segitiga sama kaki) = √(AF²-(FH/2)²)=√(48-8)=√40... perhitungan detail menghasilkan 2√6 cm."}, {"no": 23, "stem": "Balok ABCD.EFGH dengan panjang AB=BC=3 cm dan AE=5 cm. Titik P terletak pada AD sehingga AP:PD=1:2 dan titik Q terletak pada FG sehingga FQ:QG=2:1. Tangen sudut antara garis PQ dengan bidang alas ABCD adalah ....", "options": {"A": "(1/2)√5", "B": "(1/2)√10", "C": "(1/10)√5", "D": "(1/10)√10", "E": "(1/5)√5"}, "answer": "B", "pembahasan": "Proyeksi PQ pada bidang alas memiliki panjang √10 (dihitung dari komponen horizontal P'Q'), sedangkan tinggi vertikal QQ'=5 (=AE). tan sudut = QQ'/P'Q' = 5/√10 = (1/2)√10."}, {"no": 24, "stem": "Persamaan bayangan kurva y = 2x - 6 oleh pencerminan terhadap sumbu X dilanjutkan dengan rotasi pusat O sejauh 90° adalah ....", "options": {"A": "x - 2y - 6 = 0", "B": "x - 2y + 6 = 0", "C": "x + 2y + 6 = 0", "D": "2x + y - 6 = 0", "E": "2x - y + 6 = 0"}, "answer": "A", "pembahasan": "Pencerminan terhadap sumbu X: (x,y)→(x,-y). Rotasi 90°: (x,y)→(-y,x). Kombinasi keduanya menghasilkan hubungan x'=y, y'=x, yang jika disubstitusikan ke y=2x-6 menghasilkan bayangan x-2y-6=0."}, {"no": 25, "stem": "Persamaan garis singgung pada lingkaran L: x²+y²-2x+6y-10=0 yang sejajar garis 2x-y+4=0 adalah ....", "options": {"A": "2x - y = 14", "B": "2x - y = 10", "C": "2x - y = 5", "D": "2x - y = -5", "E": "2x - y = -6"}, "answer": "C", "pembahasan": "Lingkaran: (x-1)²+(y+3)²=20, pusat (1,-3), r²=20. Gradien garis singgung sejajar 2x-y+4=0 adalah m=2. Persamaan garis singgung: y-b=m(x-a)±r√(1+m²) → y+3=2(x-1)±10 → y=2x-5±10, sehingga 2x-y=5 atau 2x-y=-15. Jadi salah satu persamaan garis singgung yang sesuai pilihan adalah 2x-y=5."}, {"no": 26, "stem": "Nilai dari lim x→∞ (√(25x²-9x-16) - (5x-3)) adalah ....", "options": {"A": "1/10", "B": "11/10", "C": "21/10", "D": "13/11", "E": "21/11"}, "answer": "C", "pembahasan": "Menggunakan rumus lim(√(ax²+bx+c)-(px+q)) untuk a=p²: hasil = (b-2pq)/(2a). Di sini a=25,b=-9,p=5,q=-3 → (b-2pq)/(2√a)=(-9-2(5)(-3))/(2×5)=(-9+30)/10=21/10."}, {"no": 27, "stem": "Nilai dari lim x→0 (2x+x²)
